# T-081 (ASVS 2.1.8): keycloak.v2 giriş temasının üstüne parola gücü göstergesi. Şablon (.ftl) değiştirilmez;
# gösterge yalnız kayıt (kc-register-form) ve parola güncelleme (kc-passwd-update-form) sayfalarında çalışır.
# Metinler: messages/messages_tr.properties ve resources/js/strength-i18n.js, packages/messages/tr.json'dan üretilir
# (node infra/keycloak/generate.mjs; CI --check ile kayma denetler).
parent=keycloak.v2
import=common/keycloak

# keycloak.v2 styles değeri korunur, tema CSS'i eklenir.
styles=css/styles.css css/yanimda.css
