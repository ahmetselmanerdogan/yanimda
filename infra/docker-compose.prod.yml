# T-083 staging / üretim (tek VPS). Veritabanı ve Redis yönetilen hizmettir (Terraform: infra/terraform);
# bu dosya yalnız durumsuz uygulama süreçlerini ve ters vekili çalıştırır. Sır yok: tüm değerler .env.prod'dan
# (şablon: infra/.env.prod.example; dosya VPS'te 0600, git'e girmez).
#
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml --profile family-web up -d   # aile web hazır olunca
#
# İzleme ayrı dosyada (aynı "yanimda" ağına katılır): infra/monitoring/docker-compose.monitoring.yml
name: yanimda

# T-081 (ASVS 9.2.2, 1.9.2): yönetilen Postgres/Redis sunucu CA paketi (RDS + DCS CA, PEM). İstemciler sunucuyu
# doğrular: DATABASE_URL ...sslmode=verify-full&sslrootcert=/etc/yanimda/tls/ca.pem, REDIS_URL rediss://,
# Keycloak JDBC verify-full. Dosya ortama özgü, git dışı (infra/tls/).
x-internal-ca: &internal_ca ${INTERNAL_CA_FILE:-./tls/ca.pem}:/etc/yanimda/tls/ca.pem:ro

x-api: &api
  image: ${API_IMAGE:?API_IMAGE gerekli (ör. ghcr.io/org/yanimda-api:1.2.3)}
  env_file: [.env.prod]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  volumes: [*internal_ca]
  stop_grace_period: 30s
  logging: &logging
    driver: json-file
    options: { max-size: 20m, max-file: '5' }
  # Ayrık /health ucu yok (bkz. README "Takip"): kimlik isteyen ucuz bir uç 401 döner = süreç ve yönlendirme ayakta.
  # 5xx/bağlantı hatası = sağlıksız. Metrik portu (9464) yalnız iç ağda; Caddy'de yayınlanmaz.
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3000/v1/queue').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  # Genel HTTP API (2 kopya). Outbox işçisi kapalı: ayrı "worker" süreci kirayı tutar. Sıcak yedek isteniyorsa
  # API_OUTBOX_WORKER=on → kopyalar da kirayı bekler (event.outbox_lease), işçi ölürse 30 sn'de devralır.
  api:
    <<: *api
    environment:
      NODE_ENV: production
      PORT: '3000'
      METRICS_PORT: '9464'
      OUTBOX_WORKER: ${API_OUTBOX_WORKER:-off}
      # T-081: Caddy arkasında gerçek istemci IP'si (hız sınırı, IP başına anahtar).
      TRUST_PROXY: '1'
      # T-081: URL'de sslmode olmasa da Postgres TLS + sunucu doğrulaması; rediss:// için aynı CA.
      PGSSLMODE: verify-full
      NODE_EXTRA_CA_CERTS: /etc/yanimda/tls/ca.pem
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '1.5', memory: 1g }

  # Outbox işçisi (T-010): aynı imaj, OUTBOX_WORKER=on. Tek aktif işçi kirayla garanti edilir. Olay geçişleri
  # (signal_to_screen vb. metrikler) bu süreçte ölçülür → Prometheus bunu da kazır. HTTP portu yayınlanmaz.
  worker:
    <<: *api
    environment:
      NODE_ENV: production
      PORT: '3000'
      METRICS_PORT: '9464'
      OUTBOX_WORKER: 'on'
      PGSSLMODE: verify-full
      NODE_EXTRA_CA_CERTS: /etc/yanimda/tls/ca.pem
    deploy:
      resources:
        limits: { cpus: '1', memory: 768m }

  # Operatör konsolu: statik Vite derlemesi (infra/console/Dockerfile), :8080, root değil.
  console:
    image: ${CONSOLE_IMAGE:?CONSOLE_IMAGE gerekli}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3

  # Aile web uygulaması (apps/family-web henüz yok): profil ile isteğe bağlı.
  family-web:
    profiles: [family-web]
    image: ${FAMILY_WEB_IMAGE:-yanimda/family-web:placeholder}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3

  # Kimlik (T-020). Veritabanı: aynı yönetilen Postgres'te ayrı "keycloak" veritabanı ve kullanıcısı.
  # Realm'ler ilk açılışta içe aktarılır (varsa atlanır). Realm yer tutucuları (yönlendirme adresleri, sslRequired,
  # SMTP) aşağıdaki YANIMDA_* değişkenlerinden (T-081, ASVS 5.1.5). Tema + kara liste: infra/keycloak.
  # Kök FS yazılabilir (Quarkus yeniden derleme çıktısı); Helm'de salt okunur (initContainer + emptyDir).
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0}
    command: ['start', '--import-realm']
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    environment:
      YANIMDA_KC_SSL_REQUIRED: all
      YANIMDA_CONSOLE_URL: https://console.${DOMAIN}
      YANIMDA_CONSOLE_EXTRA_REDIRECT: https://console.${DOMAIN}/*
      YANIMDA_FAMILY_WEB_URL: https://aile.${DOMAIN}
      YANIMDA_FAMILY_APP_EXTRA_REDIRECT: app.yanimda.family:/oauth2redirect
      YANIMDA_KC_SMTP_HOST: ${KC_SMTP_HOST:?KC_SMTP_HOST gerekli}
      YANIMDA_KC_SMTP_PORT: ${KC_SMTP_PORT:-587}
      YANIMDA_KC_SMTP_FROM: ${KC_SMTP_FROM:-noreply@${DOMAIN}}
      YANIMDA_KC_SMTP_STARTTLS: 'true'
      YANIMDA_KC_SMTP_AUTH: 'true'
      YANIMDA_KC_SMTP_USER: ${KC_SMTP_USER:?KC_SMTP_USER gerekli}
      YANIMDA_KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:?KC_SMTP_PASSWORD gerekli}
      KC_DB: postgres
      # sslmode=verify-full&sslrootcert=/etc/yanimda/tls/ca.pem (.env.prod.example)
      KC_DB_URL: ${KC_DB_URL:?KC_DB_URL gerekli}
      KC_DB_USERNAME: ${KC_DB_USERNAME:?KC_DB_USERNAME gerekli}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD gerekli}
      KC_HOSTNAME: https://auth.${DOMAIN:?DOMAIN gerekli}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_BOOTSTRAP_ADMIN_USERNAME gerekli}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD gerekli}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes/yanimda:/opt/keycloak/themes/yanimda:ro
      # Tohum liste; ihlal listesiyle birleştirilmiş sürüm için KC_BLACKLIST_DIR (infra/README.md "Kara liste")
      - ${KC_BLACKLIST_DIR:-./keycloak/password-blacklists}:/opt/keycloak/data/password-blacklists:ro
      - *internal_ca
    healthcheck:
      # İmajda curl yok: yönetim portu 9000'e bash /dev/tcp ile.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: '1', memory: 1g }

  # TLS sonlandırma ve yönlendirme; sertifikalar otomatik (ACME), caddy_data biriminde.
  # T-081: salt okunur kök, yalnız 80/443 bağlama yetkisi (yerelde docker --read-only --cap-drop ALL ile doğrulandı).
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN gerekli}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL gerekli}
      KC_ADMIN_ALLOW_CIDRS: ${KC_ADMIN_ALLOW_CIDRS:-127.0.0.1/32}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api: { condition: service_started }
      console: { condition: service_started }

  # Sentetik izleme (T-083 §5): 5 dk'da bir TEST SOS'u + sağlık uçları. Ayrıntı: infra/README.md "Sentetik".
  # Uygulama sırları (.env.prod) bu kaba verilmez; yalnız sondanın değişkenleri.
  synthetic:
    image: node:26-alpine
    restart: unless-stopped
    user: node
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      SYNTHETIC_API_URL: ${SYNTHETIC_API_URL:-https://api.${DOMAIN}}
      SYNTHETIC_OIDC_ISSUER: ${SYNTHETIC_OIDC_ISSUER:-https://auth.${DOMAIN}/realms/consumers}
      SYNTHETIC_CLIENT_ID: ${SYNTHETIC_CLIENT_ID:-yanimda-synthetic}
      SYNTHETIC_CLIENT_SECRET: ${SYNTHETIC_CLIENT_SECRET:?SYNTHETIC_CLIENT_SECRET gerekli}
      SYNTHETIC_PERSON_IDS: ${SYNTHETIC_PERSON_IDS:?SYNTHETIC_PERSON_IDS gerekli}
      SYNTHETIC_TIMEOUT_SEC: ${SYNTHETIC_TIMEOUT_SEC:-60}
      SYNTHETIC_ENV: ${ENVIRONMENT:-staging}
      PUSHGATEWAY_URL: ${PUSHGATEWAY_URL:-http://pushgateway:9091}
      UPTIME_KUMA_PUSH_URL: ${UPTIME_KUMA_PUSH_URL:-}
      SYNTHETIC_INTERVAL_SEC: ${SYNTHETIC_INTERVAL_SEC:-300}
    volumes: ['./synthetic/probe.mjs:/probe/probe.mjs:ro']
    command: ['sh', '-c', 'while true; do node /probe/probe.mjs || true; sleep "$${SYNTHETIC_INTERVAL_SEC}"; done']
    logging: *logging

  # Günlük mantıksal yedek (pg_dump → S3). PITR yönetilen RDS'te; bu ek, sağlayıcıdan bağımsız kopya.
  backup:
    build: { context: ./backup }
    image: yanimda-backup:local
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    # Döküm çalışma dizini (pg-backup.sh WORKDIR=/tmp) diskte; kök FS salt okunur. BACKUP_DATABASE_URL verify-full.
    volumes: ['backup_work:/tmp', *internal_ca]
    # Uygulama sırları verilmez; yalnız yedek değişkenleri. Dökümü okuma yetkili ayrı kullanıcı alır (README).
    environment:
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?BACKUP_DATABASE_URL gerekli}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET gerekli}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-pg/staging}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:?BACKUP_S3_ACCESS_KEY gerekli}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:?BACKUP_S3_SECRET_KEY gerekli}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-tr-west-1}
      PUSHGATEWAY_URL: ${PUSHGATEWAY_URL:-http://pushgateway:9091}
      BACKUP_AT: ${BACKUP_AT:-03:15}
    command: ['/opt/backup/schedule.sh']
    logging: *logging

networks:
  default:
    name: yanimda

volumes:
  caddy_data: {}
  caddy_config: {}
  backup_work: {}
