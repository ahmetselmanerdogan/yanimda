# T-083 izleme (tek compose): Prometheus + Alertmanager + Grafana + Loki/Promtail + dışa aktarıcılar + Pushgateway
# + Uptime Kuma (durum sayfası). Uygulama compose'unun "yanimda" ağına katılır (önce o ayağa kalkmalı).
#
#   docker compose --env-file infra/.env.prod -f infra/monitoring/docker-compose.monitoring.yml up -d
#
# Hiçbir arayüz genel ağa açılmaz: Grafana/Prometheus/Alertmanager yalnız 127.0.0.1 (SSH tüneli). Uptime Kuma
# durum sayfası Caddy üzerinden status.<DOMAIN>. Alertmanager sırları ./secrets/ altında dosya (git'e girmez).
name: yanimda-monitoring

x-logging: &logging
  driver: json-file
  options: { max-size: 20m, max-file: '3' }

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=20GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    ports: ['127.0.0.1:9093:9093']
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:9093/-/ready']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # Sentetik sonda, yedek ve geri yükleme tatbikatı metrikleri buraya itilir (diskte kalıcı).
  pushgateway:
    image: prom/pushgateway:v1.10.0
    restart: unless-stopped
    command: ['--persistence.file=/data/pushgateway.db', '--persistence.interval=1m']
    volumes: ['pushgateway_data:/data']
    logging: *logging

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    # infra/grafana/konsol.json içe aktarma şablonudur (${DS_PROMETHEUS}); hazırlıkta sabit veri kaynağı uid'ine çevrilir.
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /var/lib/grafana/dashboards &&
        sed 's/[$$]{DS_PROMETHEUS}/prometheus/g' /dashboards-src/konsol.json > /var/lib/grafana/dashboards/konsol.json &&
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD gerekli}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana:/dashboards-src:ro
      - grafana_data:/var/lib/grafana
    ports: ['127.0.0.1:3001:3000']
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki-config.yml']
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3100/ready']
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging

  # Kap günlükleri → Loki. Uygulama log'larında PII yok (CLAUDE.md); yine de yalnız yanimda projesi toplanır.
  promtail:
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    command: ['-config.file=/etc/promtail/promtail-config.yml']
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|srv/yanimda/docker/.+)($$|/)
    pid: host
    volumes: ['/:/host:ro,rslave']
    logging: *logging

  # Yönetilen Postgres: bağlantı + iş metrikleri (outbox birikimi, kuyruk bekleme, CPaaS/bildirim hata oranı).
  # T-081: DSN sslmode=verify-full&sslrootcert=/etc/yanimda/tls/ca.pem (.env.prod.example); iç CA infra/tls/.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${PG_EXPORTER_DSN:?PG_EXPORTER_DSN gerekli}
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    volumes:
      - ./postgres-exporter-queries.yml:/etc/postgres-exporter/queries.yml:ro
      - ${INTERNAL_CA_FILE:-../tls/ca.pem}:/etc/yanimda/tls/ca.pem:ro
    logging: *logging

  # T-081: DCS salt okunur ACL hesabı + TLS (rediss://, iç CA ile doğrulama).
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: ${REDIS_EXPORTER_ADDR:?REDIS_EXPORTER_ADDR gerekli}
      REDIS_USER: ${REDIS_EXPORTER_USER:-}
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:-}
      REDIS_EXPORTER_TLS_CA_CERT_FILE: /etc/yanimda/tls/ca.pem
    volumes: ['${INTERNAL_CA_FILE:-../tls/ca.pem}:/etc/yanimda/tls/ca.pem:ro']
    logging: *logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command: ['--config.file=/etc/blackbox/blackbox.yml']
    volumes: ['./blackbox.yml:/etc/blackbox/blackbox.yml:ro']
    logging: *logging

  # Durum sayfası (T-083 §6). İlk kurulumda yönetici hesabı arayüzden; izleyiciler README'de.
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.15
    restart: unless-stopped
    volumes: ['uptime_kuma_data:/app/data']
    logging: *logging

networks:
  default:
    name: yanimda
    external: true

volumes:
  prometheus_data: {}
  alertmanager_data: {}
  pushgateway_data: {}
  grafana_data: {}
  loki_data: {}
  uptime_kuma_data: {}
