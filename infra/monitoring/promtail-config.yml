# T-083 Promtail: yalnız yanimda ve yanimda-monitoring compose projelerinin kap günlükleri → Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ['com.docker.compose.project=yanimda', 'com.docker.compose.project=yanimda-monitoring']
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
    pipeline_stages:
      # Nest log satırları: seviye etiketi (LOG/WARN/ERROR) çıkarılır; içerik olduğu gibi (PII yazılmaz kuralı).
      - regex:
          expression: '\s(?P<level>LOG|WARN|ERROR|DEBUG|VERBOSE)\s'
      - labels:
          level:
