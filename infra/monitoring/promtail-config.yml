# T-083 Promtail: yalnız yanimda ve yanimda-monitoring compose projelerinin kap günlükleri → Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ['com.docker.compose.project=yanimda', 'com.docker.compose.project=yanimda-monitoring']
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
    pipeline_stages:
      # Nest log satırları: seviye etiketi (LOG/WARN/ERROR) çıkarılır; içerik olduğu gibi (PII yazılmaz kuralı).
      - regex:
          expression: '\s(?P<level>LOG|WARN|ERROR|DEBUG|VERBOSE)\s'
      - labels:
          level:
      # T-081 (ASVS 9.2.5): arka uç TLS hataları → promtail_custom_backend_tls_errors_total (Prometheus "promtail"
      # işi, BackendTlsErrors uyarısı). Node kodları safeError ile loglanır (ör. Error(SELF_SIGNED_CERT_IN_CHAIN));
      # ioredis mesajı, Keycloak JDBC (PKIX / SSL error). Yalnız eşleşen ifade sayılır, içerik etiket olmaz.
      - regex:
          expression: '(?P<tls_error>(?i:CERT_[A-Z_]+|UNABLE_TO_VERIFY_[A-Z_]+|SELF_SIGNED_CERT[A-Z_]*|ERR_TLS_[A-Z_]+|ERR_SSL_[A-Z_]+|self[- ]signed certificate|certificate has expired|PKIX path|SSLHandshakeException|SSL error))'
      - metrics:
          backend_tls_errors_total:
            type: Counter
            description: 'Arka uç TLS doğrulama/el sıkışma hatası içeren log satırları'
            source: tls_error
            config:
              action: inc
