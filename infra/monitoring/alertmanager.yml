# T-083 Alertmanager: critical → PagerDuty + Telegram + e-posta; warning → Telegram + e-posta.
# Sırlar dosyadan (./secrets → /etc/alertmanager/secrets, git'e girmez). Adres/sohbet kimliği ortama göre değiştirilir.
global:
  smtp_smarthost: smtp.example.com:587
  smtp_from: alerts@yanimda.example
  smtp_auth_username: alerts@yanimda.example
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true
  resolve_timeout: 5m

route:
  receiver: email
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: pagerduty
      repeat_interval: 30m
      continue: true
    - matchers: ['severity=~"critical|warning"']
      receiver: telegram
      continue: true
    - matchers: ['severity=~"critical|warning"']
      receiver: email

inhibit_rules:
  # Aynı uyarının kritik hali uyarı seviyesini bastırır; tüm API düştüyse tekil kopya uyarıları susar.
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname]
  - source_matchers: ['alertname="ApiAllInstancesDown"']
    target_matchers: ['alertname="ApiInstanceDown"']

receivers:
  - name: email
    email_configs:
      - to: ops@yanimda.example
        send_resolved: true

  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id: -1000000000000
        parse_mode: HTML
        send_resolved: true

  - name: pagerduty
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        send_resolved: true
