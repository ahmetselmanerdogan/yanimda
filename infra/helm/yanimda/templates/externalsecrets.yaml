{{- /*
T-081 (ASVS 6.4.1): chart'ın beklediği her existingSecret'ı External Secrets Operator Vault'tan üretir. Sır değeri
bu chart'ta ve git'te yok; Vault'ta <keyPrefix>/<secret adı> yolundaki tüm anahtarlar Secret'a kopyalanır.
Anahtar listeleri: values.yaml yorumları (api: DATABASE_URL, REDIS_URL, FIELD_ENC_KEYS …).
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- $prefix := $es.keyPrefix | default (printf "yanimda/%s" .Release.Namespace) }}
{{- $secrets := list .Values.api.existingSecret }}
{{- if .Values.keycloak.enabled }}{{ $secrets = append $secrets .Values.keycloak.existingSecret }}{{ end }}
{{- if .Values.synthetic.enabled }}{{ $secrets = append $secrets .Values.synthetic.existingSecret }}{{ end }}
{{- if .Values.timescaledb.enabled }}{{ $secrets = append $secrets .Values.timescaledb.existingSecret }}{{ end }}
{{- if .Values.redis.enabled }}{{ $secrets = append $secrets .Values.redis.existingSecret }}{{ end }}
{{- if .Values.minio.enabled }}{{ $secrets = append $secrets .Values.minio.existingSecret }}{{ end }}
{{- if $es.vault.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $es.vault.serviceAccount }}
  labels:
    {{- include "yanimda.labels" (dict "root" . "component" "external-secrets") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: {{ $es.apiVersion }}
kind: SecretStore
metadata:
  name: {{ $es.storeRef.name }}
  labels:
    {{- include "yanimda.labels" (dict "root" . "component" "external-secrets") | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $es.vault.server | quote }}
      path: {{ $es.vault.path | quote }}
      version: {{ $es.vault.version | quote }}
      {{- with $es.vault.caConfigMap }}
      caProvider:
        type: ConfigMap
        name: {{ . }}
        key: ca.crt
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ $es.vault.authMountPath | quote }}
          role: {{ $es.vault.role | quote }}
          serviceAccountRef:
            name: {{ $es.vault.serviceAccount }}
{{- end }}
{{- range $name := $secrets }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "yanimda.labels" (dict "root" $ "component" "external-secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.storeRef.name }}
    kind: {{ $es.storeRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" $prefix $name | quote }}
{{- end }}
{{- end }}
