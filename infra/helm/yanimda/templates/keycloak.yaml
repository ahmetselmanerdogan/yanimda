{{- if .Values.keycloak.enabled }}
{{- $ctx := dict "root" . "component" "keycloak" }}
{{- $kc := .Values.keycloak }}
{{- $dbUrl := $kc.db.url }}
{{- if and (not $dbUrl) .Values.timescaledb.enabled }}
{{- $dbUrl = printf "jdbc:postgresql://%s:5432/keycloak" (include "yanimda.component" (dict "root" . "component" "timescaledb")) }}
{{- end }}
{{- $dbUser := $kc.db.username | default (ternary .Values.timescaledb.username "keycloak" .Values.timescaledb.enabled) }}
{{- $consoleUrl := $kc.realm.consoleUrl | default (printf "https://console.%s" .Values.global.domain) }}
{{- $familyWebUrl := $kc.realm.familyWebUrl | default (printf "https://aile.%s" .Values.global.domain) }}
{{- $blacklistCm := $kc.passwordBlacklist.existingConfigMap | default (printf "%s-password-blacklist" (include "yanimda.component" $ctx)) }}
{{- $theme := "files/keycloak-theme/login" }}
{{- $themeFiles := dict
  "theme.properties" "theme.properties"
  "messages_tr.properties" "messages/messages_tr.properties"
  "yanimda.css" "resources/css/yanimda.css"
  "strength-i18n.js" "resources/js/strength-i18n.js"
  "password-strength.js" "resources/js/password-strength.js" }}
{{- $themeSum := "" }}
{{- range $key, $path := $themeFiles }}{{ $themeSum = print $themeSum ($.Files.Get (printf "%s/%s" $theme $path)) }}{{ end }}
# T-081 (ASVS 2.1.8): giriş teması — parola gücü göstergesi; metinler packages/messages/tr.json'dan üretilir.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yanimda.component" $ctx }}-theme
  labels:
    {{- include "yanimda.labels" $ctx | nindent 4 }}
data:
  {{- range $key, $path := $themeFiles }}
  {{ $key }}: |-
    {{- $.Files.Get (printf "%s/%s" $theme $path) | required (printf "tema dosyası yok: %s" $path) | nindent 4 }}
  {{- end }}
{{- if not $kc.passwordBlacklist.existingConfigMap }}
---
# T-081 (ASVS 2.1.7): parola kara listesi (realm passwordBlacklist(yanimda-blacklist.txt)).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $blacklistCm }}
  labels:
    {{- include "yanimda.labels" $ctx | nindent 4 }}
data:
  yanimda-blacklist.txt: |-
    {{- .Files.Get "files/password-blacklist.txt" | required "files/password-blacklist.txt yok" | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yanimda.component" $ctx }}
  labels:
    {{- include "yanimda.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $kc.replicas }}
  selector:
    matchLabels:
      {{- include "yanimda.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yanimda.selectorLabels" $ctx | nindent 8 }}
        yanimda.app/db-client: "true"
      annotations:
        checksum/theme: {{ $themeSum | sha256sum }}
        checksum/blacklist: {{ .Files.Get "files/password-blacklist.txt" | sha256sum }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "yanimda.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 0
      {{- if $kc.readOnlyRootFilesystem }}
      # Salt okunur kök: imajdaki Quarkus derleme çıktısı yazılabilir emptyDir'e kopyalanır (Keycloak açılışta
      # yapılandırma değiştiyse yeniden derler ve buraya yazar).
      initContainers:
        - name: quarkus-build
          image: {{ include "yanimda.image" $kc.image | quote }}
          imagePullPolicy: {{ $kc.image.pullPolicy }}
          command: ["/bin/cp", "-a", "/opt/keycloak/lib/quarkus/.", "/work/"]
          securityContext:
            {{- include "yanimda.containerSecurityContext" true | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: quarkus
              mountPath: /work
      {{- end }}
      containers:
        - name: keycloak
          image: {{ include "yanimda.image" $kc.image | quote }}
          imagePullPolicy: {{ $kc.image.pullPolicy }}
          securityContext:
            {{- include "yanimda.containerSecurityContext" $kc.readOnlyRootFilesystem | nindent 12 }}
          args:
            - start
            {{- if $kc.realmConfigMap }}
            - --import-realm
            {{- end }}
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ required "keycloak.db.url gerekli (veya timescaledb.enabled)" $dbUrl | quote }}
            - name: KC_DB_USERNAME
              value: {{ $dbUser | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $kc.existingSecret }}
                  key: KC_DB_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ $kc.bootstrapAdminUser | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $kc.existingSecret }}
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: KC_HOSTNAME
              value: {{ printf "https://auth.%s" .Values.global.domain | quote }}
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            {{- if gt (int $kc.replicas) 1 }}
            - name: KC_CACHE_STACK
              value: kubernetes
            {{- end }}
            # Realm içe aktarma yer tutucuları (infra/keycloak/realm-*.json, ASVS 5.1.5 / 9.1.1)
            - name: YANIMDA_KC_SSL_REQUIRED
              value: {{ $kc.realm.sslRequired | quote }}
            - name: YANIMDA_CONSOLE_URL
              value: {{ $consoleUrl | quote }}
            - name: YANIMDA_CONSOLE_EXTRA_REDIRECT
              value: {{ printf "%s/*" $consoleUrl | quote }}
            - name: YANIMDA_FAMILY_WEB_URL
              value: {{ $familyWebUrl | quote }}
            - name: YANIMDA_FAMILY_APP_EXTRA_REDIRECT
              value: {{ $kc.realm.familyAppExtraRedirect | quote }}
            {{- if $kc.smtp.host }}
            - name: YANIMDA_KC_SMTP_HOST
              value: {{ $kc.smtp.host | quote }}
            - name: YANIMDA_KC_SMTP_PORT
              value: {{ $kc.smtp.port | quote }}
            - name: YANIMDA_KC_SMTP_FROM
              value: {{ $kc.smtp.from | default (printf "noreply@%s" .Values.global.domain) | quote }}
            - name: YANIMDA_KC_SMTP_STARTTLS
              value: {{ $kc.smtp.starttls | quote }}
            - name: YANIMDA_KC_SMTP_SSL
              value: {{ $kc.smtp.ssl | quote }}
            - name: YANIMDA_KC_SMTP_AUTH
              value: {{ $kc.smtp.auth | quote }}
            - name: YANIMDA_KC_SMTP_USER
              value: {{ $kc.smtp.user | quote }}
            - name: YANIMDA_KC_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $kc.existingSecret }}
                  key: KC_SMTP_PASSWORD
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 30
          resources:
            {{- toYaml $kc.resources | nindent 12 }}
          volumeMounts:
            - name: theme
              mountPath: /opt/keycloak/themes/yanimda/login
              readOnly: true
            {{- if $kc.readOnlyRootFilesystem }}
            - name: quarkus
              mountPath: /opt/keycloak/lib/quarkus
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
            {{- end }}
            - name: blacklist
              mountPath: /opt/keycloak/data/password-blacklists
              readOnly: true
            {{- if $kc.realmConfigMap }}
            - name: realms
              mountPath: /opt/keycloak/data/import
              readOnly: true
            {{- end }}
            {{- include "yanimda.internalCaMount" . | nindent 12 }}
      volumes:
        - name: theme
          configMap:
            name: {{ include "yanimda.component" $ctx }}-theme
            items:
              {{- range $key, $path := $themeFiles }}
              - key: {{ $key }}
                path: {{ $path }}
              {{- end }}
        - name: blacklist
          configMap:
            name: {{ $blacklistCm }}
        {{- if $kc.readOnlyRootFilesystem }}
        - name: quarkus
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if $kc.realmConfigMap }}
        - name: realms
          configMap:
            name: {{ $kc.realmConfigMap }}
        {{- end }}
        {{- include "yanimda.internalCaVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yanimda.component" $ctx }}
  labels:
    {{- include "yanimda.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "yanimda.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
{{- if gt (int $kc.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "yanimda.component" $ctx }}
  labels:
    {{- include "yanimda.labels" $ctx | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "yanimda.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
