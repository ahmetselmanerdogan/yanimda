# Staging: küme içi Timescale/Redis/MinIO yerine yönetilen hizmetler (Terraform çıktıları api Secret'ında).
global:
  domain: staging.yanimda.example

api:
  image:
    tag: '0.1.0'
  env:
    NODE_ENV: production
    DB_MIGRATE_ON_START: 'true'
    SIMULATOR_ENABLED: 'false'
    OIDC_AUDIENCE: yanimda-api
    OIDC_REQUIRE_MFA: 'true'
    COUNTRY_CODE: TR
    S3_ENDPOINT: https://obs.tr-west-1.myhuaweicloud.com
    S3_BUCKET: yanimda-staging-recordings
    S3_REGION: tr-west-1
    S3_ENSURE_BUCKET: 'false'
    RECORDING_RETENTION_DAYS: '30'
    CPAAS_PROVIDER: twilio
    CPAAS_WEBHOOK_BASE: https://api.staging.yanimda.example

console:
  image:
    tag: '0.1.0-staging'

keycloak:
  db:
    url: jdbc:postgresql://10.20.1.10:5432/keycloak?sslmode=require
  realmConfigMap: yanimda-realms

timescaledb:
  enabled: false

redis:
  enabled: false

minio:
  enabled: false

synthetic:
  enabled: true
  personIds: '00000000-0000-7000-8000-000000000001,00000000-0000-7000-8000-000000000002,00000000-0000-7000-8000-000000000003'
  pushgatewayUrl: http://prometheus-pushgateway.monitoring:9091

serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true

grafanaDashboard:
  enabled: true
