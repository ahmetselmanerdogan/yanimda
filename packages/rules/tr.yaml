# 03-teknik-mimari.md "Kural paketi" — Türkiye varsayılanları (v1.0)
country: TR
version: 5
# D-06 öğrenme modu (T-070): kişi oluşturulunca 30 gün; günlük iş son 14 güne bakar, en az 7 gün veri ister.
learning: { days: 30, historyDays: 14, minDays: 7, inactivityPercentile: 95 }
# D-07 yanlış alarm (T-071): 30 günde 3. yanlış alarmda aileye eşik önerisi + konsolda eşik görüşmesi (CALLBACK P4).
falseAlarm: { windowDays: 30, reviewAfter: 3 }
# T-052 resmi hatlar (operatör masadaki sabit hattan arar; CPaaS bu numaraları aramaz). Servisin ana ve yedek numarası
# hesaba bağlıdır: CPAAS_INBOUND_NUMBER / CPAAS_BACKUP_NUMBER (.env.example).
numbers: { emergency: '112', social: '183', health: '182' }
# docs/07 S5.2 / S5.4 (T-087): kuyruğa düşüşten 112 son sınırı (sn). Kişiye ulaşılmadıysa operatör 112'yi arar; sistem
# 112'yi asla kendisi aramaz ve P1 olayı kendisi kapatmaz (S5.8).
call112DeadlineSec: { SOS: 180, FALL: 300, INACTIVITY: 1200 }
# docs/07 S5.1–S5.5 (T-087) ulaşılamama merdiveni.
#  Çevrimdışı atlama (S5.1) kapsamanın çevrimiçi kuralını kullanır (coverage.onlineMin: A 15 dk, B 30 dk; köprü).
#  autoAnswerSec: P1'de sesli cihaz bu sürede kendiliğinden cevaplar (yanınızdayız aramasında asla); 20 sn sessiz
#  kalan otomatik cevaplı arama "cevap yok" değil olası acil durumdur (kuralın silenceIsEmergencySec'i)
#  unclaimedSupervisorSec: kuyrukta üstlenilmeyen P1 → amir çağrılır (O-P1-UNCLAIMED)
#  unclaimedVoiceContact: üstlenilmeyen P1'de 1. yakına sesli mesaj (S5.3; sahip kararı, varsayılan kapalı)
#  awayFromHomeM: kişi evden bu kadar uzaktaysa komşu ve anahtar sahibi adımları atlanır (S5.5)
#  operatorPrompt (T-089, S7.1): operatörün "Soru gönder" komutu; olay türünün cihaz sorusu yoksa (SOS) bu metin ve süre
ladder:
  autoAnswerSec: 10
  unclaimedSupervisorSec: 90
  unclaimedVoiceContact: { enabled: false, afterSec: 180, phrase: V-NO-OPERATOR }
  awayFromHomeM: 200
  operatorPrompt: { windowSec: 60, tts: W-OP-PROMPT }
# docs/07 S3.3–S3.7 (T-088) sinyal birleştirme. İki farklı cihaz corroborateSec içinde düşme bildirirse olay
# doğrulanmış: soru süresi corroboratedPromptSec; doğrulanmış düşme başka cihazdan iptal edilirse aynı gün takip
# araması (crossCancelFollowUp, followUpMin sonra). Açık P1/P2'de konum: gpsFreshSec'ten yeni GPS önce.
fusion:
  corroborateSec: 90
  corroboratedPromptSec: 30
  crossCancelFollowUp: true
  crossCancelFollowUpMin: 60
  gpsFreshSec: 120
# T-085/T-086 (docs/07 S3.2, S4, S8.4): kapsama, pil ve şarj eşikleri. Kodda sabit pil eşiği kalmaz.
# coverage.onlineMin: A sınıfı cihaz bu kadar dk görülmezse çevrimdışı, B sınıfı daha uzun (S3.2).
coverage: { onlineMin: { A: 15, B: 30 }, locationStaleMin: 30 }
# battery: warnPct (W-BAT-20) ve criticalPct (W-BAT-10 + F-BAT-10) sinyal anında; planPct/familyPct 18:00
# planlı şarj kontrolünde (S4.6); deadPct ve altı "pil bitti" (yetenek sayılmaz).
battery: { warnPct: 20, planPct: 30, familyPct: 15, criticalPct: 10, deadPct: 5, planHour: '18:00' }
# charging (S4.3–S4.5): varsayılan pencere, "şarj tamam" (%80 ve 20 dk), takma hatırlatmaları, aile (90 dk; plan
# dışında 60 dk), operatör (120 dk). Süreler uyanık dakikadır: gece penceresinde durur, uyanış + resumeAfterWakeMin'de
# devam eder. "Şarj ediyorum" (intentMin) hatırlatmaları susturur, operatör olayını susturmaz.
charging:
  defaultWindow: '19:00-21:00'
  chargeDonePct: 80
  chargeDoneMin: 20
  putOnMin: [15, 30]
  familyGapMin: 90
  familyGapOffPlanMin: 60
  maxGapMin: 120
  intentMin: 90
  resumeAfterWakeMin: 30
# coverageNone (S4.7): hiçbir SOS yolu yokken (uyanık) 20 dk hatırlatma + yaşlının numarasına otomatik sesli arama
# (V-COVERAGE-NONE, boşluk başına bir), aile 45 dk, KAPSAMA BOŞLUĞU 60 dk. YERİNDE KONTROL (P2, T-087):
#  welfareDroppedH: takılı bir A sınıfı cihaz pili battery.warnPct'nin (%20) üzerindeyken birden sustu, 2 sa (uyanık)
#  welfareSilentH: telefon dahil tüm cihazlar sessiz ve boşluk başından beri kimseye "iyi" ile ulaşılamadı, 6 sa (uyanık)
#  welfareNoMovementH (S5.4): yanınızdayız araması iki denemede cevapsız (F-WELLNESS-MISSED) ve bu kadar saattir hiçbir
#  cihaz hareketi yok. Hastanede / seyahatte modunda (S4.10) hiçbiri çalışmaz; SOS ve düşme her zaman çalışır.
coverageNone:
  { remindMin: 20, familyMin: 45, eventMin: 60, welfareSilentH: 6, welfareDroppedH: 2, welfareNoMovementH: 24 }
rules:
  - type: SOS
    priority: 1
    devicePrompt: { enabled: false }
    # S5.2: 1. sesli cihaz 20 → 2. sesli cihaz 20 (varsa) → telefon 20 → en iyi cihaza yeniden 15 (kişiye ≤75 sn) →
    # yakınlar 25 → anahtar sahibi 25 → 112 (son sınır call112DeadlineSec.SOS).
    chain:
      [CALL_WATCH, CALL_VOICE_2:2, CALL_PHONE, CALL_REDIAL, CALL_CONTACT:1, CALL_CONTACT:2, CALL_KEY_HOLDER, CALL_112]
    stepTimeoutSec:
      { CALL_WATCH: 20, CALL_VOICE_2: 20, CALL_PHONE: 20, CALL_REDIAL: 15, CALL_CONTACT: 25, CALL_KEY_HOLDER: 25 }
    silenceIsEmergencySec: 20
    followUpAfterHours: 24
  - type: FALL
    priority: 1
    devicePrompt: { enabled: true, windowSec: 60, repeatVibrateSec: 5, tts: W-FALL-1 }
    escalateWhen: { noAnswer: true }
    # S5.2 (SOS ile aynı) + komşu; doğrulanmış düşmede (T-088) doğrulayan cihaz önce aranır.
    chain:
      [
        CALL_WATCH,
        CALL_VOICE_2:2,
        CALL_PHONE,
        CALL_REDIAL,
        CALL_CONTACT:1,
        CALL_CONTACT:2,
        CALL_KEY_HOLDER,
        CALL_NEIGHBOR,
        CALL_112,
      ]
    stepTimeoutSec:
      {
        CALL_WATCH: 20,
        CALL_VOICE_2: 20,
        CALL_PHONE: 20,
        CALL_REDIAL: 15,
        CALL_CONTACT: 25,
        CALL_KEY_HOLDER: 25,
        CALL_NEIGHBOR: 25,
      }
    silenceIsEmergencySec: 20
    followUpAfterHours: 24
  - type: INACTIVITY
    priority: 2
    thresholdMin: { default: 30, learnable: true, min: 15, max: 90 }
    activeHours: { useSleepWindow: true }
    devicePrompt: { enabled: true, windowSec: 120, silent: true, tts: W-INACT-1 }
    # D-12 (T-072): soru cevapsızsa operatörden önce kişiye sesli arama; "evet/iyiyim/1" → OK, diğer → kuyruk.
    autoVoiceScreening: &screening
      enabled: true
      phrase: V-SCREEN-ASK
      acceptIf: [evet, iyiyim]
      helpIf: [hayır, yardım, imdat, değil, kötü]
      acceptDigits: ['1']
      minConfidence: 0.5
      timeoutSec: 120
      operatorSampleRate: 0.2
    learningMode: { extraSilentAsks: 1 }
    # S5.4: sessiz soru 120 → sesli ön eleme 120 → cihaz/telefon → yakınlar → anahtar sahibi ("gidip bakar mısınız")
    # → 112 (kuyruğa düşüşten 20 dk, call112DeadlineSec.INACTIVITY).
    chain: [CALL_WATCH, CALL_PHONE, CALL_CONTACT:1, CALL_CONTACT:2, CALL_KEY_HOLDER, CALL_NEIGHBOR, CALL_112]
    stepTimeoutSec: { CALL_WATCH: 20, CALL_PHONE: 20, CALL_CONTACT: 25, CALL_KEY_HOLDER: 25, CALL_NEIGHBOR: 25 }
  # S3.4: yalnız hiçbir A sınıfı cihaz takılı değilken açılır; şarja takılan saat beklemeyi kapatır (şarj boşluğu).
  - type: WATCH_OFF
    priority: 3
    suppressIn: [NIGHT]
    remindAfterMin: 120
    operatorAfterMin: 240
    autoVoiceScreening: *screening
    chain: [CALL_PHONE, CALL_CONTACT:1]
  - type: BATTERY_LOW
    priority: 3
    chain: [NOTIFY_FAMILY]
  # T-086: BATTERY_DEAD ve CONNECTION_LOST artık açılmaz; KAPSAMA BOŞLUĞU'nun nedenleridir. Kurallar, sürüm
  # geçişinde açık kalmış eski olayların zinciri için durur. afterHours yalnız GET /status bağlantı etiketi (LOST).
  - type: BATTERY_DEAD
    priority: 3
    operatorAfterMin: 120
    chain: [CALL_PHONE, CALL_CONTACT:1]
  - type: CONNECTION_LOST
    priority: 3
    afterHours: 6
    suppressIn: [NIGHT]
    chain: [CALL_PHONE, CALL_CONTACT:1]
  # T-086 (S4.4, S4.7, S5.4): şarj boşluğu 120 dk veya kapsama YOK 60 dk (uyanık). Önce sesli ön eleme, sonra
  # telefon ve 1. yakın; 112 yok. Kapsama geri gelince operatör üstlenmemişse sistem kapatır.
  - type: COVERAGE_GAP
    priority: 3
    autoVoiceScreening: *screening
    chain: [CALL_PHONE, CALL_CONTACT:1]
    operatorScript: O-SCRIPT-COVERAGE
  # T-087 (S4.7, S5.4) YERİNDE KONTROL: kapsama YOK iken takılı cihaz birden sustu (2 sa) / tüm cihazlar sessiz (6 sa),
  # yanınızdayız araması cevapsız + 24 sa hareket yok. Telefon → yakınlar → anahtar sahibi ziyareti; cihaz sorusu ve
  # sesli ön eleme yok. 112 adımı yok: ziyaret 30 dk içinde mümkün değilse operatör kararıyla (Ctrl+1, gerekçeli).
  - type: WELFARE_CHECK
    priority: 2
    chain: [CALL_PHONE, CALL_CONTACT:1, CALL_CONTACT:2, CALL_KEY_HOLDER]
    stepTimeoutSec: { CALL_PHONE: 20, CALL_CONTACT: 25, CALL_KEY_HOLDER: 25 }
    operatorScript: O-SCRIPT-WELFARE
  - type: CALLBACK
    priority: 4
    chain: [CALL_PHONE]
  - type: TEST
    priority: 4
    chain: [CALL_WATCH, CALL_PHONE]
    operatorScript: O-SCRIPT-TEST
  - type: FOLLOW_UP
    priority: 4
    chain: [CALL_PHONE, CALL_CONTACT:1]
