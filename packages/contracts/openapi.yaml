        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /supervisor/coverage:
    get:
      summary: Filo kapsama tablosu (amir). T-085 (S4.11, S7.2)
      description: |
        Seviye başına kişi sayısı (son değerlendirme; tarama 30 sn). `plannedCharging`: FULL'un altında olup şarj
