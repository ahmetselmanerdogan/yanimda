            `detail` aynı kodun Türkçe metnidir.
    CoverageLevel: { enum: [FULL, BASIC, PHONE_ONLY, NIGHT, NONE] }
    CoverageReason:
      description: |
        T-085 OEM (S2.7, S4.9) bilgi nedenleri (seviyeden bağımsız): PARTNER_LATENCY ortağın gecikmesi bozuk, cihazları
        "zayıf"; HOME_UNIT_POWER_LOSS ev ünitesinin elektriği kesildi (yedek pilde); LINE_LOSS kolyenin / ev ünitesinin
        hattı düştü (cihaz ve ev ünitesine bağlı radyo kolye çevrimdışı). C sınıfı cihaz hiçbir nedeni değiştirmez.
      enum:
        [
          WATCH_CHARGING,
          NO_ALARM_DEVICE_WORN,
          ALARM_DEVICE_OFFLINE,
          PHONE_OFFLINE,
          NIGHT_WINDOW,
          ON_HOLD,
          PARTNER_LATENCY,
          HOME_UNIT_POWER_LOSS,
          LINE_LOSS,
        ]
    CoverageCapabilities:
      type: object
      required: [sos, fall, voice, location]
      properties:
        sos: { type: boolean }
        fall: { type: boolean }
        voice: { type: boolean }
        location: { type: boolean }
    DeviceCategory: { enum: [WATCH, PHONE, PENDANT, RING, EARBUD, EARRING, HOME_UNIT, CLOUD, SENSOR] }
    BodyLocation: { enum: [WRIST_LEFT, WRIST_RIGHT, NECK, CHEST, FINGER, EAR, POCKET, HOME] }
    DevicePush:
      type: object
      description: |
        Sunucu → cihaz push verisi (T-053, T-089, T-090). Tüm değerler string; FCM'de yalnız `data` (görünür bildirim
        yok; telefonun kendi NOTICE'u hariç), APNs'te aynı alanlar yükte.
        - `PROMPT` (FCM yüksek öncelik, APNs uyarı 10): olay cihaz sorusuna (DEVICE_PROMPT) girince alarmı açan
          cihaz(lar)a ve yaşlının telefonuna; soru süresi değişince (doğrulanmış düşme 30 sn, öğrenme modunda 2. soru)
          yeni `until` ile yeniden; operatörün "Soru gönder" komutuyla da. İstemci `until`'i esas alır (sunucu saati,
          ISO); `windowSec` gönderim anında kalan süre (eski istemciler). `kind` olay türü; `tts` saatin W-* kodu,
          `phoneTts` telefonun P-* metni (W-FALL-1 → P-FALL-PROMPT, W-INACT-1 → P-INACT-1, operatör sorusu W-OP-PROMPT
          → P-OP-PROMPT). `silent` "true" ise sessiz soru.
        - `RING` (FCM yüksek, APNs uyarı 10, metin P-RING) `eventId`: cihaz çalar, saat W-RING / telefon P-RING gösterir.
        - `LOCATE` (FCM yüksek, APNs arka plan) `eventId`: cihaz taze konumla `LOCATION` sinyali gönderir,
          `payload: {trigger: "LOCATE", eventId}`; sunucu bu cevapla açık olayın konumunu (her öncelikte) günceller.
        - `TEST` (normal, APNs arka plan): cihaz kendini dener ve `TEST` sinyali gönderir, `payload: {trigger: "OPERATOR"}`;
          bu cevap yeni test olayı açmaz, `GET /devices/{id}/config` `lastTestAt`'e yansır.
        - `NOTICE` (yüksek): yaşlı bildirimi `code`. W-* yalnız saat kategorisine, P-* yalnız telefona.
        - `WAKE` (iOS sessiz uyandırma).
        Kendi push token'ı olmayan saate (Wear OS: FCM yok) giden PROMPT / RING / LOCATE / TEST / NOTICE kişinin push
        token'ı olan, en son görülen telefonuna `forDeviceId` = saat kimliğiyle gider: telefon göstermez, Data Layer'dan
        saate iletir. Telefon soruyu zaten kendi kopyasıyla aldıysa saate ayrıca aktarılmaz (telefon iletir).
      required: [type]
      properties:
        type: { enum: [PROMPT, NOTICE, RING, LOCATE, TEST, WAKE] }
        eventId: { type: string }
        kind: { type: string, example: FALL }
        tts: { type: string, example: W-FALL-1 }
        phoneTts: { type: string, example: P-FALL-PROMPT }
        windowSec: { type: string, example: '30' }
        until: { type: string, format: date-time }
        silent: { enum: ['true', 'false'] }
        code: { type: string, example: W-CHARGE-DONE }
        notificationId: { type: string }
        forDeviceId: { type: string, description: Mesaj bu saat içindir; telefon göstermez, saate iletir }
    DeviceSummary:
      type: object
      description: T-085 cihaz kartı (docs/07 S7.4)
      required:
        [
          id,
          kind,
          category,
          tier,
          bodyLocation,
          nickname,
          online,
          lastSeenAt,
          batteryPct,
          charging,
          chargingSince,
          onBody,
          estimatedHoursLeft,
          voiceOrder,
          voiceOrderManual,
        ]
      properties:
        id: { type: string }
        kind:
          type: string
          description: 'Cihaz türü (WEAROS_WATCH, ANDROID_PHONE, IOS_PHONE, SIMULATOR; T-085 OEM: ortak kodu, ör. FAKE_PENDANT)'
        category: { $ref: '#/components/schemas/DeviceCategory' }
        tier: { enum: [A, B, C], description: A alarm, B canlı izlem, C eğilim (S2.1) }
        bodyLocation: { oneOf: [{ $ref: '#/components/schemas/BodyLocation' }, { type: 'null' }] }
        nickname: { type: [string, 'null'] }
        online: { type: boolean }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        batteryPct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        charging: { type: boolean }
        chargingSince: { type: [string, 'null'], format: date-time }
        onBody: { type: [boolean, 'null'], description: Telefonda her zaman null }
        estimatedHoursLeft: { type: [number, 'null'] }
        voiceOrder: { type: [integer, 'null'], minimum: 1 }
        voiceOrderManual:
          type: boolean
          description: Sıra aile / operatör tarafından elle verildi (PATCH voiceOrder); false ise hesaplanan sıra
        voiceNumberLast2:
          type: [string, 'null']
          pattern: '^\d{2}$'
          description: T-087 cihaza özel sesli arama numarasının son iki hanesi (PATCH voiceNumber); yoksa null
        bridged:
          type: boolean
          description: T-089 (S7.1, S4.8) son sinyali yaşlının telefonu üzerinden (BLE köprüsü) geldi — "telefon üzerinden"
    CoverageView:
      type: object
      required: [level, since, reasons, capabilities, devices]
      properties:
        level: { $ref: '#/components/schemas/CoverageLevel' }
        since: { type: string, format: date-time }
