    MemberView:
      type: object
      description: T-040 aile hesabı (başka üyenin e-posta/telefon/kimliği dönmez)
      required: [id, role, relation, createdAt, isMe]
      properties:
        id: { type: string, format: uuid }
        role: { enum: [OWNER, MEMBER] }
        relation: { type: [string, 'null'], maxLength: 50 }
        createdAt: { type: string, format: date-time }
        isMe: { type: boolean, description: Kayıt isteği yapan hesaba mı ait }
    DataExport:
      type: object
      description: T-081 (8.3.2) kişisel veri dışa aktarma. Metin yok; kodlar ve kayıtlar.
      required: [format, generatedAt, account, persons, withheld]
      properties:
        format: { const: yanimda.data-export.v1 }
        generatedAt: { type: string, format: date-time }
        account:
          type: object
          required: [subject, memberships, pushTargets, memberInvitesCreated, feedback, notifications]
          properties:
            subject: { type: string, description: consumers realm `sub` (ad / e-posta / telefon Keycloak'ta) }
            memberships:
              type: array
              items:
                type: object
                properties:
                  protectedPersonId: { type: string, format: uuid }
                  role: { enum: [OWNER, MEMBER] }
                  relation: { type: [string, 'null'] }
                  since: { type: string, format: date-time }
            pushTargets:
              type: array
              description: Token yok
              items:
                type: object
                properties:
                  platform: { type: string }
                  updatedAt: { type: string, format: date-time }
            memberInvitesCreated:
              type: array
              description: Kod yok (yalnız sha256 saklanır)
              items:
                type: object
                properties:
                  protectedPersonId: { type: string, format: uuid }
                  createdAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
                  usedAt: { type: [string, 'null'], format: date-time }
            feedback:
              type: array
              items:
                type: object
                properties:
                  eventId: { type: string, format: uuid }
                  real: { type: boolean }
                  at: { type: string, format: date-time }
            notifications:
              type: array
              description: Bu hesabın push hedeflerine giden bildirimler (en yeni önce, ≤ 1000); katalog kodu, metin yok
              maxItems: 1000
              items:
                type: object
                properties:
                  code: { type: string }
                  channel: { type: string }
                  status: { type: string }
                  protectedPersonId: { type: string }
                  eventId: { type: [string, 'null'], format: uuid }
                  createdAt: { type: string, format: date-time }
                  deliveredAt: { type: [string, 'null'], format: date-time }
        persons:
          type: array
          items: { $ref: '#/components/schemas/DataExportPerson' }
        withheld:
          type: array
          description: Bilerek dışa aktarılmayan sınıflar (docs/security/saklama.md)
          items:
            enum:
              [
                MEDICAL_CONTENT,
                CONTACT_PHONE_FULL,
                HEALTH_VITALS,
                CALL_RECORDINGS,
                AUDIT_LOG,
                OPERATOR_DATA,
                LOCATION_HISTORY,
              ]
    DataExportPerson:
      type: object
      required: [profile, members, contacts, devices, events, dailySummaries, subscriptions, consents]
      properties:
        profile: { $ref: '#/components/schemas/PersonView' }
        members: { type: array, items: { $ref: '#/components/schemas/MemberView' } }
        contacts: { type: array, items: { $ref: '#/components/schemas/ContactView' } }
        devices:
          type: array
          description: Push token'ı ve cihaz numarası yok
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind: { type: string }
              modelId: { type: [string, 'null'] }
              category: { type: [string, 'null'] }
              tier: { type: [string, 'null'] }
              nickname: { type: [string, 'null'] }
              bodyLocation: { type: [string, 'null'] }
              osVersion: { type: [string, 'null'] }
              appVersion: { type: [string, 'null'] }
              enrolledAt: { type: [string, 'null'], format: date-time }
              lastSeenAt: { type: [string, 'null'], format: date-time }
              revokedAt: { type: [string, 'null'], format: date-time }
              retiredAt: { type: [string, 'null'], format: date-time }
        events:
          type: array
          description: En yeni önce, ≤ 1000; konum, operatör ve notlar yok
          maxItems: 1000
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              type: { type: string }
              priority: { type: integer }
              isTest: { type: boolean }
              state: { type: string }
              createdAt: { type: string, format: date-time }
              closedAt: { type: [string, 'null'], format: date-time }
              outcome: { type: [string, 'null'] }
        dailySummaries:
          type: array
          items:
            type: object
            properties:
              day: { type: string, format: date }
              steps: { type: [integer, 'null'] }
              hrMin: { type: [integer, 'null'] }
              hrAvg: { type: [integer, 'null'] }
              hrMax: { type: [integer, 'null'] }
              wristMinutes: { type: integer }
        subscriptions:
          type: array
          items:
            type: object
            properties:
              plan: { type: string }
              status: { type: string }
              countryCode: { type: string }
              startedAt: { type: string, format: date-time }
              trialEndsAt: { type: [string, 'null'], format: date-time }
              renewsAt: { type: [string, 'null'], format: date-time }
              canceledAt: { type: [string, 'null'], format: date-time }
        consents:
          type: object
          properties:
            kvkk:
              type: array
              items:
                type: object
                properties:
                  noticeVersion: { type: [string, 'null'] }
                  explicitConsentAt: { type: [string, 'null'], format: date-time }
            medicalConsentAt: { type: [string, 'null'], format: date-time }
            vendorLinks:
              type: array
              description: Üretici bulutu aktarım dayanağı; hesap kimliği yok
              items:
                type: object
                properties:
                  partner: { type: string }
                  dataRegion: { type: string }
                  consentBasis: { type: string }
                  consentAt: { type: [string, 'null'], format: date-time }
                  createdAt: { type: string, format: date-time }
                  revokedAt: { type: [string, 'null'], format: date-time }
    Signal:
      $ref: './schemas/signal.schema.json'
    CallView:
      type: object
      description: T-050 CPaaS araması (numara içermez)
      properties:
        id: { type: string, format: uuid }
        stepN: { type: integer }
        status: { enum: [queued, ringing, in-progress, completed, busy, no-answer, failed, canceled] }
        answered: { type: boolean }
        suggestedResult: { oneOf: [{ enum: [REACHED, NO_ANSWER, BUSY, WRONG_NUMBER] }, { type: 'null' }] }
        durationSec: { type: [integer, 'null'] }
        recorded: { type: boolean }
        conference: { type: boolean, description: Görüşme konferansa taşındı (T-051) }
        held: { type: boolean, description: Aranan beklemede (T-051) }
        parties: { type: integer, description: Konferansa eklenen yakın sayısı (T-051) }
        error:
          type: [string, 'null']
          description: |
            Başarısızlık nedeni (numara yok). `stale`: arama asılı kaldı (queued/ringing CALL_SETUP_STALE_SEC,
            in-progress CALL_MAX_DURATION_SEC aşıldı; webhook gelmedi veya arama başlatılamadı) — sistem kapattı,
            öneri yok, "Ara" yeniden arar.
        createdAt: { type: string, format: date-time }
    ChainView:
      type: object
      required: [procedureVersion, steps, current]
      properties:
        procedureVersion: { type: integer }
        current: { type: [integer, 'null'], description: Sıradaki adım; hepsi bittiyse null }
        steps: { type: array, items: { $ref: '#/components/schemas/ChainStep' } }
    ChainStep:
      type: object
      required: [n, kind, target, label, timeoutSec, required]
      properties:
        n: { type: integer }
        kind:
          type: string
          description: |
            CALL_WATCH (1. sesli cihaz), CALL_PHONE, CALL_REDIAL (en iyi cihaza yeniden; T-087), CALL_CONTACT,
            CALL_KEY_HOLDER (anahtarı olan, varma süresi en kısa yakın; T-087), CALL_NEIGHBOR, CALL_112, NOTIFY_FAMILY
        target: { enum: [WATCH, ELDER_PHONE, VOICE_DEVICE, CONTACT, KEY_HOLDER, NEIGHBOR, EMERGENCY, FAMILY] }
        contactIndex: { type: integer }
        label: { type: string, description: Katalog kodu (O-STEP-*) }
        script: { type: string, description: Katalog kodu (O-SCRIPT-*) }
        timeoutSec: { type: integer }
        required: { type: boolean }
        autoAnswerSec:
          {
            type: integer,
            description: 'T-087: P1 sesli cihaz adımında cihaz bu sürede kendiliğinden cevaplar (10 sn)',
          }
        calledAt: { type: string, format: date-time }
        result:
          enum: [REACHED, NO_ANSWER, BUSY, WRONG_NUMBER, SKIPPED, SILENT, OFFLINE_SKIPPED]
          description: SILENT otomatik cevap + ses yok (olası acil); OFFLINE_SKIPPED sistem atladı (sesli cihaz çevrimdışı)
        assessment: { enum: [OK, EMERGENCY] }
        note: { type: string }
        reason: { type: string }
        operatorId: { type: string }
        completedAt: { type: string, format: date-time }
        scriptReadAt: { type: string, format: date-time }
    LadderView:
      type: object
      description: T-087/T-088 (docs/07 S5, S3.3) konsol olay ekranı merdiven özeti
      required:
        [
          call112DeadlineAt,
          call112DeadlineSec,
          corroborated,
          sourceDeviceCount,
          cancelledByDeviceId,
          possibleEmergency,
          hearingSpeechImpaired,
          platformSosFlow,
        ]
      properties:
        call112DeadlineAt:
          type: [string, 'null']
          format: date-time
          description: Kuyruğa düşüş + call112DeadlineSec (SOS 180, düşme 300, hareketsizlik 1200); test/diğer türlerde null
        call112DeadlineSec: { type: [integer, 'null'] }
        corroborated: { type: boolean, description: İki farklı cihaz 90 sn içinde düşme bildirdi }
        sourceDeviceCount: { type: integer, description: Olayı bildiren farklı cihaz sayısı ("2 cihaz") }
        cancelledByDeviceId: { type: [string, 'null'] }
        possibleEmergency: { type: boolean, description: Otomatik cevaplı arama sessiz kaldı (SILENT) }
        hearingSpeechImpaired: { type: boolean }
        platformSosFlow:
          type: boolean
          description: Kaynak kendi SOS akışını çalıştırdı (sinyal payload.platformSosFlow) → O-SCRIPT-APPLE-112
        welfareReason:
          description: |
            T-087 (docs/07 S4.7, S5.4) YERİNDE KONTROL (WELFARE_CHECK, P2) nedeni; diğer türlerde null. DEVICE_DROPPED:
            kapsama YOK iken takılı cihaz pili %20'nin üzerindeyken birden sustu (uyanık 2 sa); ALL_SILENT: telefon dahil
            tüm cihazlar sessiz ve boşluk başından beri kimseye "iyi" ile ulaşılamadı (uyanık 6 sa); NO_MOVEMENT:
            yanınızdayız araması iki denemede cevapsız ve 24 sa cihaz hareketi yok. Konsol O-UI-WELFARE-<neden>.
            Merdiven: telefon → yakınlar → anahtar sahibi ziyareti; 112 son sınırı yok (operatör kararıyla, gerekçeli).
          oneOf: [{ enum: [DEVICE_DROPPED, ALL_SILENT, NO_MOVEMENT] }, { type: 'null' }]
        prompts:
          type: array
          description: T-089 (S7.1) operatörün "Soru gönder" komutları ve cihazın cevabı (eskiden yeniye)
          items: { $ref: '#/components/schemas/DevicePromptView' }
    DevicePromptView:
      type: object
      description: |
        Operatörün cihaza sorusu (POST /devices/{id}/commands PROMPT) ve cevabı. Cihaz pencere içinde (gönderim ≤ an ≤
        until, sunucu saati) `OK` / `CANCEL` gönderirse "İyiyim" (OK), `SOS` gönderirse yardım (HELP; SOS ayrıca alarm
        olarak işlenir); önce aynı cihaza sorulan, yoksa `payload.eventId` olayı gösteriyorsa olayın son sorusu
        cevaplanır. Cevapsız ve until geçmiş: NO_ANSWER; null: bekleniyor. Cevap olayı kapatmaz (operatör karar verir);
        konsol `event.updated` (reason PROMPT_ANSWERED) ile yeniler.
      required: [deviceId, sentAt, until, delivered, answer, answeredAt, answeredByDeviceId]
      properties:
        deviceId: { type: string }
        sentAt: { type: string, format: date-time }
        until: { type: string, format: date-time }
        delivered: { type: boolean, description: Soru cihaza (veya köprü telefona) ulaştı }
        answer: { enum: [OK, HELP, NO_ANSWER, null] }
        answeredAt: { type: [string, 'null'], format: date-time }
        answeredByDeviceId:
          { type: [string, 'null'], description: Cevaplayan cihaz (telefona giden soruyu saat cevaplayabilir) }
    DispatchView:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        protectedPersonId: { type: string }
        status: { enum: [NOTIFIED, ACCEPTED, EN_ROUTE, ON_SCENE, TRANSPORTING, AT_HOSPITAL, COMPLETED, CANCELLED] }
        notifiedAt: { type: string, format: date-time }
        notifiedBy: { type: [string, 'null'] }
        caseRef: { type: [string, 'null'] }
        etaMin: { type: [integer, 'null'] }
        hospital: { type: [string, 'null'] }
        stages: { type: object, additionalProperties: { type: string, format: date-time } }
        arrivalMin: { type: [number, 'null'], description: '112 aranması → ekip olay yerinde (dk)' }
        arrivalLate: { type: boolean }
        open: { type: boolean }
        checks: { type: integer, description: Takip zamanlayıcısının amir uyarısı sayısı }
        timeline:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              at: { type: string, format: date-time }
              actorKind: { type: string }
              actorId: { type: [string, 'null'] }
              source: { enum: [OPERATOR, EMS, FAMILY, SYSTEM] }
              note: { type: [string, 'null'] }
    # ---- T-092 değer kuralları ve BLE köprülü cihazlar ----
    BridgedDeviceModel: { enum: [BLE_HR, BLE_PULSE_OX, BLE_THERMO, BLE_PENDANT] }
    BridgedDeviceRegister:
      type: object
      required: [model, addressHash]
      additionalProperties: false
      properties:
        model: { $ref: '#/components/schemas/BridgedDeviceModel' }
        addressHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 (küçük harf hex) — büyük harf, iki nokta ayraçlı MAC'in özeti. Ham MAC 400.
        name: { type: [string, 'null'], minLength: 1, maxLength: 40, description: Takma ad (aile / operatör görür) }
    BridgedDevice:
      type: object
      required: [deviceId, model, category, tier, signals, bridgeDeviceId, nickname, createdAt]
      properties:
        deviceId: { type: string, format: uuid, description: Sinyallerde kullanılacak cihaz kimliği }
        model: { $ref: '#/components/schemas/BridgedDeviceModel' }
        category: { $ref: '#/components/schemas/DeviceCategory' }
        tier: { enum: [A, B, C] }
        signals:
          type: array
          description: Telefonun bu cihaz için iletebileceği sinyal türleri (model profili)
          items: { type: string }
        bridgeDeviceId: { type: string, format: uuid, description: Köprü telefon }
        nickname: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    VitalRule:
      enum: [LOW_HR_STILL, LOW_HR, HIGH_HR, HR_BASELINE_DEVIATION, SPO2_LOW, SPO2_LOW_HR, FALL_HR_HIGHLIGHT]
    EventVitals:
      type: object
      required: [eventId, windowMin, bucketMin, series, baseline, quality, alerts, highlight, noteCode]
      properties:
        eventId: { type: string, format: uuid }
        windowMin: { type: integer, description: Pencere (dk; kural paketi vitals.view.windowMin, 120) }
        bucketMin: { type: integer, description: Ortanca dilimi (dk; 5) }
        series:
          type: array
          items:
            type: object
            required: [kind, points]
            properties:
              kind: { enum: [HR, SPO2] }
              points:
                type: array
                items:
                  type: object
                  required: [at, value, n]
                  properties:
                    at: { type: string, format: date-time, description: Dilimin başı }
                    value: { type: number, description: Dilimdeki örneklerin ortancası }
                    n: { type: integer }
        baseline:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                HR:
                  type: object
                  properties: { SLEEP: { type: number }, REST: { type: number }, ACTIVE: { type: number } }
        quality: { oneOf: [{ enum: [Q1, Q2, Q3] }, { type: 'null' }] }
        alerts:
          type: array
          items:
            type: object
            properties:
              rule: { $ref: '#/components/schemas/VitalRule' }
              value: { type: number }
              at: { type: string, format: date-time }
        highlight: { type: boolean, description: Düşme sırasında alışılmadık nabız (P1 kalır) }
        noteCode: { type: string, description: Konsolun gösterdiği uyarı notu (katalog kodu) }
    WeeklyTrends:
      type: object
      required: [protectedPersonId, noteCode, weeks, outcomes]
      properties:
        protectedPersonId: { type: string, format: uuid }
        noteCode: { type: string, example: F-VITAL-WELLNESS-NOTE }
        weeks:
          type: array
          items:
            type: object
            properties:
              weekStart: { type: string, format: date, description: Pazartesi (kişinin yerel günü) }
              restingHr: { type: [number, 'null'] }
              sleepHr: { type: [number, 'null'] }
              spo2: { type: [number, 'null'] }
              skinTempNightsAbove: { type: integer }
              skinTempTwoNights: { type: boolean }
              validDays: { type: integer }
        outcomes:
          type: array
          items:
            type: object
            properties:
              eventId: { type: string, format: uuid }
              type: { type: string }
              outcome: { enum: [EMERGENCY, UNREACHABLE] }
              at: { type: string, format: date-time }
    VitalSettings:
      type: object
      required:
        [enabled, lowHr, highHr, spo2Low, copd, trendsMuted, familyConsentAt, doctorNote, learningUntil, defaults]
      properties:
        enabled: { type: boolean, description: Değer kuralları açık mı (bayrak) }
        lowHr: { type: [integer, 'null'] }
        highHr: { type: [integer, 'null'] }
        spo2Low: { type: [integer, 'null'] }
        copd: { type: boolean }
        trendsMuted: { type: boolean }
        familyConsentAt: { type: [string, 'null'], format: date-time }
        doctorNote: { type: boolean }
        learningUntil: { type: [string, 'null'], format: date-time, description: İlk örnekten sonra 14 gün }
        defaults:
          type: object
          required: [lowHr, highHr, spo2Low, spo2LowCopd]
          properties:
            lowHr: { type: integer }
            highHr: { type: integer }
            spo2Low: { type: integer }
            spo2LowCopd: { type: integer }
    VitalReview:
      type: object
      required: [id, protectedPersonId, name, rule, reason, note, createdAt, resolvedAt, resolvedBy]
      properties:
        id: { type: string, format: uuid }
        protectedPersonId: { type: string }
        name: { type: [string, 'null'], description: Kişinin görünen adı (amir panosundaki gibi) }
        rule: { $ref: '#/components/schemas/VitalRule' }
        reason: { enum: [WEEKLY_LIMIT, FALSE_ALARMS] }
        note: { type: [string, 'null'], maxLength: 500 }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedBy: { type: [string, 'null'] }
    QueueItem:
      type: object
      required: [eventId, type, priority, state, createdAt, lockedBy, isTest, person]
      properties:
        eventId: { type: string, format: uuid }
        type: { type: string }
        priority: { type: integer }
        state: { type: string }
        createdAt: { type: string, format: date-time }
        escalatedAt: { type: [string, 'null'], format: date-time }
        lockedBy: { type: [string, 'null'], description: Üstlenen operatör (token sub) }
        lockUntil: { type: [string, 'null'], format: date-time }
        isTest: { type: boolean }
        headOfQueue: { type: boolean, description: 'T-092: aynı öncelikte önce (P2 değer kombinasyonu)' }
        person:
          oneOf:
            - type: 'null'
            - type: object
              properties: { displayName: { type: string }, age: { type: [integer, 'null'] } }
