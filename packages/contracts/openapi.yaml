        '403': { $ref: '#/components/responses/Problem' }
  /supervisor/coverage/board:
    get:
      summary: Amir kapsama panosu listeleri. T-089 (docs/07 S7.2)
      description: |
        `noneAwake`: uyanıkken kapsama YOK ≥ coverageNone.remindMin (20 dk), en uzun önce. `chronic`: son 7 günde
        uyanık zamanın chronicGap.protectedPct'sinden (%80) azı korunanlar ve S4.10 kronik boşluk işaretliler
