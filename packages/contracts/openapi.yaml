        alır). SUPERVISOR veya ADMIN.
      operationId: supervisorCoverage
      security: [{ operatorToken: [] }]
      responses:
        '200':
          description: Özet
          content: { application/json: { schema: { $ref: '#/components/schemas/SupervisorCoverage' } } }
