              properties: { since: { type: string, format: date-time } }
        toleranceMin:
          type: integer
          minimum: 0
          maximum: 240
          description: S4.10 kişiye özel tolerans (dk), KAPSAMA BOŞLUĞU olay eşiğine (şarj 120, YOK 60) eklenir
    ChargingPlan:
      type: object
      required: [window, source, nightChargeAllowed]
      description: |
        T-086 (S4.3): varsayılan 19:00–21:00; 14 günlük CHARGE_START / CHARGE_END geçmişinden (en az 7 geçerli gün)
        günde bir öğrenilir (LEARNED: başlangıç / bitiş ortancası, 15 dk'ya yuvarlanır); aile verdiyse (FAMILY)
        dokunulmaz; gece penceresine taşan pencere öğrenilmez. Öğrenilen pencere "planlı şarj" sınıflaması, aile
        bildirim süresi (plan dışında 60 dk) ve 18:00 kontrolünde kullanılır.
      properties:
        window: { type: string, pattern: '^\d{2}:\d{2}-\d{2}:\d{2}$', example: '19:00-21:00' }
        source: { enum: [DEFAULT, LEARNED, FAMILY] }
        nightChargeAllowed: { type: boolean }
        learnedDays: { type: [integer, 'null'], description: Yalnız LEARNED — dayandığı geçerli gün sayısı }
        learnedAt: { type: [string, 'null'], format: date-time, description: Yalnız LEARNED — öğrenildiği an }
