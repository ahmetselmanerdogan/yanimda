        devices: { type: array, items: { $ref: '#/components/schemas/DeviceSummary' } }
        chronicGap:
          description: |
            S4.10 kronik boşluk: 7 günde 5 kapsama boşluğundan sonra her boşlukta KAPSAMA BOŞLUĞU (P3) açılmaz; aileye
            bir kez F-COVERAGE-CHRONIC, operasyona bir FOLLOW_UP (plan). Tolerans değişince veya boşluklar eşiğin
            altına inince biter. Yoksa null.
          oneOf:
            - type: 'null'
