  # ---- T-092 BLE köprülü cihazlar (docs/07 S2.1 B sınıfı, S4.8, S7.5) — yalnız sunucu sözleşmesi ----
  /devices/bridged:
    post:
      summary: Yaşlının telefonu BLE cihazı kaydeder (nabız ölçer, oksimetre, termometre, BLE kolye). T-092
      operationId: registerBridgedDevice
      security: [{ deviceToken: [] }]
      description: |
        Yalnız yaşlının telefonu (ANDROID_PHONE / IOS_PHONE cihaz token'ı); saat veya başka cihaz 403. Cihaz token'ın
        kişisine ve köprü telefona (`bridgeDeviceId` = telefonun kimliği) bağlanır; `connection_path = PHONE_BRIDGE`.

        **Adres:** ham BLE MAC adresi asla gönderilmez (gönderilirse 400). İstemci adresi büyük harf, iki nokta ayraçlı
        biçime getirir ("C0:FF:EE:00:00:0A") ve SHA-256 özetini 64 haneli küçük harf hex olarak `addressHash`'e yazar.
        Sunucu bunu da saklamaz: HMAC-SHA256(sunucu anahtarı, "<telefonId>:<addressHash>") tutar (aynı cihaz başka
        telefonda başka değer).

        **İdempotent:** (telefon, addressHash) başına tek etkin kayıt. Aynı istek yeniden → 200 ve aynı `deviceId`
        (verilirse `name` güncellenir). Aynı adres başka modelle → 409. Kaldırılmış (DELETE) adres yeniden kaydedilirse
        yeni `deviceId` alır. Kişi başına cihaz sınırları geçerlidir (S1.7: en çok 6 etkin cihaz, en çok 3 A sınıfı
        giyilebilir) → 409 `code: F-DEVICE-LIMIT` (aileye bildirim).

        **Model profilleri** (yanıttaki `signals`; telefon yalnız bunları iletebilir, diğerleri `UNSUPPORTED_SIGNAL`):
        - `BLE_HR` (0x180D nabız ölçer; SENSOR, B): HEART_RATE, BATTERY, ON_BODY, OFF_BODY, HEARTBEAT
        - `BLE_PULSE_OX` (0x1822 nabız oksimetre; SENSOR, B): SPO2, HEART_RATE, BATTERY, ON_BODY, OFF_BODY, HEARTBEAT
        - `BLE_THERMO` (cilt sıcaklığı; SENSOR, B): SKIN_TEMP_DEVIATION, BATTERY, ON_BODY, OFF_BODY, HEARTBEAT
        - `BLE_PENDANT` (BLE kolye; PENDANT, A): SOS, CANCEL, OK, TEST, BATTERY, ON_BODY, OFF_BODY, HEARTBEAT

        B sınıfı cihazlar olay açmaz (değerleri bayrakla kapalı değer kurallarına girer, S6). BLE kolye A sınıfı SOS
        açar ama düşme ve ses yeteneği yoktur; yalnız köprü telefon çevrimiçiyken korumaya sayılır (S4.8).

        **Sinyal iletimi:** telefon mevcut `POST /signals` ucunu KENDİ token'ıyla, köprülü cihazın `deviceId`'si ve
        kişinin `protectedPersonId`'si ile çağırır (saat köprüsüyle aynı yol). Sunucu her sinyali köprülü sayar
        (`device.connectivity = BLE`); telefon 15 dk sessiz kalınca tüm köprülü cihazların kapsaması düşer. Kurallar:
        - `device.onWrist`: sensör teması / takılı bilgisi (BLE HR "sensor contact" biti, oksimetrede parmak var).
          Değer kuralları yalnız takılı ve ≥ 5 dk takılı cihazda çalışır; göndermeyen cihazın değeri hiç uyarı üretmez.
        - `device.batteryPct`: cihazın pili (Battery Service 0x180F), `device.charging` biliniyorsa.
        - `vital.quality` (Q1–Q3; sunucu modelin katalog kalitesinden iyisini kabul etmez) ve `vital.context`
          (RESTING / ACTIVE / SLEEP) isteğe bağlı.
        - `idempotencyKey`: cihaz kimliği + ölçüm anı gibi kararlı bir anahtar (telefon yeniden gönderirse tekrar
          sayılır).
        - Başka telefona bağlı, kaldırılmış veya başka kişinin köprülü cihazı → `DEVICE_NOT_BRIDGED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BridgedDeviceRegister' }
            examples:
              nabizOlcer:
                summary: Göğüs bandı (BLE HR)
                value:
                  model: BLE_HR
                  addressHash: 8f2e6c2b6a7f1f0f3d0c3b9a4e5d6c7b8a9f0e1d2c3b4a5f6e7d8c9b0a1f2e3d
                  name: Göğüs bandı
              kolye:
                summary: BLE kolye
                value:
                  { model: BLE_PENDANT, addressHash: 1b2c3d4e5f60718293a4b5c6d7e8f9011a2b3c4d5e6f708192a3b4c5d6e7f809 }
      responses:
        '201':
          description: Yeni kayıt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BridgedDevice' }
              examples:
                yeni:
                  value:
                    deviceId: 0190c000-0000-7000-8000-00000000b1e1
                    model: BLE_HR
                    category: SENSOR
                    tier: B
                    signals: [HEART_RATE, BATTERY, ON_BODY, OFF_BODY, HEARTBEAT]
                    bridgeDeviceId: 0190c000-0000-7000-8000-00000000f0f1
                    nickname: Göğüs bandı
                    createdAt: '2026-11-12T09:00:00Z'
        '200':
          description: Aynı telefon + adres zaten kayıtlı (aynı deviceId)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BridgedDevice' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      summary: Bu telefona bağlı etkin BLE cihazlar (telefon kendi listesini eşitler). T-092
      operationId: listBridgedDevices
      security: [{ deviceToken: [] }]
      responses:
        '200':
          description: Etkin köprülü cihazlar (eskiden yeniye)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BridgedDevice' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /devices/bridged/{deviceId}:
    delete:
      summary: Köprüyü kaldırır (eşleşme silindi / cihaz kayıp). T-092
      operationId: unbridgeDevice
      security: [{ deviceToken: [] }]
      description: |
        Yalnız bu telefona bağlı köprülü cihaz (başka telefonun / kişinin cihazı 404). Cihaz iptal edilir ve emekli
        sayılır, kapsamadan hemen çıkar; sonraki sinyalleri `DEVICE_NOT_BRIDGED`. Zaten kaldırılmışsa yine 204.
        Telefon kaldırılınca (`DELETE /devices/{telefonId}`) ona bağlı tüm köprülü cihazlar da kaldırılır.
      parameters: [{ name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Kaldırıldı }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  # ---- T-092 değer kuralları (docs/07 S6) — BAYRAKLA KAPALI; kapalıyken bu uçlar 404 ----
  /events/{id}/vitals:
    get:
      summary: Açık olayda değer grafiği (son 2 sa, 5 dk ortancalar, taban, kalite). T-092, S6.8
      operationId: getEventVitals
      security: [{ operatorToken: [] }]
      description: |
        Yalnız OPERATOR / SUPERVISOR ve yalnız olay açıkken (kapalı olay 403). Değer olayı (HEART_ANOMALY, SPO2_LOW)
        veya değer kuralı / düşme vurgusu eklenmiş olay (ör. ulaşılamayınca hareketsizliğe yükseltilmiş olay, düşme +
        alışılmadık nabız); diğer olaylar ve özellik kapalıyken 404. Dakika düzeyinde ham veri yok, dışa aktarma yok;
        her erişim denetime yazılır (`vitals.viewed`, değer yazılmaz).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Değer görünümü
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventVitals' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/trends/weekly:
    get:
      summary: Aile — haftalık sağlık eğilimleri ve "iyi" olmayan değer sonuçları. T-092, S6.8, S7.4
      operationId: getWeeklyTrends
      security: [{ userToken: [] }, { adminToken: [] }]
      description: |
        Aile üyesi (OWNER / MEMBER) kendi kişisi; başka ailenin kişisi 404. Günlük özetlerden haftalık ortanca (ham
        veri yok), cilt sıcaklığı sapması gece sayısı, "iyi" olmayan (EMERGENCY / UNREACHABLE) değer olayları.
        `noteCode` (F-VITAL-WELLNESS-NOTE) sağlık-amaçlı uyarı notudur; uygulama her zaman gösterir. Özellik kapalıyken
        404.
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 13, default: 4 } }
      responses:
        '200':
          description: Haftalık eğilimler (eskiden yeniye)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyTrends' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/vital-settings:
    get:
      summary: Kişiye özel değer ayarları (eşikler, KOAH profili, eğilim susturma). T-092, S6.7
      operationId: getVitalSettings
      security: [{ userToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '200':
          description: Ayarlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VitalSettings' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      summary: Kişiye özel eşik (aile onayı + doktor notu işareti) veya eğilim susturma — hesap sahibi. T-092, S6.7
      operationId: setVitalSettings
      security: [{ userToken: [] }, { adminToken: [] }]
      description: |
        `lowHr` / `highHr` / `spo2Low` / `copd: true` yalnız `familyConsent: true` ve `doctorNote: true` ile (yüklenmiş
        doktor notunun işareti; belge içeriği tutulmaz, isteğe bağlı `doctorNoteRef` belge referansı). Eksikse 400.
        null → genel eşiğe döner. `trendsMuted` aileye P4 eğilim bildirimini susturur (P3 olaylar susturulamaz).
        MEMBER 403 (F-MEMBER-OWNER-ONLY). Değişiklik denetime yazılır (değerler ve referans yazılmaz).
        Değer kuralları kapalıyken (bayrak; mevzuat görüşü öncesi) 404 — hiçbir ayar saklanmaz.
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lowHr: { type: [integer, 'null'], minimum: 25, maximum: 80 }
                highHr: { type: [integer, 'null'], minimum: 90, maximum: 220 }
                spo2Low: { type: [integer, 'null'], minimum: 70, maximum: 96 }
                copd: { type: boolean }
                trendsMuted: { type: boolean }
                familyConsent: { type: boolean }
                doctorNote: { type: boolean }
                doctorNoteRef: { type: [string, 'null'], maxLength: 200 }
            example: { lowHr: 36, familyConsent: true, doctorNote: true, doctorNoteRef: 'belge-2026-11-01' }
      responses:
        '200':
          description: Güncel ayarlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VitalSettings' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /supervisor/vital-reviews:
    get:
      summary: Amirin eşik incelemesi kuyruğu (haftalık kontrol sınırı, değerlerde yanlış alarm). T-092, S6.7
      operationId: listVitalReviews
      security: [{ operatorToken: [] }]
      parameters: [{ name: open, in: query, schema: { type: string, enum: ['1', '0'], default: '1' } }]
      responses:
        '200':
          description: İncelemeler (değer içermez)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/VitalReview' } }
        '403': { $ref: '#/components/responses/Problem' }
  /supervisor/vital-reviews/{id}/resolve:
    post:
      summary: Eşik incelemesini kapatır (denetimde). T-092
      operationId: resolveVitalReview
      security: [{ operatorToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 500 } } }
      responses:
        '200':
          description: Kapatılan inceleme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VitalReview' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    deviceToken: { type: http, scheme: bearer }
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Keycloak `operations` realm erişim token'ı (T-020): aud `yanimda-api`, amr içinde `otp`, realm rolü OPERATOR /
        SUPERVISOR / ADMIN. Operatör kimliği `sub`. Token yok/geçersiz 401, rol yetmiyor 403.
    adminToken:
      type: apiKey
      in: header
      name: x-admin-token
      description: Betikler/CI için paylaşılan yönetici anahtarı (ADMIN_TOKEN). Bearer gelirse yalnız OIDC denenir.
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak `consumers` realm erişim token'ı (ELDER, FAMILY).
    signupToken:
      type: apiKey
      in: header
      name: x-signup-token
      description: T-060 kayıt akışı token'ı (POST /signup yanıtı; tek aboneliğe bağlı, 2 saat).
  requestBodies:
    CheckoutInput:
      content:
        application/json:
          schema:
            type: object
            properties:
              billing:
                type: object
                description: Fatura adresi (iyzico zorunlu). Saklanmaz, yalnız sağlayıcıya iletilir.
                required: [city, address]
                properties:
                  city: { type: string, maxLength: 60 }
                  address: { type: string, maxLength: 200 }
  parameters:
    EventId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    StepN: { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
    PersonId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    SubscriptionId:
      name: id
      in: path
      required: true
      description: Kayıt yanıtındaki subscriptionId
      schema: { type: string, format: uuid }
    CallId: { name: callId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    TooManyRequests:
      description: >-
        T-081 hız sınırı aşıldı (Redis sabit pencere; uç başına kimlik: kullanıcı, cihaz, kişi veya IP).
        `Retry-After` kadar bekleyip yeniden deneyin. Alarm içeren sinyal partileri (SOS, FALL, INACTIVITY,
        CANCEL, OK, CALLBACK_REQUEST) hiç sınırlanmaz.
      headers:
        Retry-After:
          description: Saniye
          schema: { type: integer, minimum: 1 }
        X-Request-Id:
          description: Korelasyon kimliği (her yanıtta; geçerli gelen değer korunur)
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Subscription:
      description: Abonelik
      content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } }
    CheckoutSession:
      description: Barındırılan ödeme sayfası
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [kind, url, checkoutRef]
                properties: { kind: { const: redirect }, url: { type: string }, checkoutRef: { type: string } }
              - type: object
                description: iyzico checkoutFormContent (script) — sayfaya eklenir
                required: [kind, html, checkoutRef]
                properties: { kind: { const: embed }, html: { type: string }, checkoutRef: { type: string } }
    CallView:
      description: Arama (numarasız)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CallView' }
    EventWithChain:
      description: Olay ve zinciri
      content:
        application/json:
          schema:
            type: object
            required: [event, chain]
            properties:
              event:
                type: object
                description: |
                  Olay kaydı: durum, geçişler, lockUntil. T-088 (docs/07 S8.2): sourceDeviceIds (olayı bildiren
                  farklı cihazlar, ilk eleman alarmı açan), corroboratedAt (iki farklı cihaz 90 sn içinde düşme),
                  cancelledByDeviceId (cihaz sorusunu "iyiyim" ile kapatan cihaz). location açık P1/P2'de en taze
                  ve en doğru kaynaktan yeniden birleştirilir (S3.7).
              chain: { oneOf: [{ $ref: '#/components/schemas/ChainView' }, { type: 'null' }] }
              calls: { type: array, items: { $ref: '#/components/schemas/CallView' } }
              ladder: { $ref: '#/components/schemas/LadderView' }
    DeviceToken:
      description: Cihaz token'ı (HS256 JWT, 1 yıl)
      content:
        application/json:
          schema:
            type: object
            required: [deviceId, protectedPersonId, token, expiresAt, refreshAfter]
            properties:
              deviceId: { type: string, format: uuid }
              protectedPersonId: { type: string, format: uuid }
              token: { type: string }
              expiresAt: { type: string, format: date-time }
              refreshAfter: { type: string, format: date-time }
    Problem:
      description: RFC 7807
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Subscription:
      type: object
      required:
        [
          id,
          protectedPersonId,
          plan,
          countryCode,
          status,
          effectiveStatus,
          protectionActive,
          provider,
          paymentMethodOnFile,
        ]
      properties:
        id: { type: string, format: uuid }
        protectedPersonId: { type: string, format: uuid }
        plan: { type: string }
        countryCode: { enum: [TR, US] }
        status: { enum: [TRIAL, ACTIVE, PAST_DUE, CANCELED] }
        effectiveStatus:
          description: TRIAL (deneme) · ACTIVE · PAYMENT_PENDING (ödeme bekliyor, 7 gün koruma) · SUSPENDED (askıda, koruma kapalı) · CANCELED
          enum: [TRIAL, ACTIVE, PAYMENT_PENDING, SUSPENDED, CANCELED, null]
        protectionActive: { type: boolean }
        until: { type: [string, 'null'], format: date-time, description: Deneme sonu / bekleme sonu / yenileme }
        trialEndsAt: { type: [string, 'null'], format: date-time }
        canceledAt: { type: [string, 'null'], format: date-time }
        provider: { enum: [IYZICO, STRIPE, FAKE, null] }
        paymentMethodOnFile: { type: boolean }
    FamilyEventSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        protectedPersonId: { type: string, format: uuid }
        type: { type: string }
        priority: { type: integer }
        isTest: { type: boolean }
        state: { type: string }
        stage:
          enum: [DETECTED, ASKING, CANCELLED, QUEUED, OPERATOR, CALLING, SAFE, EMERGENCY, DISPATCH, FOLLOW_UP, CLOSED]
        createdAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        outcome: { type: [string, 'null'] }
    FamilyEvent:
      allOf:
        - { $ref: '#/components/schemas/FamilyEventSummary' }
        - type: object
          properties:
            devicePromptUntil: { type: [string, 'null'], format: date-time }
            steps:
              type: array
              items:
                type: object
                properties:
                  n: { type: integer }
                  kind: { enum: [CALL_WATCH, CALL_PHONE, CALL_CONTACT, CALL_NEIGHBOR, CALL_112] }
                  contactIndex: { type: [integer, 'null'] }
                  status: { enum: [PENDING, CALLING, DONE] }
                  result: { type: [string, 'null'] }
                  assessment: { type: [string, 'null'] }
                  at: { type: [string, 'null'], format: date-time }
            operatorNote: { type: [string, 'null'] }
            feedback: { type: [object, 'null'], properties: { real: { type: boolean } } }
            canFeedback: { type: boolean }
    OperatorCard:
      type: object
      properties:
        subject: { type: string }
        name: { type: [string, 'null'] }
        status: { enum: [AVAILABLE, BREAK, OFFLINE] }
        online: { type: boolean, description: Son 90 sn içinde WS'de görüldü }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        open:
          type: array
          items:
            type: object
            properties:
              eventId: { type: string, format: uuid }
              type: { type: string }
              priority: { type: integer }
              state: { type: string }
              since: { type: string, format: date-time }
        claims24h: { type: integer }
        avgClaimSec: { type: [number, 'null'] }
        closed24h: { type: integer }
    SlaBreach:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        type: { type: string }
        priority: { type: integer }
        kind:
          {
            enum: [CLAIM, FIRST_CALL],
            description: 'CLAIM: kuyruktan üstlenmeye > 10 sn; FIRST_CALL: üstlenmeden ilk aramaya > 20 sn',
          }
        live: { type: boolean, description: Hâlâ sürüyor }
        waitedSec: { type: integer }
        at: { type: string, format: date-time }
        operatorId: { type: [string, 'null'] }
    OverflowFlag:
      type: object
      properties:
        enabled: { type: boolean }
        changedAt: { type: [string, 'null'], format: date-time }
        changedBy: { type: [string, 'null'] }
    TestStatus:
      type: object
      required: [eventId, state, completed]
      properties:
        eventId: { type: string, format: uuid }
        state: { type: string }
        completed: { type: boolean }
        outcome: { type: [string, 'null'] }
        operatorNote: { type: [string, 'null'], description: Kapanışta operatörün notu }
        createdAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
    SetupStateInput:
      type: object
      required: [step, completed]
      properties:
        step: { type: string, pattern: '^[A-Z_]+$', example: BATTERY }
        completed: { type: boolean }
        missing:
          type: array
          items: { enum: [NOTIFICATIONS, CALLS, LOCATION, LOCATION_BACKGROUND, MOTION, BATTERY, WATCH, HEALTH] }
        watchPaired: { type: [boolean, 'null'] }
    DailySummary:
      type: object
      required: [day, wristMinutes, partial]
      properties:
        day: { type: string, format: date, description: Kişinin yerel günü }
        steps: { type: [integer, 'null'] }
        hrMin: { type: [integer, 'null'] }
        hrAvg: { type: [integer, 'null'] }
        hrMax: { type: [integer, 'null'] }
        wristMinutes: { type: integer }
        restStart: { type: [string, 'null'], format: date-time, description: Dinlenme (uyku) tahmini başlangıcı }
        restEnd: { type: [string, 'null'], format: date-time }
        partial: { type: boolean, description: Bugün (henüz bitmedi) }
    PersonInput:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        birthYear: { type: [integer, 'null'], minimum: 1900 }
        language: { enum: [tr] }
        timezone: { type: string, description: IANA saat dilimi }
        address:
          type: [object, 'null']
          required: [line, city]
          properties:
            line: { type: string, maxLength: 200 }
            district: { type: string, maxLength: 60 }
            city: { type: string, maxLength: 60 }
            postalCode: { type: string, maxLength: 10 }
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        doorAccessNote: { type: [string, 'null'], maxLength: 500, description: Şifreli saklanır }
        dailySummary: { type: boolean, description: Akşam F-DAILY bildirimi (C-07; varsayılan açık) }
        locationSharing:
          { type: boolean, description: 'Aile uygulaması son konumu görür (T-061, C-09; varsayılan açık)' }
        hearingSpeechImpaired:
          type: boolean
          description: T-087 (docs/07 S5.9) işitme/konuşma güçlüğü — otomatik cevap ulaşılamadı sayılır, yakınlara erken geçilir
        holdMode:
          description: |
            S4.10 "hastanede / seyahatte" modu (until gelecekte, en çok 180 gün); null kapatır. Bu sürede kapsama
            uyarıları durur (T-085/T-086); SOS ve düşme her zaman çalışır.
          oneOf:
            - type: 'null'
            - type: object
              required: [kind, until]
              properties:
                kind: { enum: [HOSPITAL, TRAVEL] }
                until: { type: string, format: date-time }
        coverageToleranceMin:
          type: integer
          minimum: 0
          maximum: 240
          description: |
            S4.10 kronik boşluk planı: kişiye özel tolerans (dk), KAPSAMA BOŞLUĞU olay eşiğine (şarj 120 dk, kapsama YOK
            60 dk) eklenir. Değişince kronik boşluk dönemi biter, sayım yeniden başlar. Sahip (OWNER) veya yönetici.
    PersonView:
      type: object
      required: [id, displayName, language, timezone, status, medical, myRole, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        birthYear: { type: [integer, 'null'] }
        language: { type: string }
        timezone: { type: string }
        status:
          {
            enum: [TRIAL, ACTIVE, PAST_DUE, CANCELED],
            description: Aboneliği yansıtır; abonelik dışı (kurum) kişi ACTIVE,
          }
        learningModeUntil:
          type: [string, 'null']
          format: date-time
          description: D-06 öğrenme modu bitişi (oluşturma + 30 gün). T-070
        address:
          type: [object, 'null']
          properties:
            line: { type: string }
            district: { type: [string, 'null'] }
            city: { type: string }
            postalCode: { type: [string, 'null'] }
            lat: { type: [number, 'null'] }
            lng: { type: [number, 'null'] }
        doorAccessNote: { type: [string, 'null'] }
        myRole: { enum: [OWNER, MEMBER, null] }
        dailySummary: { type: boolean }
        locationSharing: { type: boolean }
        hearingSpeechImpaired: { type: boolean }
        holdMode:
          description: Süresi geçmişse null
          oneOf:
            - type: 'null'
            - type: object
              properties:
                kind: { enum: [HOSPITAL, TRAVEL] }
                until: { type: string, format: date-time }
        coverageToleranceMin: { type: integer, description: S4.10 kişiye özel kapsama boşluğu toleransı (dk) }
        medical:
          type: object
          description: Yalnız var/yok ve rıza zamanı; içerik geri okunmaz.
          properties:
            present: { type: boolean }
            consentAt: { type: [string, 'null'], format: date-time }
            updatedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    LearningSummary:
      type: object
      required: [protectedPersonId, learningMode, sleepWindow, inactivity, learnedAt, learnedDays, reportSentAt]
      properties:
        protectedPersonId: { type: string, format: uuid }
        learningMode:
          type: object
          properties:
            active: { type: boolean }
            until: { type: [string, 'null'], format: date-time }
        sleepWindow:
          type: object
          description: Kişinin saat diliminde [start, end)
          properties:
            timezone: { type: string }
            start: { type: string }
            end: { type: string }
            source: { $ref: '#/components/schemas/ThresholdSource' }
        inactivity:
          type: object
          properties:
