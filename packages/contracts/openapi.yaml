openapi: 3.1.0
info:
  title: Yanımda API
  version: 0.1.0
  description: 03-teknik-mimari.md "API sözleşmeleri" bölümünün S0 taslağı. Her görevde genişletilir.
servers:
  - url: http://localhost:3000/v1
paths:
  /signals:
    post:
      summary: Cihazdan sinyal gönderimi (toplu). D-01
      operationId: postSignals
      security: [{ deviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Signal' }
      description: |
        T-010 · D-01. Parti sırayla işlenir; her sinyal tek transaction'da signal.signal + event.outbox
        (signal.received) olarak yazılır. idempotencyKey 24 saat tekildir (Redis; Redis yoksa veritabanı tekil
        indeksi). Geçersiz bir sinyal varsa partiden hiçbir şey yazılmaz (400). 503 alan cihaz partiyi
        Retry-After sonrası aynen yeniden gönderir; önceden yazılanlar `duplicates` sayılır.
        T-015: her sinyal cihaz türünün adaptöründen geçer (deviceId → device.device.kind; kayıtsız → simülatör,
        üretimde kapalı). Cihazın gönderemeyeceği sinyal (ör. telefondan OFF_BODY) partiyi 400 ile reddeder.
        Sunucu sinyale `source: {kind, role}` ekler; istemci bu alanı gönderemez.
        T-073: IOS_PHONE türü (telefon rolü, Android telefonla aynı sinyal kümesi).
        T-041: `Authorization: Bearer <cihaz token>`. Token'lı cihaz yalnız kendi deviceId ve protectedPersonId'si
        ile sinyal gönderebilir (değilse 403, partiden hiçbir şey yazılmaz). T-043 köprü (B-03): eşlikçi telefonun
        (ANDROID_PHONE/IOS_PHONE) token'ı aynı kişinin etkin WEAROS_WATCH cihazlarının sinyallerini saatin deviceId'si
        ile iletebilir (saat `POST /devices/{id}/companions` ile kaydedilmiş olmalı). Token'sız istek yalnız simülatör açıkken
        (SIMULATOR_ENABLED, geliştirme) kabul edilir; geçersiz/iptal edilmiş token her zaman 401.
      responses:
        '202':
          description: Kabul edildi (kalıcı yazıldı; olay işleme eşzamansız)
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates]
                properties:
                  accepted: { type: integer, minimum: 0, description: Yeni yazılan sinyal sayısı }
                  duplicates: { type: integer, minimum: 0, description: Daha önce alınmış (yok sayılan) sinyal sayısı }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503':
          description: Geçici olarak yazılamadı veya aynı sinyal şu an işleniyor; yeniden deneyin
          headers:
            Retry-After: { schema: { type: integer }, description: Saniye }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /protected-persons/{id}/check-plan:
    get:
      summary: Düzenli "yanınızdayız" arama planı (aile üyesi okur; amir/yönetici)
      operationId: getCheckPlan
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '200': { description: Plan (yoksa null) }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      summary: Planı kur/değiştir (aile yalnız OWNER; MEMBER 403). Bekleyen dönem yeniden hesaplanır
      description: |
        Sıklık DAILY / WEEKLY / BIWEEKLY (ISO hafta çift), gün 1–7, kişinin saat diliminde yerel saat, kanal
        CALL / NOTIFY / BOTH, tamamlanma penceresi 15–1440 dk. Zamanı gelince kişiye P-WELLNESS bildirimi ve/veya
        operatör kuyruğunda P4 geri arama (kaynak `wellness:<id>`); olay kapanınca DONE_OK / DONE_HELP, ulaşılamadı veya
        pencere doldu → MISSED + amire O-WELLNESS-MISSED.
      operationId: setCheckPlan
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                frequency: { enum: [DAILY, WEEKLY, BIWEEKLY] }
                weekday: { type: integer, minimum: 1, maximum: 7 }
                localTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                channel: { enum: [CALL, NOTIFY, BOTH] }
                windowMin: { type: integer, minimum: 15, maximum: 1440 }
      responses:
        '200': { description: Plan ve sıradaki zaman (nextDueAt) }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /wellness/checks:
    get:
      summary: Düzenli arama dönemleri (son N gün + önümüzdeki 14 gün); durum süzgeci
      operationId: listWellnessChecks
      security: [{ operatorToken: [] }]
      parameters:
        - { name: personId, in: query, schema: { type: string, format: uuid } }
        - {
            name: status,
            in: query,
            schema: { type: string },
            description: 'Virgülle: SCHEDULED,IN_PROGRESS,DONE_OK,DONE_HELP,NOTIFIED,MISSED,SKIPPED',
          }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365 } }
      responses:
        '200': { description: Dönemler }
  /wellness/compliance:
    get:
      summary: Uyum (planlanan / yapılan / yardım / bildirildi / kaçırılan, oran) — kişi veya merkez
      operationId: wellnessCompliance
      security: [{ operatorToken: [] }]
      parameters:
        - { name: personId, in: query, schema: { type: string, format: uuid } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365 } }
      responses:
        '200': { description: Uyum }
  /admin/calls:
    get:
      summary: Çağrı kaydı — kim kimi aradı (rehber rolü ve sırası; numara yok), cevap, süre, sonuç, kayıt var mı
      operationId: adminCalls
      security: [{ operatorToken: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: operatorId, in: query, schema: { type: string } }
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
        - { name: answered, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200': { description: 'Giden (zincir) ve gelen (SOS) çağrılar, en yeni önce' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/calls/{callId}/recording:
    get:
      summary: Ses kaydı (amir/yönetici). Her dinleme audit.log `recording.played` (kim, gerekçe)
      operationId: adminRecording
      security: [{ operatorToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/CallId' }
        - { name: reason, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        '200': { description: Ses, content: { audio/mpeg: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/analytics:
    get:
      summary: Analiz — olaylar, SLA, arama cevap oranı (rehber rolüne göre), gelen aramalar, 112 varış, düzenli aramalar, operatör performansı, günlük seri
      operationId: adminAnalytics
      security: [{ operatorToken: [] }]
      parameters: [{ name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365 } }]
      responses:
        '200': { description: Analiz }
  /admin/audit:
    get:
      summary: Denetim kaydı (append-only), işlem öneki / kişi / kayıt süzgeci
      operationId: adminAudit
      security: [{ operatorToken: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
      responses:
        '200': { description: Kayıtlar }
  /admin/health:
    get:
      summary: Sistem sağlığı — outbox şeritleri ve DLQ, kuyruk, açık / geciken 112, kaçırılan düzenli arama, bağlı personel
      operationId: adminHealth
      security: [{ operatorToken: [] }]
      responses:
        '200': { description: Sağlık }
  /push/web/config:
    get:
      summary: Personel web push (PWA) — açık mı, VAPID açık anahtarı
      operationId: webPushConfig
      security: [{ operatorToken: [] }]
      responses:
        '200': { description: '{ enabled, publicKey }' }
  /push/web/subscriptions:
    post:
      summary: Bu cihazı amir uyarılarına abone et (PushSubscription JSON; endpoint https)
      description: Amir uyarıları (O-LOCK-LOST, O-DISPATCH-NO-ARRIVAL, O-DISPATCH-OPEN, O-WELLNESS-MISSED) SUPERVISOR aboneliklerine gider; yükte kişi adı / numara yok. 404/410 dönen abonelik silinir.
      operationId: webPushSubscribe
      security: [{ operatorToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys: { type: object, properties: { p256dh: { type: string }, auth: { type: string } } }
      responses:
        '200': { description: Kaydedildi }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Aboneliği bırak
      operationId: webPushUnsubscribe
      security: [{ operatorToken: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { endpoint: { type: string } } } } }
      responses:
        '204': { description: Bırakıldı }
  /queue:
    get:
      summary: Operatör kuyruğu (öncelik → yaş, sayfalı). E-02, T-022
      description: |
        Bekleyen (OPERATOR_QUEUE) ve operatördeki (lockedBy dolu) açık olaylar. Canlı değişiklikler için WebSocket
        `/v1/ws/queue`: bağlanınca ilk mesaj `{"type":"auth","token":"<operatör erişim token'ı>"}` (5 sn içinde; token
        yenilenince tekrar). Sunucu `ready`, `snapshot` (tam liste), ardından `upsert {item}`, `remove {eventId}`,
        `alert {alert}` (amir uyarısı) gönderir. Amire (SUPERVISOR) ayrıca bağlanınca ve `SUPERVISOR_PUSH_MS` (5 sn)
        aralıkla `dashboard {dashboard}` (GET /supervisor/dashboard ile aynı gövde; T-074). Tüm personele bağlanınca
        ve değişince `inbound {queued, oldestQueuedSec}` (kuyrukta bekleyen gelen SOS araması; ad/numara yok). Kapanış kodları: 4400 bozuk mesaj, 4401 kimlik yok/geçersiz/süresi
        doldu, 4403 rol yetmiyor. Yeniden bağlanınca tam liste gelir.
      operationId: getQueue
      security: [{ operatorToken: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Kuyruk sayfası
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/QueueItem' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /events/{id}/unclaim:
    post:
      summary: Amir — üstlenmeyi geri al; olay kuyruğa döner, zincir kaldığı yerden sürer. E-02, T-022
      description: |
        OPERATOR_ASSIGNED / CONTACT_CHAIN → OPERATOR_QUEUE. Teyitli olay (CONFIRMED_OK, CONFIRMED_EMERGENCY, DISPATCH)
        kuyruğa dönemez: durumu korunur, operatörsüz bırakılır (audit `event.released`); ilk üstlenen devralır.
        Diğer durumlarda 409.
      operationId: unclaimEvent
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: Kuyrukta }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /events/{id}:
    get:
      summary: Olay + prosedür zinciri. E-03, T-021
      operationId: getEvent
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200': { $ref: '#/components/responses/EventWithChain' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /events/{id}/person:
    get:
      summary: Olay anında kişi kartı — adres, kapı notu, tıbbi özet. E-03, T-040
      description: |
        Yalnız olayı yürüten operatöre (aksi 409). Sağlık verisi yalnız burada (ve 112 şablonunda) çözülür; her
        çözüm audit.log'a `health.medical_viewed` (operatör, olay; içerik yok). Profil yoksa (simülatör kimliği) null.
      operationId: getEventPerson
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: Kişi kartı
          content:
            application/json:
              schema: { oneOf: [{ $ref: '#/components/schemas/PersonCard' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /events/{id}/script:
    get:
      summary: 112 şablonu — olay ve kişi bilgisiyle doldurulmuş metin. E-06, T-024
      description: |
        Yalnız olayı yürüten operatöre (aksi 409); erişim audit.log'a yazılır (içerik yazılmaz). Bilinmeyen alan
        "bilinmiyor". Adres: kayıtlı adres + olay konumu (yoksa kayıtlı konum). Tıbbi alanlar ve kapı notu T-040
        şifreli profilden bu istek anında çözülür (`health.medical_viewed`).
      operationId: getDispatchScript
      security: [{ operatorToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/EventId' }
        - { name: kind, in: query, required: true, schema: { enum: [dispatch112] } }
      responses:
        '200':
          description: Şablon
          content:
            application/json:
              schema:
                type: object
                required: [kind, code, fields, text]
                properties:
                  kind: { enum: [dispatch112] }
                  code: { type: string, description: Katalog kodu (O-SCRIPT-112) }
                  fields:
                    type: object
                    properties:
                      type: { type: string }
                      name: { type: string }
                      age: { type: string }
                      address: { type: string }
                      conditions: { type: string }
                      medications: { type: string }
                      allergies: { type: string }
                      doorNote: { type: string }
                  text: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /events/dispatches:
    get:
      summary: 112 süreçleri — süren (open=1) veya son 30 gün. Amir panosu, yönetim
      operationId: listDispatches
      security: [{ operatorToken: [] }]
      parameters: [{ name: open, in: query, schema: { type: string, enum: ['1', 'true'] } }]
      responses:
        '200':
          description: Süreçler (zaman çizelgesiz)
          content:
            { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DispatchView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /events/{id}/dispatch:
    get:
      summary: 112 bildirim ve intikal süreci + zaman çizelgesi
      operationId: getDispatch
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          {
            description: Süreç,
            content: { application/json: { schema: { $ref: '#/components/schemas/DispatchView' } } },
          }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      summary: 112 aşaması / vaka no / tahmini varış / hastane / not (olay kapalıyken de)
      description: |
        Olay DISPATCH'e geçince süreç NOTIFIED açılır. Aşama yalnız ileri gider (NOTIFIED → ACCEPTED → EN_ROUTE →
        ON_SCENE → TRANSPORTING → AT_HOSPITAL → COMPLETED; CANCELLED her an); atlanan ara aşamalar aynı zamanı alır.
        Ekip olay yerinde → aileye F-112-ON-SCENE; nakil/hastanede → F-112-HOSPITAL. Ekip DISPATCH_ARRIVAL_SLA_MIN
        (15) içinde ulaşmazsa amire O-DISPATCH-NO-ARRIVAL, ulaştıktan sonra süreç açık kaldıkça O-DISPATCH-OPEN
        (DISPATCH_OPEN_REMIND_MIN, 60). Kapanmış süreç 409, geri aşama 409.
      operationId: updateDispatch
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  { enum: [NOTIFIED, ACCEPTED, EN_ROUTE, ON_SCENE, TRANSPORTING, AT_HOSPITAL, COMPLETED, CANCELLED] }
                caseRef: { type: [string, 'null'], maxLength: 64 }
                etaMin: { type: [integer, 'null'], minimum: 0, maximum: 600 }
                hospital: { type: [string, 'null'], maxLength: 160 }
                note: { type: string, maxLength: 1000 }
                source: { enum: [OPERATOR, EMS, FAMILY], default: OPERATOR }
      responses:
        '200':
          {
            description: Güncel süreç,
            content: { application/json: { schema: { $ref: '#/components/schemas/DispatchView' } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /events/{id}/claim:
    post:
      summary: Olayı üstlen; zincir oluşur, operatör kilidi başlar (300 sn). E-02, D-04, T-021
      description: |
        Aynı operatör tekrar üstlenirse aynı sonuç döner. Operatördeki olayın (teyitli dahil) kilidi dolmuşsa veya amir
        bırakmışsa başka operatör devralır: durum değişmez, kilit yeni operatörde başlar, audit `event.taken_over` ve
        `event.updated {reason: TAKEN_OVER}`. Olay alarm olmayan türden alarma yükseltildiyse (TEST'e SOS gibi) zincir
        bu çağrıda yeniden planlanır: bekleyen adımlar `SKIPPED (upgraded)`, yeni türün adımları (112 dahil) eklenir.
        Kilidi taze başka operatördeyse veya olay kuyrukta değilse 409.
      operationId: claimEvent
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200': { $ref: '#/components/responses/EventWithChain' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /events/{id}/heartbeat:
    post:
      summary: Operatör kilidini uzat (konsol açıkken periyodik). D-04
      operationId: heartbeatEvent
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: Yeni kilit bitişi
          content:
            application/json:
              schema: { type: object, properties: { lockUntil: { type: string, format: date-time } } }
        '409': { $ref: '#/components/responses/Problem' }
  /events/{id}/chain/steps/{n}/call:
    post:
      summary: Sıradaki adımı ara. E-04, T-021, T-050
      description: |
        Arama başlangıcı yazılır. Telefoni açıksa ve adımın numarası kayıtlıysa CPaaS araması başlar (operatör ucu →
        aranan; iki kanallı kayıt, arananın duyduğu kayıt anonsu). Operatör ucu yazılım telefonu açıksa
        `client:<sub>` (konsol, T-051), değilse masa hattı (CPAAS_AGENT_NUMBER). 112 adımı masa hattından elle (T-052). Süren aramada
        tekrar çağrı yeni arama açmaz. Durum `calls[]`'ta; son durumda `suggestedResult` operatöre önerilir.
      operationId: callStep
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/StepN' }]
      responses:
        '200': { $ref: '#/components/responses/EventWithChain' }
        '409': { $ref: '#/components/responses/Problem' }
  /events/{id}/chain/steps/{n}/script-read:
    post:
      summary: Operatör metninin (ör. 112 şablonu) okunduğunu kaydet. E-06, T-024
      operationId: scriptRead
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/StepN' }]
      responses:
        '200': { $ref: '#/components/responses/EventWithChain' }
        '409': { $ref: '#/components/responses/Problem' }
  /events/{id}/chain/steps/{n}/result:
    post:
      summary: Adım sonucu. D-03, T-021
      description: |
        Sıra zorunlu: yalnız sıradaki adım (aksi 409). SKIPPED gerekçe (reason) ister. Geçişler:
        ilk sonuç OPERATOR_ASSIGNED → CONTACT_CHAIN; REACHED + assessment OK → CONFIRMED_OK (kalan adımlar
        SKIPPED/resolved); REACHED + EMERGENCY → CONFIRMED_EMERGENCY (112 dışı adımlar SKIPPED/emergency);
        CALL_112 REACHED → DISPATCH; CALL_112 ulaşılamadı → yeni CALL_112 adımı.
      operationId: stepResult
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }, { $ref: '#/components/parameters/StepN' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { enum: [REACHED, NO_ANSWER, BUSY, WRONG_NUMBER, SKIPPED] }
                assessment: { enum: [OK, EMERGENCY], description: Yalnız REACHED ile }
                note: { type: string, maxLength: 2000 }
                reason: { type: string, maxLength: 500, description: SKIPPED için zorunlu }
      responses:
        '200': { $ref: '#/components/responses/EventWithChain' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /events/{id}/escalate-112:
    post:
      summary: Doğrudan 112 (Ctrl+1). Gerekçe zorunlu; kalan adımlar SKIPPED(reason=escalate). E-06, T-021
      operationId: escalate112
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 1, maxLength: 500 } }
      responses:
        '200': { $ref: '#/components/responses/EventWithChain' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /events/{id}/close:
    post:
      summary: Olayı kapat; bekleyen adımlar SKIPPED(reason=closed). E-07
      description: EMERGENCY teyitli (CONFIRMED_EMERGENCY/DISPATCH) olay yalnız EMERGENCY ile, CONFIRMED_OK olay EMERGENCY dışı sonuçla kapanır (aksi 409).
      operationId: closeEvent
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { enum: [OK, EMERGENCY, FALSE_ALARM, TEST, UNREACHABLE] }
                note: { type: string, maxLength: 2000 }
                followUpAfterHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  description: Takip araması (T-024). EMERGENCY'de zorunlu; verilmezse kuralın followUpAfterHours'u (24).
      responses:
        '204': { description: Closed }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /webhooks/cpaas/{kind}:
    post:
      summary: CPaaS geri çağrıları (Twilio uyumlu). E-05, T-050
      description: |
        Herkese açık; yalnız imzalı istek (X-Twilio-Signature: base64(HMAC-SHA1(token, CPAAS_WEBHOOK_BASE + yol +
        sıralı parametreler))). Bozuk imza 403. kind: status (aranan bacak), dial (bağlantı sonucu; görüşme konferansa
        taşındıysa operatörü odaya alan TwiML), agent (operatör bacağı), recording (kayıt hazır → S3, sağlayıcıdan
        silinir; konferans kaydı ayrı nesne), announce (arananın duyduğu kayıt anonsu), party (konferansa eklenen yakın,
        T-051).
      operationId: cpaasWebhook
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { enum: [status, dial, agent, recording, announce, party] } }
        - { name: call, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: X-Twilio-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: TwiML
          content: { text/xml: { schema: { type: string } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /webhooks/cpaas-inbound/{kind}:
    post:
      summary: Gelen SOS araması geri çağrıları (Twilio uyumlu). E-05, T-051 kalan
      description: |
        Herkese açık; yalnız imzalı istek (giden aramadakiyle aynı X-Twilio-Signature şeması), bozuksa 403.
        Twilio numarasının (ya da BYOC trunk'ın) Voice URL'i `call`, durum geri çağrısı `status` (ikisi CallSid ile;
        `call` parametresi yok). Yönlendirme TwiML'inin verdiği diğerleri `?call=<gelen arama kimliği>` taşır:
        dial (operatör `<Dial>` sonucu: cevapsız/meşgul → sıradaki operatör, cevaplanıp bitti → kapat), agent
        (operatör bacağı açıldı → bağlı), wait (kuyruk bekleme döngüsü: V-INBOUND-WAIT + Pause ya da müsait operatör
        varsa `<Leave/>`), leave (kuyruktan çıkış: leave → yeniden yönlendir, hangup → vazgeçti), recording (kayıt →
        S3 `recordings/<ülke>/<olay|inbound>/…`, sağlayıcıdan silinir). Sıra: arayanın açık olayını yürüten operatör
        (bağlıysa), sonra bağlı ve AVAILABLE operatörler (açık olayı olmayan, en uzun boşta kalan önce); kimse yoksa
        `<Enqueue>`. Arayan numara saklanmaz.
      operationId: cpaasInboundWebhook
      security: []
      parameters:
        - {
            name: kind,
            in: path,
            required: true,
            schema: { enum: [call, status, dial, agent, wait, leave, recording] },
          }
        - { name: call, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: X-Twilio-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: TwiML
          content: { text/xml: { schema: { type: string } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /telephony/config:
    get:
      summary: Konsol telefoni yapılandırması (masa hattı, 112). E-05, T-052
      description: |
        Yazılım telefonu ve gelen arama açık mı; masa sabit hattı (CPAAS_AGENT_NUMBER, ulusal gösterim — 112 geri arama
        numarası olarak okunur, yoksa null); acil numarası kural paketinden (`numbers.emergency`). Sır yok.
      operationId: telephonyConfig
      security: [{ operatorToken: [] }]
      responses:
        '200':
          description: Yapılandırma
          content:
            application/json:
              schema:
                type: object
                required: [softphone, inbound, deskLine, emergencyNumber]
                properties:
                  softphone: { type: boolean }
                  inbound: { type: boolean }
                  deskLine: { type: [string, 'null'], example: '0212 000 00 00' }
                  emergencyNumber: { type: string, example: '112' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /operators/me:
    get:
      summary: Operatörün kendi durumu. E-05, T-051 kalan
      operationId: myOperatorStatus
      security: [{ operatorToken: [] }]
      responses:
        '200':
          description: Durum (kayıt yoksa AVAILABLE, statusAt null)
          content:
            application/json:
              schema:
                type: object
                required: [subject, status, statusAt]
                properties:
                  subject: { type: string }
                  status: { enum: [AVAILABLE, BREAK, OFFLINE] }
                  statusAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /operators/me/status:
    put:
      summary: Operatör kendi durumunu seçer (Müsait / Molada; audit). E-05, T-051 kalan
      description: |
        Gelen SOS aramaları yalnız bağlı (WS, 90 sn) ve AVAILABLE operatörlere çalar (olayı yürüten operatör hariç:
        kendi olayının kişisi ararsa molada da çalar). OFFLINE amir işidir (`PUT /v1/supervisor/operators/{sub}/status`),
        burada 400.
      operationId: setMyOperatorStatus
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { enum: [AVAILABLE, BREAK] } }
      responses:
        '200':
          description: Yeni durum
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  status: { enum: [AVAILABLE, BREAK] }
                  statusAt: { type: string, format: date-time }
                  statusBy: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /webhooks/screening/{kind}:
    post:
      summary: Otomatik sesli ön eleme geri çağrıları (Twilio uyumlu). D-12, T-072
      description: |
        Herkese açık; yalnız imzalı istek (X-Twilio-Signature, CPAAS_WEBHOOK_BASE + yol); bozuk imza 403.
        kind: gather (Gather sonucu: Digits / SpeechResult / Confidence → sınıflandırma; yanıt sonuca göre katalog
        metni V-SCREEN-OK ya da V-SCREEN-HELP + kapat), status (arama durumu; Gather sonucu gelmeden biten arama
        cevapsız / FAILED sayılır). İlk sonuç kazanır; tekrar teslim olayı değiştirmez. Bilinmeyen kimlik boş TwiML.
      operationId: screeningWebhook
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { enum: [gather, status] } }
        - { name: s, in: query, required: true, schema: { type: string, format: uuid }, description: Ön eleme kimliği }
        - { name: X-Twilio-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                CallSid: { type: string }
                CallStatus:
                  { enum: [queued, initiated, ringing, in-progress, completed, busy, no-answer, failed, canceled] }
                Digits: { type: string }
                SpeechResult: { type: string }
                Confidence: { type: string }
              additionalProperties: { type: string }
      responses:
        '200':
          description: TwiML
          content: { text/xml: { schema: { type: string } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /screening/stats:
    get:
      summary: Otomatik sesli ön eleme sonuçları ve yanlış pozitif ölçümü. D-12, T-072
      description: |
        SUPERVISOR veya ADMIN. Son `days` gündeki ön elemelerin sonuç dağılımı; öğrenme modunda (kişinin ilk ayı)
        kural paketindeki `operatorSampleRate` oranıyla OK sonuçlarından operatöre düşen geri arama (CALLBACK P4,
        kaynak `voice-screen-sample:<olay>`) örneklemi, kapanmış olanlar ve acil çıkanlar (yanlış pozitif).
      operationId: screeningStats
      security: [{ operatorToken: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        '200':
          description: Özet
          content:
            application/json:
              schema:
                type: object
                required: [since, total, byResult, sampled, sampleReviewed, sampleFalsePositive, falsePositiveRate]
                properties:
                  since: { type: string, format: date-time }
                  total: { type: integer }
                  byResult:
                    type: object
                    properties:
                      OK: { type: integer }
                      HELP: { type: integer }
                      UNCLEAR: { type: integer }
                      NO_ANSWER: { type: integer }
                      FAILED: { type: integer }
                      PENDING: { type: integer }
                      CANCELLED: { type: integer }
                  sampled: { type: integer }
                  sampleReviewed: { type: integer }
                  sampleFalsePositive: { type: integer }
                  falsePositiveRate: { type: [number, 'null'] }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /telephony/token:
    get:
      summary: Konsol yazılım telefonu token'ı. E-05, T-051
      description: |
        Kısa ömürlü Twilio Voice erişim token'ı (AccessToken + VoiceGrant; HS256, TWILIO_API_KEY_SID/SECRET; ömür
        TWILIO_VOICE_TOKEN_TTL_SEC, 60–3600 sn). Kimlik operatörün `sub`'ı (yalnız harf/rakam/alt çizgi): sunucu
        `client:<identity>`'yi arar, konsol gelen köprü bacağını kendiliğinden açar. Sahte sağlayıcıda
        (CPAAS_PROVIDER=fake) `provider: fake` ve sahte token. Yazılım telefonu kapalıysa (CPAAS_SOFTPHONE=off, telefoni
        kapalı ya da Twilio API anahtarı yok) 503: operatör ucu masa hattıdır.
      operationId: telephonyToken
      security: [{ operatorToken: [] }]
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                required: [provider, identity, token, ttlSec, expiresAt]
                properties:
                  provider: { enum: [twilio, fake] }
                  identity: { type: string }
                  token: { type: string }
                  ttlSec: { type: integer }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /telephony/calls/{callId}/hold:
    post:
      summary: Süren görüşmede arananı beklet / devam. E-05, T-051
      description: |
        Görüşme ilk kez bekletilince konferansa taşınır (Twilio `<Conference>`), aranan katılımcı `Hold` ile bekletilir.
        Yalnız aramayı başlatan operatör (başkası 403); görüşme sürmüyorsa 409; sağlayıcı hatası 502.
      operationId: holdCall
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [on], properties: { on: { type: boolean } } }
      responses:
        '200': { $ref: '#/components/responses/CallView' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /telephony/calls/{callId}/conference:
    post:
      summary: Konferansa aile ekle. E-05, T-051
      description: |
        Görüşme konferansa taşınır (bir kez) ve rehberdeki CONTACT (sıra `contactIndex`, varsayılan 1) aranır; açınca
        kayıt anonsu (V-CALL-RECORDED) duyar ve odaya katılır. Oda kaydı başından alınır ve olay kaydına (S3) yazılır.
        Numara yanıtta, log'da ve audit'te yok. Yakın kayıtlı değilse veya görüşme sürmüyorsa 409.
      operationId: conferenceCall
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      requestBody:
        content:
          application/json:
            schema:
              { type: object, properties: { contactIndex: { type: integer, minimum: 1, maximum: 5, default: 1 } } }
      responses:
        '200': { $ref: '#/components/responses/CallView' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /telephony/calls/{callId}/hangup:
    post:
      summary: Aramayı bitir. E-05, T-051
      description: |
        Operatör bacağı sağlayıcıda kapatılır (konferansta oda da kapanır). Bitmiş aramada etkisiz (200).
      operationId: hangupCall
      security: [{ operatorToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      responses:
        '200': { $ref: '#/components/responses/CallView' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /protected-persons:
    post:
      summary: Korunan kişi oluştur. C-02, T-040
      description: |
        Aile (FAMILY) oluşturursa sahibi (OWNER) olur; deneme aboneliği açılır. Adres GOOGLE_GEOCODING_KEY varsa
        konumlanır (lat/lng verilirse o kullanılır). Kapı notu AES-256-GCM ile şifreli saklanır.
      operationId: createProtectedPerson
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/PersonInput' }
                - type: object
                  required: [displayName]
                  properties:
                    relation: { type: string, maxLength: 50, description: Ailenin kişiye yakınlığı (ör. Kızı) }
      responses:
        '201':
          {
            description: Oluşturuldu,
            content: { application/json: { schema: { $ref: '#/components/schemas/PersonView' } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    get:
      summary: Kişiler — aile yalnız kendi kişilerini, yönetici hepsini görür. C-02, T-040
      operationId: listProtectedPersons
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PersonView' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
  /protected-persons/{id}:
    get:
      summary: Kişi. Başka ailenin kişisi 404. C-02, T-040
      operationId: getProtectedPerson
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '200':
          { description: Kişi, content: { application/json: { schema: { $ref: '#/components/schemas/PersonView' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Kişiyi güncelle (verilen alanlar). Adres değişirse yeniden konumlanır; doorAccessNote null siler. T-040
      operationId: updateProtectedPerson
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PersonInput' } } }
      responses:
        '200':
          { description: Kişi, content: { application/json: { schema: { $ref: '#/components/schemas/PersonView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/medical:
    put:
      summary: Tıbbi özet (şifreli). Rıza zamanı zorunlu. C-03, T-040
      description: |
        Tek şifreli kayıt olarak saklanır (AES-256-GCM, FIELD_ENC_KEYS). İçerik aileye de geri okunmaz (yalnız
        var/yok ve rıza zamanı); olay anında olayı yürüten operatöre çözülür. audit.log'a içerik yazılmaz.
      operationId: setMedical
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/Medical' }
                - type: object
                  required: [consentAt]
                  properties:
                    consentAt:
                      {
                        type: string,
                        format: date-time,
                        description: Kişinin/vasinin rıza verdiği an (gelecekte olamaz),
                      }
      responses:
        '200':
          description: Kaydedildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  present: { type: boolean }
                  consentAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Rıza geri alındı — tıbbi özeti sil. C-03, T-040
      operationId: deleteMedical
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '204': { description: Silindi }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/test-sos:
    post:
      summary: Test çağrısı — TEST olayı (P4, 112'siz, kurulum metni). C-05, T-063
      description: |
        Aile (kendi kişisi) veya yönetici. `Idempotency-Key` aynı isteği aynı olaya bağlar. Açık olay varsa 409; son
        10 dakikada test yapıldıysa 429. Aileye yalnız test bildirimleri gider (F-TEST-QUEUED, F-TEST-DONE); test
        olayı metriklere girmez.
      operationId: requestTestSos
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PersonId' }
        - { name: Idempotency-Key, in: header, schema: { type: string, minLength: 8, maxLength: 100 } }
      responses:
        '202':
          {
            description: Başlatıldı,
            content: { application/json: { schema: { $ref: '#/components/schemas/TestStatus' } } },
          }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/test-sos/{eventId}:
    get:
      summary: Test ilerlemesi ve operatör notu. C-05, T-063
      operationId: getTestSos
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PersonId' }
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          { description: Durum, content: { application/json: { schema: { $ref: '#/components/schemas/TestStatus' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/daily-summaries:
    get:
      summary: Günlük özet — ilk öğe bugün (kısmi), sonra kayıtlı günler. C-07, T-062
      operationId: listDailySummaries
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PersonId' }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 31, default: 7 } }
      responses:
        '200':
          description: Özetler
          content:
            { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DailySummary' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /devices/{id}/summary/today:
    get:
      summary: Telefon ana ekranı özet satırı (bugün, kısmi). B-10, T-062
      operationId: deviceTodaySummary
      security: [{ deviceToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          {
            description: Bugün,
            content: { application/json: { schema: { $ref: '#/components/schemas/DailySummary' } } },
          }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/contacts:
    put:
      summary: Zincirin arayacağı numaraları değiştir (yalnız OWNER veya ADMIN; MEMBER 403). C-03, T-040 (T-050)
      description: |
        Liste bütün olarak değişir. CONTACT sıralı 1–5 (öncelik verilmezse liste sırası); ELDER, WATCH, NEIGHBOR en
        çok birer. Aile yalnız kendi kişisine; yönetici simülatör kimliklerine de yazabilir. Numaralar yalnız arama
        anında okunur; log, audit ve arama kaydına yazılmaz.
      operationId: setContacts
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 8
              items:
                type: object
                required: [role, phone]
                properties:
                  role: { enum: [ELDER, WATCH, CONTACT, NEIGHBOR] }
                  priority: { type: integer, minimum: 1, maximum: 5, description: CONTACT sırası (CALL_CONTACT:n) }
                  displayName: { type: string, maxLength: 100 }
                  phone: { type: string, pattern: '^\+[1-9]\d{6,14}$' }
      responses:
        '200':
          {
            description: Kaydedildi,
            content: { application/json: { schema: { type: object, properties: { count: { type: integer } } } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    get:
      summary: Numaralar (tam numara geri verilmez, son 2 hane). T-040
      operationId: listContacts
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          {
            description: Liste,
            content:
              { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ContactView' } } } },
          }
        '404': { $ref: '#/components/responses/Problem' }
  /me/push-target:
    put:
      summary: Aile/kişi uygulamasının push token'ı (FCM). D-08, T-053
      description: Aynı token başka hesaba geçmişse taşınır. Geçersiz token (FCM UNREGISTERED) ilk gönderimde silinir.
      operationId: setPushTarget
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform: { enum: [FCM] }
                token: { type: string, minLength: 20, maxLength: 4096 }
      responses:
        '204': { description: Kaydedildi }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Push token'ını kaldır (çıkış). T-053
      operationId: deletePushTarget
      security: [{ userToken: [] }]
      parameters: [{ name: token, in: query, required: true, schema: { type: string } }]
      responses:
        '204': { description: Kaldırıldı }
  /notifications/{id}/ack:
    post:
      summary: Bildirim gösterildi (teslim onayı). D-08, T-053
      description: |
        Push veri alanındaki `notificationId` ile. Bilgi bildirimlerinde 10 sn içinde onay gelmezse ilk yakına SMS
        gönderilir; onay bunu iptal eder. Başka hesabın bildirimi 404.
      operationId: ackNotification
      security: [{ userToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Teslim edildi }
        '404': { $ref: '#/components/responses/Problem' }
  /webhooks/notify/sms:
    post:
      summary: CPaaS SMS teslim raporu (Twilio StatusCallback). T-053
      description: İmzalı (X-Twilio-Signature, CPAAS_WEBHOOK_BASE + yol); bozuksa 403. Durum geri gitmez.
      operationId: smsStatusWebhook
      security: []
      parameters: [{ name: 'n', in: query, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                MessageSid: { type: string }
                MessageStatus: { enum: [queued, sent, delivered, undelivered, failed] }
                ErrorCode: { type: string }
      responses:
        '200': { description: TwiML, content: { text/xml: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /supervisor/dashboard:
    get:
      summary: Amir panosu — kuyruk, operatörler, SLA ihlalleri, olay dağılımı, yanlış alarm. E-09, E-11, T-025, T-074
      description: |
        SUPERVISOR veya ADMIN. Konsol aynı gövdeyi WS'den 5 sn'de bir alır. Prometheus metrikleri ayrıca API'nin iç
        ağdaki METRICS_PORT'unda `/metrics` (genel API'de yok).
      operationId: supervisorDashboard
      security: [{ operatorToken: [] }]
      responses:
        '200':
          description: Özet
          content:
            application/json:
              schema:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  queue:
                    type: array
                    items:
                      type: object
                      properties:
                        priority: { type: integer }
                        waiting: { type: integer }
                        oldestWaitSec: { type: [integer, 'null'] }
                  inProgress: { type: integer }
                  activeOperators: { type: integer }
                  last24h:
                    type: object
                    properties:
                      closed: { type: integer }
                      byOutcome: { type: object, additionalProperties: { type: integer } }
                      falseAlarmRatio: { type: number }
                      claim:
                        type: object
                        properties:
                          count: { type: integer }
                          p50Sec: { type: [number, 'null'] }
                          p95Sec: { type: [number, 'null'] }
                          overSlaCount: { type: integer, description: 10 sn hedefini aşan üstlenme }
                  falseAlarms: { $ref: '#/components/schemas/FalseAlarmStats' }
                  queueDepth24h:
                    type: array
                    description: Son 24 saat, saat başına (24 nokta). depth saat sonundaki (son saatte şimdiki) bekleyen.
                    items:
                      type: object
                      properties:
                        at: { type: string, format: date-time }
                        depth: { type: integer }
                        entered: { type: integer }
                  byType24h: { type: object, additionalProperties: { type: integer }, description: Test hariç }
                  operators: { type: array, items: { $ref: '#/components/schemas/OperatorCard' } }
                  slaBreaches:
                    type: array
                    description: Canlılar önce, sonra en yeni; en çok 50. Test olayları yok.
                    items: { $ref: '#/components/schemas/SlaBreach' }
                  sla:
                    type: object
                    properties: { claimSec: { type: integer }, firstCallSec: { type: integer } }
                  overflow: { $ref: '#/components/schemas/OverflowFlag' }
                  inbound:
                    type: object
                    description: Bağlanmamış gelen SOS aramaları (routing/ringing/queued); arayan numara yok.
                    properties:
                      queued: { type: integer }
                      ringing: { type: integer }
                      oldestQueuedSec: { type: [integer, 'null'] }
                      calls:
                        type: array
                        description: En eski önce, en çok 20.
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            status: { type: string, enum: [routing, ringing, queued] }
                            eventId: { type: [string, 'null'], format: uuid }
                            person: { type: [string, 'null'], description: Eşleşen kişinin görünen adı }
                            operatorId: { type: [string, 'null'] }
                            waitSec: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /supervisor/operators/{sub}/status:
    put:
      summary: Amir — operatör durumunu değiştir (audit). E-11, T-074
      description: |
        Gelen SOS yönlendirmesi bunu kullanır (yalnız AVAILABLE ve bağlı operatör çalar); olay kilidini değiştirmez
        (unclaim ayrı). Operatör kendi durumunu `PUT /v1/operators/me/status` ile seçer.
      operationId: setOperatorStatus
      security: [{ operatorToken: [] }]
      parameters: [{ name: sub, in: path, required: true, schema: { type: string, maxLength: 200 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { enum: [AVAILABLE, BREAK, OFFLINE] } }
      responses:
        '200':
          description: Yeni durum
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  status: { enum: [AVAILABLE, BREAK, OFFLINE] }
                  statusAt: { type: string, format: date-time }
                  statusBy: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /supervisor/overflow:
    put:
      summary: Amir — yedek merkeze taşma bayrağı (v1.0'da yalnız işaret; yönlendirme v2.0). E-11, T-074
      operationId: setOverflow
      security: [{ operatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        '200':
          {
            description: Bayrak,
            content: { application/json: { schema: { $ref: '#/components/schemas/OverflowFlag' } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/events:
    get:
      summary: Aile — kişinin olayları (yeniden eskiye). C-06, T-061
      operationId: listPersonEvents
      security: [{ userToken: [] }, { adminToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PersonId' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Olaylar
          content:
            application/json:
              schema:
                type: object
                properties: { items: { type: array, items: { $ref: '#/components/schemas/FamilyEventSummary' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/events/{eventId}:
    get:
      summary: Aile — olay ayrıntısı (aşama, zincir adımları, geri bildirim). C-06, C-12, T-061
      description: |
        Numara, ad, operatör kimliği ve konum dönmez. Operatör notu yalnız kapanmış test olayında. Canlı değişiklikler
        WebSocket `/v1/ws/family`: ilk mesaj `{"type":"auth","token":"<consumers erişim token'ı>"}` (FAMILY; 5 sn içinde);
        sunucu `ready {persons}` ve ardından ailenin kişilerindeki olaylar için `event {event}` (bu gövde) gönderir.
        Kapanış kodları 4400/4401/4403 kuyruk WS'si ile aynı.
      operationId: getPersonEvent
      security: [{ userToken: [] }, { adminToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PersonId' }
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          { description: Olay, content: { application/json: { schema: { $ref: '#/components/schemas/FamilyEvent' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/status:
    get:
      summary: Korunan kişinin koruma durumu. D-05, T-014
      description: |
        Koruma durumu sinyallerle ve periyodik taramayla (gece başlangıcı/bitişi, 15 dk sessiz cihaz) güncellenir:
        saat bağlı ve bilekte → PROTECTED_WATCH; değilse gece penceresinde → NIGHT; değilse telefon bağlı →
        PROTECTED_PHONE; hiçbiri → UNPROTECTED. Bağlantı: ONLINE (<15 dk), NO_CONNECTION (<6 saat), LOST.
        Operasyon rolleri (OPERATOR, SUPERVISOR, ADMIN) her kişiyi; aile (consumers FAMILY, T-061) yalnız kendi kişisini
        görür (başkasınınki 404) ve ek olarak `location` alır (konum paylaşımı açıksa son 24 saatteki son konum).
        Kişiden henüz sinyal gelmediyse 404.
      operationId: getProtectionStatus
      security: [{ operatorToken: [] }, { userToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '200':
          description: Durum
          content:
            application/json:
              schema:
                type: object
                required: [protectedPersonId, state, since, watch, phone, sleepWindow]
                properties:
                  protectedPersonId: { type: string }
                  state: { enum: [PROTECTED_WATCH, PROTECTED_PHONE, NIGHT, UNPROTECTED] }
                  since: { type: string, format: date-time }
                  reason: { type: [string, 'null'] }
                  watch:
                    type: object
                    properties:
                      onWrist: { type: [boolean, 'null'] }
                      lastSeenAt: { type: [string, 'null'], format: date-time }
                      connection: { enum: [ONLINE, NO_CONNECTION, LOST] }
                  phone:
                    type: object
                    properties:
                      lastSeenAt: { type: [string, 'null'], format: date-time }
                      connection: { enum: [ONLINE, NO_CONNECTION, LOST] }
                  sleepWindow:
                    type: object
                    properties:
                      timezone: { type: string }
                      start: { type: string, example: '22:00' }
                      end: { type: string, example: '08:00' }
                  location:
                    description: Yalnız aile yanıtında (C-08 harita); paylaşım kapalı veya konum yoksa null.
                    type: [object, 'null']
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      accuracyM: { type: [number, 'null'] }
                      at: { type: string, format: date-time }
                  openEvent:
                    type: [object, 'null']
                    properties:
                      id: { type: string }
                      type: { type: string }
                      state: { type: string }
                      priority: { type: integer }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/invite:
    post:
      summary: Cihaz davet kodu üret. C-02, T-040 / T-041
      description: |
        6 haneli kod, 15 dk geçerli, tek kullanımlık. Yalnız sha256 özeti saklanır. Aile yalnız kendi kişisine;
        yönetici (OIDC ADMIN veya `x-admin-token`) hepsine. `smsText` katalogdan (S-INVITE); SMS gönderimi T-053.
      operationId: createInvite
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Kod
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt, smsText]
                properties:
                  code: { type: string, pattern: '^\d{6}$' }
                  expiresAt: { type: string, format: date-time }
                  smsText: { type: string, description: Katalog S-INVITE }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/learning:
    get:
      summary: Öğrenme modu ve kişiye özel eşikler (profil raporu özeti). D-06, T-070
      description: |
        Kişi oluşturulunca öğrenme modu kural paketi `learning.days` (30) gün sürer. Günlük iş son `historyDays` (14)
        günün sinyallerinden uyku penceresini ve hareketsizlik eşiğini (p95, 15–90 dk) öğrenir; aile elle ayarladığı
        alana (kaynak FAMILY) dokunmaz. Dönem bitince aileye bir kez F-LEARN-REPORT gider. Başka ailenin kişisi 404.
      operationId: getLearning
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '200':
          {
            description: Özet,
            content: { application/json: { schema: { $ref: '#/components/schemas/LearningSummary' } } },
          }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/thresholds:
    put:
      summary: Aile eşik ayarı (uyku penceresi, hareketsizlik eşiği). D-06, T-070
      description: |
        Verilen alan aile ayarı olur (kaynak FAMILY) ve öğrenme ona dokunmaz. `null` aile ayarını kaldırır
        (varsayılana döner; öğrenme modundaysa sonraki günlük işte yeniden öğrenilir). inactivityMin kural paketinin
        INACTIVITY.thresholdMin min–max aralığında (15–90).
      operationId: setThresholds
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                sleepWindow:
                  type: [object, 'null']
                  required: [start, end]
                  properties:
                    start: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
                    end: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
                inactivityMin: { type: [integer, 'null'], minimum: 15, maximum: 90 }
                fallPromptSec:
                  type: [integer, 'null']
                  minimum: 30
                  maximum: 90
                  description: Düşme sorusu cevap süresi (T-061, C-09); null → kural paketi (60 sn)
      responses:
        '200':
          {
            description: Özet,
            content: { application/json: { schema: { $ref: '#/components/schemas/LearningSummary' } } },
          }
        '400': { $ref: '#/components/responses/Problem', description: 'Geçersiz değer; uyku penceresi en çok 12 saat' }
        '403': { $ref: '#/components/responses/Problem', description: 'Yalnız hesap sahibi (OWNER) değiştirir' }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/false-alarms:
    get:
      summary: Kişinin son 30 gün yanlış alarm oranı. D-07, T-071
      description: |
        Yanlış alarm = kişi cihazdan iptal etti (USER_CANCEL), operatör FALSE_ALARM ile kapattı (OPERATOR) veya aile
        "gerçek değildi" dedi (FAMILY_FEEDBACK); olay başına bir kez, test olayları hariç. Pencerede 3. yanlış alarmda
        aileye F-EVT-OK + F-FA-REVIEW ve konsolda "eşik görüşmesi" CALLBACK olayı (P4) açılır.
      operationId: getFalseAlarms
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '200':
          description: Oran
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FalseAlarmStats'
                  - type: object
                    required: [protectedPersonId]
                    properties: { protectedPersonId: { type: string, format: uuid } }
        '404': { $ref: '#/components/responses/Problem' }
  /events/{id}/feedback:
    post:
      summary: Aile geri bildirimi "Gerçek miydi?". C-12, T-071
      description: |
        Yalnız aile (consumers FAMILY) ve yalnız kendi kişisinin kapanmış olayı. Aile üyesi başına olay başına bir cevap
        (son cevap geçerli). `real: false` olayı FAMILY_FEEDBACK nedeniyle yanlış alarm sayar (zaten sayılıyorsa ilk
        neden kalır). Başka ailenin olayı 404, açık olay 409, aile dışı 403.
      operationId: eventFeedback
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [real], properties: { real: { type: boolean } } }
      responses:
        '201':
          description: Kaydedildi
          content:
            application/json:
              schema:
                type: object
                required: [eventId, real, falseAlarm]
                properties:
                  eventId: { type: string, format: uuid }
                  real: { type: boolean }
                  falseAlarm: { type: boolean, description: Olay yanlış alarm sayılıyor mu }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          {
            $ref: '#/components/responses/Problem',
            description: 'Olay kapanmadı veya acil olarak teyit edildi (yanlış alarm sayılamaz)',
          }
  /devices/enroll:
    post:
      summary: Cihaz kaydı (davet kodu → cihaz token'ı). T-041
      description: |
        deviceId istemcide üretilir (UUID, küçük harf) ve sinyallerde aynen kullanılır. Yanıt yolda kaybolursa aynı
        cihaz aynı kodla kodun süresi içinde yeniden dener ve 200 ile yeni token alır. Yanlış/süresi dolmuş/başka
        cihazın kullandığı kod 400; kayıtlı deviceId 409; aynı IP'den 15 dk'da 10 hatalı kod 429.
      operationId: enrollDevice
      security: [] # davet kodu kimlik doğrular
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode, deviceId, kind]
              properties:
                inviteCode: { type: string, pattern: '^\d{6}$' }
                deviceId: { type: string, format: uuid }
                kind: { enum: [WEAROS_WATCH, ANDROID_PHONE, IOS_PHONE] }
                model: { type: string, maxLength: 100 }
                osVersion: { type: string, maxLength: 50 }
                appVersion: { type: string, maxLength: 50 }
      responses:
        '201': { $ref: '#/components/responses/DeviceToken' }
        '200': { $ref: '#/components/responses/DeviceToken' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /devices/{id}/token:
    post:
      summary: Cihaz token'ını yenile (geçerli token ile). T-041
      description: Token 1 yıl geçerlidir; istemci `refreshAfter` sonrasında (bitişe 30 gün kala) yeniler.
      operationId: refreshDeviceToken
      security: [{ deviceToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/DeviceToken' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /devices/{id}/config:
    get:
      summary: Cihaz yapılandırması (eşikler, uyku penceresi, katalog metinleri). T-041
      operationId: getDeviceConfig
      security: [{ deviceToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Yapılandırma
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required:
                  [deviceId, protectedPersonId, kind, rulesVersion, sleepWindow, devicePrompt, messages, subscription]
                properties:
                  deviceId: { type: string }
                  protectedPersonId: { type: string }
                  kind: { type: string }
                  rulesVersion: { type: integer }
                  sleepWindow:
                    type: object
                    properties:
                      timezone: { type: string }
                      start: { type: string, example: '22:00' }
                      end: { type: string, example: '08:00' }
                  devicePrompt:
                    type: object
                    properties:
                      fallWindowSec: { type: [integer, 'null'] }
                      inactivityWindowSec: { type: [integer, 'null'] }
                  inactivityThresholdMin: { type: [integer, 'null'] }
                  subscription:
                    type: object
                    description: |
                      T-060. protectionActive=false (askıda / iptal) iken cihaz "koruma kapalı" gösterir; metin
                      `messages[messageCode]` (P-SUB-PAY, P-SUB-OFF, W-SUB-OFF). status null = abonelik dışı kişi.
                    required: [status, protectionActive, until, messageCode]
                    properties:
                      status: { enum: [TRIAL, ACTIVE, PAYMENT_PENDING, SUSPENDED, CANCELED, null] }
                      protectionActive: { type: boolean }
                      until: { type: [string, 'null'], format: date-time }
                      messageCode: { type: [string, 'null'] }
                  messages:
                    type: object
                    description: Katalog metinleri (telefon P-*, saat W-*)
                    additionalProperties:
                      type: object
                      required: [text]
                      properties:
                        text: { type: string }
                        action: { type: string }
                  operator:
                    type: object
                    description: T-054 operatörün arayan numaraları (telefon hoparlör + rehber) ve gösterilen adı
                    properties:
                      name: { type: [string, 'null'] }
                      callerIds: { type: array, items: { type: string } }
                  familyContact:
                    type: [object, 'null']
                    description: Telefon ana ekranı aile kısayolu (ilk yakın); saate gönderilmez
                    properties:
                      displayName: { type: [string, 'null'] }
                      phone: { type: string }
        '304': { description: Değişmedi (If-None-Match eşleşti) }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /devices/{id}/push-token:
    put:
      summary: Push token kaydı (APNS yalnız IOS_PHONE). T-041, T-053 kullanır
      operationId: putPushToken
      security: [{ deviceToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token]
              properties:
                provider: { enum: [APNS, FCM] }
                token: { type: string, maxLength: 4096 }
                sandbox: { type: boolean, description: APNs geliştirme ortamı }
      responses:
        '204': { description: Kaydedildi }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /devices/{id}/companions:
    post:
      summary: Eşlikçi telefon saatini kaydeder (saatte kod yazılmaz). B-03, T-043
      description: |
        Telefon token'ı ile (yol = telefonun kendi kimliği). Saat kendi UUID'sini üretir, Data Layer ile telefona
        iletir; telefon burada aynı kişiye WEAROS_WATCH olarak kaydeder ve saat token'ını Data Layer ile saate verir.
        Aynı kişinin etkin saati yeniden → 200 + yeni token; kaldırılmış saat yeniden etkinleşir (eski token'lar 401);
        başka kişinin cihazı 409; telefon olmayan token 403.
      operationId: enrollCompanion
      security: [{ deviceToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, format: uuid }
                kind: { enum: [WEAROS_WATCH] }
                model: { type: string, maxLength: 100 }
                osVersion: { type: string, maxLength: 50 }
                appVersion: { type: string, maxLength: 50 }
      responses:
        '201': { $ref: '#/components/responses/DeviceToken' }
        '200': { $ref: '#/components/responses/DeviceToken' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /devices/{id}/setup-state:
    patch:
      summary: Kurulum sihirbazı ilerlemesi (aile uygulamasına). B-02, T-042
      description: |
        Son durum saklanır (aile `GET /protected-persons/{id}/setup-state`). `completed=true` ve `missing` boş değilse
        aileye F-PERM bildirimi (aynı gün aynı eksik kümesi için bir kez).
      operationId: putSetupState
      security: [{ deviceToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupStateInput' }
      responses:
        '204': { description: Kaydedildi }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /devices/{id}/status:
    get:
      summary: Kişinin koruma durumu, cihaz token'ıyla (telefon ana ekranı senkronu). D-05, T-044
      operationId: deviceProtectionStatus
      security: [{ deviceToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: '`GET /protected-persons/{id}/status` ile aynı gövde'
          content: { application/json: { schema: { type: object } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/setup-state:
    get:
      summary: Kişinin cihazlarının kurulum durumu (aile). B-02, T-042
      operationId: listSetupStates
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Cihaz başına son durum
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/SetupStateInput'
                    - type: object
                      required: [deviceId, kind, updatedAt]
                      properties:
                        deviceId: { type: string }
                        kind: { type: string }
                        updatedAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Problem' }
  /devices/{id}:
    delete:
      summary: Cihazı kaldır (token iptal → 401). T-041
      description: Yönetici (OIDC ADMIN veya `x-admin-token`); T-040'ta FAMILY kendi kişisinin cihazını kaldırır.
      operationId: revokeDevice
      security: [{ operatorToken: [] }, { adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Kaldırıldı }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/rules/reload:
    post:
      summary: Kural paketini sıcak yükle (yönetici). D-02, T-012
      description: |
        packages/rules/<ülke>.yaml okunur, JSON Schema ve anlamsal kontrollerle (TTS kodları mesaj kataloğunda)
        doğrulanır, chain.procedure_template'e (ülke, sürüm) kaydedilir ve uygulanır. Aynı sürüm farklı içerikle
        veya daha düşük sürüm yüklenemez (409). Geçersiz paket geçerli paketi değiştirmez. Diğer API örnekleri
        yeni sürümü en geç RULES_REFRESH_MS içinde alır. Yönetici: OIDC ADMIN rolü veya `x-admin-token`.
      operationId: reloadRules
      security: [{ operatorToken: [] }, { adminToken: [] }]
      responses:
        '200':
          description: Yüklendi (changed=false ise aynı sürüm zaten yüklüydü)
          content:
            application/json:
              schema:
                type: object
                required: [country, version, changed]
                properties:
                  country: { type: string }
                  version: { type: integer }
                  changed: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  # ---- T-060 (C-01) web abonelik ----
  /plans:
    get:
      summary: Paketler (adım 1). T-060
      description: >-
        Tutarlar yer tutucudur (`placeholder: true`, ürün/finans onayı bekliyor); fiyatın kendisi sağlayıcı panosunda.
      operationId: listPlans
      security: []
      parameters: [{ name: country, in: query, schema: { enum: [TR, US], default: TR } }]
      responses:
        '200':
          description: Paketler
          content:
            application/json:
              schema:
                type: object
                required: [country, trialDays, kvkkNoticeVersion, plans]
                properties:
                  country: { enum: [TR, US] }
                  trialDays: { type: integer, example: 30 }
                  kvkkNoticeVersion: { type: string, description: Kayıtta geri gönderilecek aydınlatma metni sürümü }
                  plans:
                    type: array
                    items:
                      type: object
                      required: [code, interval, nameCode, currency, amountMinor, placeholder]
                      properties:
                        code: { type: string, example: STANDARD }
                        interval: { enum: [month, year] }
                        nameCode: { type: string, description: Mesaj kataloğu kodu }
                        currency: { type: string, example: TRY }
                        amountMinor: { type: integer, description: Kuruş / sent }
                        placeholder: { type: boolean }
  /signup:
    post:
      summary: Hesap aç (adım 2) — Keycloak consumers hesabı + korunan kişi + TRIAL abonelik. T-060
      description: |
        Parola bu uçtan geçmez: Keycloak hesabı VERIFY_EMAIL + UPDATE_PASSWORD gerekli eylemleriyle açılır ve kullanıcıya
        e-posta bağlantısı gider. Telefona 6 haneli kod SMS'lenir (10 dk). Deneme 30 gün veya ilk gerçek alarma (SOS, FALL, INACTIVITY; test ve sistem olayları sayılmaz) kadar; ödeme bekleme ve askı geçişleri kişinin süren olayı varken ertelenir.
        KVKK aydınlatma sürümü güncel olmalı ve açık rıza `true` olmalı (metinler hukuk onayı bekliyor).
        IP başına saatte 10 kayıt. Aynı e-posta 409 (yarım kişi kalmaz).
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, country, account, protectedPerson, consents]
              properties:
                plan: { type: string, example: STANDARD }
                country: { enum: [TR, US] }
                account:
                  type: object
                  required: [firstName, lastName, email, phone]
                  properties:
                    firstName: { type: string, maxLength: 60 }
                    lastName: { type: string, maxLength: 60 }
                    email: { type: string, format: email }
                    phone: { type: string, pattern: '^\+[1-9]\d{6,14}$' }
                protectedPerson:
                  type: object
                  required: [displayName]
                  properties: { displayName: { type: string, maxLength: 100 } }
                consents:
                  type: object
                  required: [kvkkNoticeVersion, explicitConsent]
                  properties:
                    kvkkNoticeVersion: { type: string }
                    explicitConsent: { const: true }
      responses:
        '201':
          description: Hesap açıldı
          content:
            application/json:
              schema:
                type: object
                required:
                  [subscriptionId, protectedPersonId, signupToken, signupTokenExpiresAt, trialEndsAt, phoneVerification]
                properties:
                  subscriptionId: { type: string, format: uuid }
                  protectedPersonId: { type: string, format: uuid }
                  signupToken: { type: string, description: 'Sonraki kayıt adımlarında `x-signup-token` (2 saat)' }
                  signupTokenExpiresAt: { type: string, format: date-time }
                  trialEndsAt: { type: string, format: date-time }
                  phoneVerification: { enum: [SENT, UNAVAILABLE] }
                  devCode: { type: string, description: 'Yalnız geliştirmede, sahte SMS sağlayıcısıyla' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /signup/{id}/phone/code:
    post:
      summary: Telefon doğrulama kodunu yeniden gönder (saatte 5). T-060
      operationId: resendSignupCode
      security: [{ signupToken: [] }]
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      responses:
        '200': { description: Gönderildi }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /signup/{id}/phone/verify:
    post:
      summary: Telefonu doğrula → Keycloak `phone_number_verified=true`. T-060
      description: 5 hatalı denemede kod geçersizleşir (yeni kod istenir).
      operationId: verifySignupPhone
      security: [{ signupToken: [] }]
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^\d{6}$' } } }
      responses:
        '200': { description: Doğrulandı }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /signup/{id}/checkout:
    post:
      summary: 'Ödeme sayfası (adım 2) — iyzico Checkout Form (TR, gömülü) / Stripe Checkout (US, yönlendirme). T-060'
      description: Telefon doğrulanmış olmalı (409). Kart bilgisi bize gelmez. iyzico için fatura adresi zorunlu.
      operationId: createSignupCheckout
      security: [{ signupToken: [] }]
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      requestBody: { $ref: '#/components/requestBodies/CheckoutInput' }
      responses:
        '200': { $ref: '#/components/responses/CheckoutSession' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /signup/{id}/subscription:
    get:
      summary: Kayıt akışındaki aboneliğin durumu (adım 3). T-060
      operationId: getSignupSubscription
      security: [{ signupToken: [] }]
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      responses:
        '200': { $ref: '#/components/responses/Subscription' }
        '403': { $ref: '#/components/responses/Problem' }
  /webhooks/payments:
    post:
      summary: Ödeme sağlayıcısı webhook'u (imza doğrulamalı, idempotent). T-060
      description: |
        Sağlayıcı başlıktan bulunur: Stripe `Stripe-Signature` (HMAC-SHA256, 5 dk tolerans; checkout.session.completed,
        invoice.paid, invoice.payment_failed, customer.subscription.deleted), iyzico `X-IYZ-SIGNATURE-V3`
        (subscription.order.success / failure), geliştirme `X-Fake-Signature`. İmza ham gövde üzerinden; geçersizse 400.
        (sağlayıcı, olay kimliği) bir kez işlenir; tekrar 200 `duplicate: true`. Sıra dışı eski olay durumu değiştirmez;
        CANCELED son durumdur. PAST_DUE girişinde aileye F-SUB-PAY (outbox, aynı transaction).
      operationId: paymentWebhook
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200':
          description: Alındı
          content:
            application/json:
              schema:
                type: object
                required: [received, duplicate, outcome]
                properties:
                  received: { const: true }
                  duplicate: { type: boolean }
                  outcome: { enum: [applied, stale, terminal, ignored, unmatched, duplicate] }
        '400': { $ref: '#/components/responses/Problem' }
  /payments/iyzico/callback:
    post:
      summary: iyzico Checkout Form tarayıcı dönüşü → sonuç iyzico'dan okunur → web adım 3'e 303. T-060
      operationId: iyzicoCallback
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '303': { description: Web'e yönlendirme }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /payments/fake/{ref}/pay:
    post:
      summary: Sahte ödeme sayfasının düğmesi (yalnız PAYMENT_PROVIDER=fake; üretimde yok). T-060
      operationId: fakePay
      security: []
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { outcome: { enum: [success, fail] } } }
      responses:
        '200': { description: 'İmzalı webhook gerçek yoldan işlendi; `redirect` web adresi' }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/subscription:
    get:
      summary: Abonelik durumu (aile üyesi / yönetici). T-060
      operationId: getSubscription
      security: [{ userToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '200': { $ref: '#/components/responses/Subscription' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/subscription/cancel:
    post:
      summary: Tek tık iptal (yalnız OWNER) → CANCELED, koruma kapanır (cihaz config). T-060
      description: Sağlayıcıdaki abonelik önce sonlandırılır; ulaşılamazsa 502 ve yerel durum değişmez (ücret sürmesin).
      operationId: cancelSubscription
      security: [{ userToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '200': { $ref: '#/components/responses/Subscription' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/subscription/checkout:
    post:
      summary: Sonradan ödeme (deneme bitti / ödeme bekliyor) — yalnız OWNER. T-060
      operationId: createSubscriptionCheckout
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      requestBody: { $ref: '#/components/requestBodies/CheckoutInput' }
      responses:
        '200': { $ref: '#/components/responses/CheckoutSession' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    deviceToken: { type: http, scheme: bearer }
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Keycloak `operations` realm erişim token'ı (T-020): aud `yanimda-api`, amr içinde `otp`, realm rolü OPERATOR /
        SUPERVISOR / ADMIN. Operatör kimliği `sub`. Token yok/geçersiz 401, rol yetmiyor 403.
    adminToken:
      type: apiKey
      in: header
      name: x-admin-token
      description: Betikler/CI için paylaşılan yönetici anahtarı (ADMIN_TOKEN). Bearer gelirse yalnız OIDC denenir.
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak `consumers` realm erişim token'ı (ELDER, FAMILY).
    signupToken:
      type: apiKey
      in: header
      name: x-signup-token
      description: T-060 kayıt akışı token'ı (POST /signup yanıtı; tek aboneliğe bağlı, 2 saat).
  requestBodies:
    CheckoutInput:
      content:
        application/json:
          schema:
            type: object
            properties:
              billing:
                type: object
                description: Fatura adresi (iyzico zorunlu). Saklanmaz, yalnız sağlayıcıya iletilir.
                required: [city, address]
                properties:
                  city: { type: string, maxLength: 60 }
                  address: { type: string, maxLength: 200 }
  parameters:
    EventId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    StepN: { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
    PersonId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    SubscriptionId:
      name: id
      in: path
      required: true
      description: Kayıt yanıtındaki subscriptionId
      schema: { type: string, format: uuid }
    CallId: { name: callId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Subscription:
      description: Abonelik
      content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } }
    CheckoutSession:
      description: Barındırılan ödeme sayfası
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [kind, url, checkoutRef]
                properties: { kind: { const: redirect }, url: { type: string }, checkoutRef: { type: string } }
              - type: object
                description: iyzico checkoutFormContent (script) — sayfaya eklenir
                required: [kind, html, checkoutRef]
                properties: { kind: { const: embed }, html: { type: string }, checkoutRef: { type: string } }
    CallView:
      description: Arama (numarasız)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CallView' }
    EventWithChain:
      description: Olay ve zinciri
      content:
        application/json:
          schema:
            type: object
            required: [event, chain]
            properties:
              event: { type: object, description: 'Olay kaydı: durum, geçişler, lockUntil' }
              chain: { oneOf: [{ $ref: '#/components/schemas/ChainView' }, { type: 'null' }] }
              calls: { type: array, items: { $ref: '#/components/schemas/CallView' } }
    DeviceToken:
      description: Cihaz token'ı (HS256 JWT, 1 yıl)
      content:
        application/json:
          schema:
            type: object
            required: [deviceId, protectedPersonId, token, expiresAt, refreshAfter]
            properties:
              deviceId: { type: string, format: uuid }
              protectedPersonId: { type: string, format: uuid }
              token: { type: string }
              expiresAt: { type: string, format: date-time }
              refreshAfter: { type: string, format: date-time }
    Problem:
      description: RFC 7807
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Subscription:
      type: object
      required:
        [
          id,
          protectedPersonId,
          plan,
          countryCode,
          status,
          effectiveStatus,
          protectionActive,
          provider,
          paymentMethodOnFile,
        ]
      properties:
        id: { type: string, format: uuid }
        protectedPersonId: { type: string, format: uuid }
        plan: { type: string }
        countryCode: { enum: [TR, US] }
        status: { enum: [TRIAL, ACTIVE, PAST_DUE, CANCELED] }
        effectiveStatus:
          description: TRIAL (deneme) · ACTIVE · PAYMENT_PENDING (ödeme bekliyor, 7 gün koruma) · SUSPENDED (askıda, koruma kapalı) · CANCELED
          enum: [TRIAL, ACTIVE, PAYMENT_PENDING, SUSPENDED, CANCELED, null]
        protectionActive: { type: boolean }
        until: { type: [string, 'null'], format: date-time, description: Deneme sonu / bekleme sonu / yenileme }
        trialEndsAt: { type: [string, 'null'], format: date-time }
        canceledAt: { type: [string, 'null'], format: date-time }
        provider: { enum: [IYZICO, STRIPE, FAKE, null] }
        paymentMethodOnFile: { type: boolean }
    FamilyEventSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        protectedPersonId: { type: string, format: uuid }
        type: { type: string }
        priority: { type: integer }
        isTest: { type: boolean }
        state: { type: string }
        stage:
          enum: [DETECTED, ASKING, CANCELLED, QUEUED, OPERATOR, CALLING, SAFE, EMERGENCY, DISPATCH, FOLLOW_UP, CLOSED]
        createdAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        outcome: { type: [string, 'null'] }
    FamilyEvent:
      allOf:
        - { $ref: '#/components/schemas/FamilyEventSummary' }
        - type: object
          properties:
            devicePromptUntil: { type: [string, 'null'], format: date-time }
            steps:
              type: array
              items:
                type: object
                properties:
                  n: { type: integer }
                  kind: { enum: [CALL_WATCH, CALL_PHONE, CALL_CONTACT, CALL_NEIGHBOR, CALL_112] }
                  contactIndex: { type: [integer, 'null'] }
                  status: { enum: [PENDING, CALLING, DONE] }
                  result: { type: [string, 'null'] }
                  assessment: { type: [string, 'null'] }
                  at: { type: [string, 'null'], format: date-time }
            operatorNote: { type: [string, 'null'] }
            feedback: { type: [object, 'null'], properties: { real: { type: boolean } } }
            canFeedback: { type: boolean }
    OperatorCard:
      type: object
      properties:
        subject: { type: string }
        name: { type: [string, 'null'] }
        status: { enum: [AVAILABLE, BREAK, OFFLINE] }
        online: { type: boolean, description: Son 90 sn içinde WS'de görüldü }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        open:
          type: array
          items:
            type: object
            properties:
              eventId: { type: string, format: uuid }
              type: { type: string }
              priority: { type: integer }
              state: { type: string }
              since: { type: string, format: date-time }
        claims24h: { type: integer }
        avgClaimSec: { type: [number, 'null'] }
        closed24h: { type: integer }
    SlaBreach:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        type: { type: string }
        priority: { type: integer }
        kind:
          {
            enum: [CLAIM, FIRST_CALL],
            description: 'CLAIM: kuyruktan üstlenmeye > 10 sn; FIRST_CALL: üstlenmeden ilk aramaya > 20 sn',
          }
        live: { type: boolean, description: Hâlâ sürüyor }
        waitedSec: { type: integer }
        at: { type: string, format: date-time }
        operatorId: { type: [string, 'null'] }
    OverflowFlag:
      type: object
      properties:
        enabled: { type: boolean }
        changedAt: { type: [string, 'null'], format: date-time }
        changedBy: { type: [string, 'null'] }
    TestStatus:
      type: object
      required: [eventId, state, completed]
      properties:
        eventId: { type: string, format: uuid }
        state: { type: string }
        completed: { type: boolean }
        outcome: { type: [string, 'null'] }
        operatorNote: { type: [string, 'null'], description: Kapanışta operatörün notu }
        createdAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
    SetupStateInput:
      type: object
      required: [step, completed]
      properties:
        step: { type: string, pattern: '^[A-Z_]+$', example: BATTERY }
        completed: { type: boolean }
        missing:
          type: array
          items: { enum: [NOTIFICATIONS, CALLS, LOCATION, LOCATION_BACKGROUND, MOTION, BATTERY, WATCH, HEALTH] }
        watchPaired: { type: [boolean, 'null'] }
    DailySummary:
      type: object
      required: [day, wristMinutes, partial]
      properties:
        day: { type: string, format: date, description: Kişinin yerel günü }
        steps: { type: [integer, 'null'] }
        hrMin: { type: [integer, 'null'] }
        hrAvg: { type: [integer, 'null'] }
        hrMax: { type: [integer, 'null'] }
        wristMinutes: { type: integer }
        restStart: { type: [string, 'null'], format: date-time, description: Dinlenme (uyku) tahmini başlangıcı }
        restEnd: { type: [string, 'null'], format: date-time }
        partial: { type: boolean, description: Bugün (henüz bitmedi) }
    PersonInput:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        birthYear: { type: [integer, 'null'], minimum: 1900 }
        language: { enum: [tr] }
        timezone: { type: string, description: IANA saat dilimi }
        address:
          type: [object, 'null']
          required: [line, city]
          properties:
            line: { type: string, maxLength: 200 }
            district: { type: string, maxLength: 60 }
            city: { type: string, maxLength: 60 }
            postalCode: { type: string, maxLength: 10 }
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        doorAccessNote: { type: [string, 'null'], maxLength: 500, description: Şifreli saklanır }
        dailySummary: { type: boolean, description: Akşam F-DAILY bildirimi (C-07; varsayılan açık) }
        locationSharing:
          { type: boolean, description: 'Aile uygulaması son konumu görür (T-061, C-09; varsayılan açık)' }
    PersonView:
      type: object
      required: [id, displayName, language, timezone, status, medical, myRole, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        birthYear: { type: [integer, 'null'] }
        language: { type: string }
        timezone: { type: string }
        status:
          {
            enum: [TRIAL, ACTIVE, PAST_DUE, CANCELED],
            description: Aboneliği yansıtır; abonelik dışı (kurum) kişi ACTIVE,
          }
        learningModeUntil:
          type: [string, 'null']
          format: date-time
          description: D-06 öğrenme modu bitişi (oluşturma + 30 gün). T-070
        address:
          type: [object, 'null']
          properties:
            line: { type: string }
            district: { type: [string, 'null'] }
            city: { type: string }
            postalCode: { type: [string, 'null'] }
            lat: { type: [number, 'null'] }
            lng: { type: [number, 'null'] }
        doorAccessNote: { type: [string, 'null'] }
        myRole: { enum: [OWNER, MEMBER, null] }
        dailySummary: { type: boolean }
        locationSharing: { type: boolean }
        medical:
          type: object
          description: Yalnız var/yok ve rıza zamanı; içerik geri okunmaz.
          properties:
            present: { type: boolean }
            consentAt: { type: [string, 'null'], format: date-time }
            updatedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    LearningSummary:
      type: object
      required: [protectedPersonId, learningMode, sleepWindow, inactivity, learnedAt, learnedDays, reportSentAt]
      properties:
        protectedPersonId: { type: string, format: uuid }
        learningMode:
          type: object
          properties:
            active: { type: boolean }
            until: { type: [string, 'null'], format: date-time }
        sleepWindow:
          type: object
          description: Kişinin saat diliminde [start, end)
          properties:
            timezone: { type: string }
            start: { type: string }
            end: { type: string }
            source: { $ref: '#/components/schemas/ThresholdSource' }
        inactivity:
          type: object
          properties:
            minutes: { type: [integer, 'null'], description: Geçerli eşik (dk) }
            source: { $ref: '#/components/schemas/ThresholdSource' }
            default: { type: [integer, 'null'] }
            min: { type: [integer, 'null'] }
            max: { type: [integer, 'null'] }
        learnedAt: { type: [string, 'null'], format: date-time }
        learnedDays: { type: [integer, 'null'], description: Son öğrenmede veri olan gün sayısı }
        reportSentAt: { type: [string, 'null'], format: date-time }
        fallPromptSec: { type: [integer, 'null'], description: Aile ayarı (sn); null → fallPromptDefault }
        fallPromptDefault: { type: [integer, 'null'] }
    ThresholdSource:
      enum: [DEFAULT, LEARNED, FAMILY]
    FalseAlarmStats:
      type: object
      required: [windowDays, closedEvents, falseAlarms, ratio, byCause, repeatPersons]
      properties:
        windowDays: { type: integer }
        closedEvents: { type: integer, description: Pencerede kapanan olay (test hariç) }
        falseAlarms: { type: integer }
        ratio: { type: number, minimum: 0, maximum: 1 }
        byCause:
          type: object
          properties:
            USER_CANCEL: { type: integer }
            OPERATOR: { type: integer }
            FAMILY_FEEDBACK: { type: integer }
        repeatPersons: { type: integer, description: Pencerede eşik görüşmesi sınırına (3) ulaşan kişi sayısı }
    Medical:
      type: object
      properties:
        conditions: { type: array, maxItems: 20, items: { type: string, maxLength: 200 } }
        medications: { type: array, maxItems: 20, items: { type: string, maxLength: 200 } }
        allergies: { type: array, maxItems: 20, items: { type: string, maxLength: 200 } }
        bloodType: { enum: ['0+', '0-', 'A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', null] }
        notes: { type: [string, 'null'], maxLength: 1000 }
    PersonCard:
      type: object
      required: [displayName, age, address, location, doorAccessNote, medical]
      properties:
        displayName: { type: string }
        age: { type: [integer, 'null'] }
        address: { type: [string, 'null'] }
        location:
          type: [object, 'null']
          properties: { lat: { type: number }, lng: { type: number } }
        doorAccessNote: { type: [string, 'null'] }
        medical: { oneOf: [{ $ref: '#/components/schemas/Medical' }, { type: 'null' }] }
    ContactView:
      type: object
      required: [id, role, priority, displayName, phoneLast2]
      properties:
        id: { type: string, format: uuid }
        role: { enum: [ELDER, WATCH, CONTACT, NEIGHBOR] }
        priority: { type: integer }
        displayName: { type: [string, 'null'] }
        phoneLast2: { type: string, pattern: '^\d{2}$' }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Signal:
      $ref: './schemas/signal.schema.json'
    CallView:
      type: object
      description: T-050 CPaaS araması (numara içermez)
      properties:
        id: { type: string, format: uuid }
        stepN: { type: integer }
        status: { enum: [queued, ringing, in-progress, completed, busy, no-answer, failed, canceled] }
        answered: { type: boolean }
        suggestedResult: { oneOf: [{ enum: [REACHED, NO_ANSWER, BUSY, WRONG_NUMBER] }, { type: 'null' }] }
        durationSec: { type: [integer, 'null'] }
        recorded: { type: boolean }
        conference: { type: boolean, description: Görüşme konferansa taşındı (T-051) }
        held: { type: boolean, description: Aranan beklemede (T-051) }
        parties: { type: integer, description: Konferansa eklenen yakın sayısı (T-051) }
        error: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ChainView:
      type: object
      required: [procedureVersion, steps, current]
      properties:
        procedureVersion: { type: integer }
        current: { type: [integer, 'null'], description: Sıradaki adım; hepsi bittiyse null }
        steps: { type: array, items: { $ref: '#/components/schemas/ChainStep' } }
    ChainStep:
      type: object
      required: [n, kind, target, label, timeoutSec, required]
      properties:
        n: { type: integer }
        kind:
          { type: string, description: 'CALL_WATCH, CALL_PHONE, CALL_CONTACT, CALL_NEIGHBOR, CALL_112, NOTIFY_FAMILY' }
        target: { enum: [WATCH, ELDER_PHONE, CONTACT, NEIGHBOR, EMERGENCY, FAMILY] }
        contactIndex: { type: integer }
        label: { type: string, description: Katalog kodu (O-STEP-*) }
        script: { type: string, description: Katalog kodu (O-SCRIPT-*) }
        timeoutSec: { type: integer }
        required: { type: boolean }
        calledAt: { type: string, format: date-time }
        result: { enum: [REACHED, NO_ANSWER, BUSY, WRONG_NUMBER, SKIPPED] }
        assessment: { enum: [OK, EMERGENCY] }
        note: { type: string }
        reason: { type: string }
        operatorId: { type: string }
        completedAt: { type: string, format: date-time }
        scriptReadAt: { type: string, format: date-time }
    DispatchView:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        protectedPersonId: { type: string }
        status: { enum: [NOTIFIED, ACCEPTED, EN_ROUTE, ON_SCENE, TRANSPORTING, AT_HOSPITAL, COMPLETED, CANCELLED] }
        notifiedAt: { type: string, format: date-time }
        notifiedBy: { type: [string, 'null'] }
        caseRef: { type: [string, 'null'] }
        etaMin: { type: [integer, 'null'] }
        hospital: { type: [string, 'null'] }
        stages: { type: object, additionalProperties: { type: string, format: date-time } }
        arrivalMin: { type: [number, 'null'], description: '112 aranması → ekip olay yerinde (dk)' }
        arrivalLate: { type: boolean }
        open: { type: boolean }
        checks: { type: integer, description: Takip zamanlayıcısının amir uyarısı sayısı }
        timeline:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              at: { type: string, format: date-time }
              actorKind: { type: string }
              actorId: { type: [string, 'null'] }
              source: { enum: [OPERATOR, EMS, FAMILY, SYSTEM] }
              note: { type: [string, 'null'] }
    QueueItem:
      type: object
      required: [eventId, type, priority, state, createdAt, lockedBy, isTest, person]
      properties:
        eventId: { type: string, format: uuid }
        type: { type: string }
        priority: { type: integer }
        state: { type: string }
        createdAt: { type: string, format: date-time }
        escalatedAt: { type: [string, 'null'], format: date-time }
        lockedBy: { type: [string, 'null'], description: Üstlenen operatör (token sub) }
        lockUntil: { type: [string, 'null'], format: date-time }
        isTest: { type: boolean }
        person:
          oneOf:
            - type: 'null'
            - type: object
              properties: { displayName: { type: string }, age: { type: [integer, 'null'] } }
