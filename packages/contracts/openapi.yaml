        '404': { $ref: '#/components/responses/Problem' }
  /supervisor/partners:
    get:
      summary: Ortak gecikmesi (son 1 saat p95 / p99) ve bozulma. T-085 (S2.7, S7.2)
      description: |
        Tarama (PARTNER_SWEEP_MS, 60 sn) ortak başına son `partner.latencyWindowMin` dakikanın gecikmesini hesaplar.
        En az `partner.minSamples` örnekle p99 > `partner.latencyP99Sec` (60 sn) → `degradedSince` dolar, amire
        O-OEM-LATENCY (bozulma başına bir; supervisor.alert, eventId `partner:<kod>`, eventType PARTNER) ve o ortağın
        cihazları kapsamada "zayıf" (neden PARTNER_LATENCY, seviye değişmez). p99 eşiğin altına inince kalkar.
        SUPERVISOR veya ADMIN.
      operationId: supervisorPartners
      security: [{ operatorToken: [] }]
      responses:
        '200':
          description: Kayıtlı ortaklar
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PartnerHealth' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /supervisor/work-orders:
    get:
      summary: Kolye pili iş emirleri (son tarihe göre). T-085 / T-086 (S4.9)
      description: |
        12 ay pilli kolyede (katalog pil ömrü ≥ pendant.longLifeBatteryH) yaşlıya pil bildirimi gitmez; haftalık pil
        raporu %pendant.workOrderPct (20) altında veya tahmini bitime pendant.workOrderDaysBeforeEnd (30) gün kaldıysa
        iş emri açılır (cihaz başına tek açık, son tarih replaceWithinDays = 14 gün) ve aileye F-PENDANT-BATTERY gider.
        Pil replacedPct (80) ve üstüne çıkınca iş emri kendiliğinden kapanır (REPLACED). SUPERVISOR veya ADMIN.
      operationId: listWorkOrders
      security: [{ operatorToken: [] }]
