        `unreachable`: P1/P2 merdivenlerinde (test hariç) adım türü başına deneme / ulaşılan / ulaşılamayan /
        çevrimdışı atlanan, `stalledHere` kimseye ulaşılamayan merdivenin son denenen adımı (7 ve 30 gün).
        `unclaimedP1`: 90 sn üstlenilmeyen P1 (O-P1-UNCLAIMED, 7 gün). `dispatch112`: hareketsizlik / yerinde kontrol
        olaylarında 112 bildirimi (7 gün). Hastanede / seyahatte modundakiler listelerde yok. Kişi yalnız görünen
        adıyla; sağlık verisi yok. SUPERVISOR veya ADMIN.
