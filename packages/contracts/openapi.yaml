      responses:
        '200':
          description: Pano
          content: { application/json: { schema: { $ref: '#/components/schemas/SupervisorCoverageBoard' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/status:
    get:
      summary: Korunan kişinin koruma durumu (uyum; kapsamadan türetilir). D-05, T-014, T-085
      description: |
        T-085'ten beri eski koruma durumu bir sürüm boyunca kapsama seviyesinden türetilir (yeni istemciler
        `GET /protected-persons/{id}/coverage` kullanır): FULL / BASIC → PROTECTED_WATCH, PHONE_ONLY → PROTECTED_PHONE,
        NIGHT → NIGHT, NONE → UNPROTECTED. `watch` en son görülen A sınıfı giyilebilir, `phone` telefon veya telefon
        köprüsü. Bağlantı: ONLINE (< kural paketi coverage.onlineMin.A, 15 dk), NO_CONNECTION (<6 saat), LOST.
        Operasyon rolleri (OPERATOR, SUPERVISOR, ADMIN) her kişiyi; aile (consumers FAMILY, T-061) yalnız kendi kişisini
        görür (başkasınınki 404) ve ek olarak `location` alır (konum paylaşımı açıksa son 24 saatteki son konum).
        Kişiden henüz sinyal gelmediyse 404.
      operationId: getProtectionStatus
      security: [{ operatorToken: [] }, { userToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '200':
          description: Durum
          content:
            application/json:
              schema:
                type: object
                required: [protectedPersonId, state, since, watch, phone, sleepWindow]
                properties:
                  protectedPersonId: { type: string }
                  state: { enum: [PROTECTED_WATCH, PROTECTED_PHONE, NIGHT, UNPROTECTED] }
                  since: { type: string, format: date-time }
                  reason: { type: [string, 'null'] }
                  watch:
                    type: object
                    properties:
                      onWrist: { type: [boolean, 'null'] }
                      lastSeenAt: { type: [string, 'null'], format: date-time }
                      connection: { enum: [ONLINE, NO_CONNECTION, LOST] }
                  phone:
                    type: object
                    properties:
                      lastSeenAt: { type: [string, 'null'], format: date-time }
                      connection: { enum: [ONLINE, NO_CONNECTION, LOST] }
                  sleepWindow:
                    type: object
                    properties:
                      timezone: { type: string }
                      start: { type: string, example: '22:00' }
                      end: { type: string, example: '08:00' }
                  location:
                    description: Yalnız aile yanıtında (C-08 harita); paylaşım kapalı veya konum yoksa null.
                    type: [object, 'null']
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      accuracyM: { type: [number, 'null'] }
                      at: { type: string, format: date-time }
                  openEvent:
                    type: [object, 'null']
                    properties:
                      id: { type: string }
                      type: { type: string }
                      state: { type: string }
                      priority: { type: integer }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/invite:
    post:
      summary: Cihaz davet kodu üret. C-02, T-040 / T-041
      description: |
        6 haneli kod, 15 dk geçerli, tek kullanımlık. Yalnız sha256 özeti saklanır. Aile yalnız kendi kişisine;
        yönetici (OIDC ADMIN veya `x-admin-token`) hepsine. `smsText` katalogdan (S-INVITE); SMS gönderimi T-053.
      operationId: createInvite
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Kod
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt, smsText]
                properties:
                  code: { type: string, pattern: '^\d{6}$' }
                  expiresAt: { type: string, format: date-time }
                  smsText: { type: string, description: Katalog S-INVITE }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/members/invite:
    post:
      summary: Aile üyesi (MEMBER) davet kodu üret (yalnız OWNER veya ADMIN). C-02, C-04, T-040
      description: |
        10 karakter Crockford base32 (`XXXXX-XXXXX`, ~50 bit), 72 saat geçerli, tek kullanımlık. Yalnız sha256 özeti
        saklanır; kod denetim kaydına yazılmaz. Kişi başına en çok 5 açık davet (409 F-MEMBER-INVITE-LIMIT) ve en çok
        10 aile hesabı (409 F-MEMBER-LIMIT). MEMBER 403 (F-MEMBER-OWNER-ONLY); erişimi olmayan 404.
      operationId: createMemberInvite
      security: [{ userToken: [] }, { adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                relation: { type: [string, 'null'], maxLength: 50, description: Kabulde üyeliğe yazılır (örn. Oğlu) }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Kod (bir kez gösterilir)
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt, relation]
                properties:
                  code: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}$' }
                  expiresAt: { type: string, format: date-time }
                  relation: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/members:
    get:
      summary: Aile hesapları (OWNER ve MEMBER görür). C-04, T-040
      description: Sahipler önce, sonra katılma sırası. Başka üyenin e-posta, telefon veya kimliği dönmez; `isMe` işaretli.
      operationId: listMembers
      security: [{ userToken: [] }, { adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Üyeler
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MemberView' } }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/members/{memberId}:
    delete:
      summary: Aile hesabını çıkar (OWNER herkesi, MEMBER yalnız kendini). C-04, T-040
      description: |
        Son hesap sahibi çıkarılamaz (409 F-MEMBER-LAST-OWNER). MEMBER başka hesabı çıkaramaz (403 F-MEMBER-OWNER-ONLY).
        Erişimi olmayan, başka kişinin üyesi veya bilinmeyen kimlik 404. Çıkarılan hesap bildirim almaz.
      operationId: removeMember
      security: [{ userToken: [] }, { adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Çıkarıldı }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /family/members/accept:
    post:
      summary: Aile üyesi davetini kabul et (yalnız aile hesabı, consumers FAMILY). C-02, T-040
      description: |
        Kod büyük/küçük harf, boşluk ve tireye duyarsız (O→0, I/L→1). Başarıda hesap MEMBER olarak eklenir.
        400: F-MEMBER-CODE-INVALID | F-MEMBER-CODE-EXPIRED | F-MEMBER-CODE-USED; 409: F-MEMBER-ALREADY (kod harcanmaz)
        | F-MEMBER-LIMIT; yönetici 403.
      operationId: acceptMemberInvite
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 40 }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Eklendi
          content:
            application/json:
              schema:
                type: object
                required: [protectedPersonId, memberId, role]
                properties:
                  protectedPersonId: { type: string, format: uuid }
                  memberId: { type: string, format: uuid }
                  role: { const: MEMBER }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /family/data-export:
    get:
      summary: Kişisel veriyi dışa aktar (KVKK m.11 erişim hakkı, ASVS 8.3.2). T-081
      description: |
        Aile hesabının (consumers FAMILY) kendi verisi ve üyesi olduğu (OWNER veya MEMBER) korunan kişilerin verisi,
        tek JSON (`Content-Disposition: attachment`). Yeni okuma yetkisi açmaz: kişi bölümleri aynı hesabın mevcut
        aile uçlarından okuyabildiğinin toplamıdır. Tıbbi özet içeriği verilmez (yalnız olay anında operatöre
        çözülür; burada var/yok + rıza zamanı), rehberde numaranın son 2 hanesi, olayda konum / operatör / not yok;
        bilerek verilmeyenler `withheld` kodlarıyla listelenir (docs/security/saklama.md). Her indirme audit.log'a
        `privacy.data_exported` olarak yalnız kimlik ve sayılarla yazılır. Yönetici (OIDC ADMIN, `x-admin-token`) 403.
        Kullanıcı başına saatte 5.
      operationId: exportMyData
      security: [{ userToken: [] }]
      responses:
        '200':
          description: Dışa aktarma dosyası
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="yanimda-data-export.json"' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /protected-persons/{id}/learning:
    get:
      summary: Öğrenme modu ve kişiye özel eşikler (profil raporu özeti). D-06, T-070
      description: |
        Kişi oluşturulunca öğrenme modu kural paketi `learning.days` (30) gün sürer. Günlük iş son `historyDays` (14)
        günün sinyallerinden uyku penceresini ve hareketsizlik eşiğini (p95, 15–90 dk) öğrenir; aile elle ayarladığı
        alana (kaynak FAMILY) dokunmaz. Dönem bitince aileye bir kez F-LEARN-REPORT gider. Başka ailenin kişisi 404.
      operationId: getLearning
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '200':
          {
            description: Özet,
            content: { application/json: { schema: { $ref: '#/components/schemas/LearningSummary' } } },
          }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/thresholds:
    put:
      summary: Aile eşik ayarı (uyku penceresi, hareketsizlik eşiği). D-06, T-070
      description: |
        Verilen alan aile ayarı olur (kaynak FAMILY) ve öğrenme ona dokunmaz. `null` aile ayarını kaldırır
        (varsayılana döner; öğrenme modundaysa sonraki günlük işte yeniden öğrenilir). inactivityMin kural paketinin
        INACTIVITY.thresholdMin min–max aralığında (15–90).
      operationId: setThresholds
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                sleepWindow:
                  type: [object, 'null']
                  required: [start, end]
                  properties:
                    start: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
                    end: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
                inactivityMin: { type: [integer, 'null'], minimum: 15, maximum: 90 }
                fallPromptSec:
                  type: [integer, 'null']
                  minimum: 30
                  maximum: 90
                  description: Düşme sorusu cevap süresi (T-061, C-09); null → kural paketi (60 sn)
      responses:
        '200':
          {
            description: Özet,
            content: { application/json: { schema: { $ref: '#/components/schemas/LearningSummary' } } },
          }
        '400': { $ref: '#/components/responses/Problem', description: 'Geçersiz değer; uyku penceresi en çok 12 saat' }
        '403': { $ref: '#/components/responses/Problem', description: 'Yalnız hesap sahibi (OWNER) değiştirir' }
        '404': { $ref: '#/components/responses/Problem' }
  /protected-persons/{id}/false-alarms:
    get:
      summary: Kişinin son 30 gün yanlış alarm oranı. D-07, T-071
      description: |
        Yanlış alarm = kişi cihazdan iptal etti (USER_CANCEL), operatör FALSE_ALARM ile kapattı (OPERATOR) veya aile
        "gerçek değildi" dedi (FAMILY_FEEDBACK); olay başına bir kez, test olayları hariç. Pencerede 3. yanlış alarmda
        aileye F-EVT-OK + F-FA-REVIEW ve konsolda "eşik görüşmesi" CALLBACK olayı (P4) açılır.
      operationId: getFalseAlarms
      security: [{ userToken: [] }, { operatorToken: [] }, { adminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '200':
          description: Oran
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FalseAlarmStats'
                  - type: object
                    required: [protectedPersonId]
                    properties: { protectedPersonId: { type: string, format: uuid } }
        '404': { $ref: '#/components/responses/Problem' }
  /events/{id}/feedback:
    post:
      summary: Aile geri bildirimi "Gerçek miydi?". C-12, T-071
      description: |
        Yalnız aile (consumers FAMILY) ve yalnız kendi kişisinin kapanmış olayı. Aile üyesi başına olay başına bir cevap
        (son cevap geçerli). `real: false` olayı FAMILY_FEEDBACK nedeniyle yanlış alarm sayar (zaten sayılıyorsa ilk
        neden kalır). Başka ailenin olayı 404, açık olay 409, aile dışı 403.
      operationId: eventFeedback
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [real], properties: { real: { type: boolean } } }
      responses:
        '201':
          description: Kaydedildi
          content:
            application/json:
              schema:
                type: object
                required: [eventId, real, falseAlarm]
                properties:
                  eventId: { type: string, format: uuid }
                  real: { type: boolean }
                  falseAlarm: { type: boolean, description: Olay yanlış alarm sayılıyor mu }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          {
            $ref: '#/components/responses/Problem',
            description: 'Olay kapanmadı veya acil olarak teyit edildi (yanlış alarm sayılamaz)',
          }
  /devices/enroll:
    post:
      summary: Cihaz kaydı (davet kodu → cihaz token'ı). T-041
      description: |
        T-085 (S1.7): kişi başına en çok 6 etkin cihaz, 3 A sınıfı giyilebilir ve 1 yaşlı telefonu; aşılırsa 409,
        `code` F-DEVICE-LIMIT (davet kodu tüketilmez) ve aileye F-DEVICE-LIMIT bildirimi.
        deviceId istemcide üretilir (UUID, küçük harf) ve sinyallerde aynen kullanılır. Yanıt yolda kaybolursa aynı
        cihaz aynı kodla kodun süresi içinde yeniden dener ve 200 ile yeni token alır. Yanlış/süresi dolmuş/başka
        cihazın kullandığı kod 400; kayıtlı deviceId 409; aynı IP'den 15 dk'da 10 hatalı kod 429.
      operationId: enrollDevice
      security: [] # davet kodu kimlik doğrular
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode, deviceId, kind]
              properties:
                inviteCode: { type: string, pattern: '^\d{6}$' }
                deviceId: { type: string, format: uuid }
                kind: { enum: [WEAROS_WATCH, ANDROID_PHONE, IOS_PHONE] }
                model: { type: string, maxLength: 100 }
                osVersion: { type: string, maxLength: 50 }
                appVersion: { type: string, maxLength: 50 }
      responses:
        '201': { $ref: '#/components/responses/DeviceToken' }
        '200': { $ref: '#/components/responses/DeviceToken' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /devices/{id}/token:
    post:
      summary: Cihaz token'ını yenile (geçerli token ile). T-041
      description: Token 1 yıl geçerlidir; istemci `refreshAfter` sonrasında (bitişe 30 gün kala) yeniler.
      operationId: refreshDeviceToken
      security: [{ deviceToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200': { $ref: '#/components/responses/DeviceToken' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /devices/{id}/config:
    get:
      summary: Cihaz yapılandırması (eşikler, uyku penceresi, katalog metinleri). T-041
      operationId: getDeviceConfig
      security: [{ deviceToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Yapılandırma
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    deviceId,
                    protectedPersonId,
                    kind,
                    rulesVersion,
                    sleepWindow,
                    devicePrompt,
                    charging,
                    lastTestAt,
                    messages,
                    subscription,
                  ]
                properties:
                  deviceId: { type: string }
                  protectedPersonId: { type: string }
                  kind: { type: string }
                  rulesVersion: { type: integer }
                  sleepWindow:
                    type: object
                    properties:
                      timezone: { type: string }
                      start: { type: string, example: '22:00' }
                      end: { type: string, example: '08:00' }
                  devicePrompt:
                    type: object
                    properties:
                      fallWindowSec: { type: [integer, 'null'] }
                      inactivityWindowSec: { type: [integer, 'null'] }
                  inactivityThresholdMin: { type: [integer, 'null'] }
                  charging:
                    type: object
                    description: |
                      T-090 (S4.4) "şarj tamam" eşikleri, kural paketi `charging`'den: pil ≥ chargeDonePct ve
                      ≥ chargeDoneMin dk şarjda (veya %100) olunca cihaz W-CHARGE-DONE / P-CHARGE-DONE gösterir.
                    required: [chargeDonePct, chargeDoneMin]
                    properties:
                      chargeDonePct: { type: integer, minimum: 1, maximum: 100 }
                      chargeDoneMin: { type: integer, minimum: 0 }
                  lastTestAt:
                    type: [string, 'null']
                    format: date-time
                    description: T-090 (S4.9) bu cihazın son TEST sinyali (aylık deneme hatırlatması); hiç yoksa null
                  subscription:
                    type: object
                    description: |
                      T-060. protectionActive=false (askıda / iptal) iken cihaz "koruma kapalı" gösterir; metin
                      `messages[messageCode]` (P-SUB-PAY, P-SUB-OFF, W-SUB-OFF). status null = abonelik dışı kişi.
                    required: [status, protectionActive, until, messageCode]
                    properties:
                      status: { enum: [TRIAL, ACTIVE, PAYMENT_PENDING, SUSPENDED, CANCELED, null] }
                      protectionActive: { type: boolean }
                      until: { type: [string, 'null'], format: date-time }
                      messageCode: { type: [string, 'null'] }
                  messages:
                    type: object
                    description: Katalog metinleri (telefon P-*, saat W-*)
                    additionalProperties:
                      type: object
                      required: [text]
                      properties:
                        text: { type: string }
                        action: { type: string }
                  operator:
                    type: object
                    description: T-054 operatörün arayan numaraları (telefon hoparlör + rehber) ve gösterilen adı
                    properties:
                      name: { type: [string, 'null'] }
                      callerIds: { type: array, items: { type: string } }
                  familyContact:
                    type: [object, 'null']
                    description: Telefon ana ekranı aile kısayolu (ilk yakın); saate gönderilmez
                    properties:
                      displayName: { type: [string, 'null'] }
                      phone: { type: string }
        '304': { description: Değişmedi (If-None-Match eşleşti) }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /devices/{id}/push-token:
    put:
      summary: Push token kaydı (APNS yalnız IOS_PHONE). T-041, T-053 kullanır
      description: |
        Sunucunun cihaza gönderdiği data mesajları (FCM `data`, yalnız string; APNs'te aynı alanlar yükte) şema
        `DevicePush`. Wear OS saatin FCM token'ı yoktur: saate giden W-* bildirimi kişinin telefonuna `forDeviceId`
        ile gider, telefon göstermez, Data Layer'dan saate iletir.
      operationId: putPushToken
      security: [{ deviceToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token]
              properties:
                provider: { enum: [APNS, FCM] }
                token: { type: string, maxLength: 4096 }
                sandbox: { type: boolean, description: APNs geliştirme ortamı }
      responses:
        '204': { description: Kaydedildi }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /devices/{id}/companions:
    post:
      summary: Eşlikçi telefon saatini kaydeder (saatte kod yazılmaz). B-03, T-043
      description: |
        Telefon token'ı ile (yol = telefonun kendi kimliği). Saat kendi UUID'sini üretir, Data Layer ile telefona
        iletir; telefon burada aynı kişiye WEAROS_WATCH olarak kaydeder ve saat token'ını Data Layer ile saate verir.
        Aynı kişinin etkin saati yeniden → 200 + yeni token; kaldırılmış saat yeniden etkinleşir (eski token'lar 401);
        başka kişinin cihazı 409; telefon olmayan token 403.
      operationId: enrollCompanion
      security: [{ deviceToken: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
