name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    services:
      redis: # BullMQ zamanlayıcı testleri gerçek Redis ister (T-013)
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Kural paketi doğrulaması (zorunlu)
        run: pnpm --filter @yanimda/rules test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: uçtan uca + kaos (S3/S4/S7, Redis 60 sn, Postgres 10 sn, API kill -9) + PII log denetimi
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y redis-server && sudo systemctl stop redis-server || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yanimda/contracts build
      - name: Uçtan uca ve kaos testleri
        run: pnpm --filter @yanimda/api test:e2e
        env:
          CHAOS_REPORT: ${{ github.workspace }}/test-results/chaos.json
          E2E_LOG_DIR: ${{ github.workspace }}/test-results/logs
      - name: PII log denetimi (T-081; uçtan uca + kaos API log'ları)
        run: pnpm --filter @yanimda/api exec tsx test/e2e/pii-audit-cli.ts ../../test-results/logs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: e2e-chaos, path: test-results/, if-no-files-found: ignore }

  console-e2e:
    name: konsol uçtan uca (Keycloak + API + Playwright; T-023, T-026)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y redis-server && sudo systemctl stop redis-server || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yanimda/contracts build
      - name: Keycloak (operations + consumers realm içe aktarımı)
        run: |
          docker run -d --name kc -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/infra/keycloak:/opt/keycloak/data/import:ro" quay.io/keycloak/keycloak:26.0 start-dev --import-realm
          for i in $(seq 1 90); do curl -sf http://localhost:8080/realms/operations/.well-known/openid-configuration >/dev/null && break; sleep 2; done
      - name: Test operatörü ve sırlar (iş başına rastgele)
        run: |
          P=$(openssl rand -hex 12); S=$(openssl rand -hex 10)
          echo "::add-mask::$P"; echo "::add-mask::$S"
          echo "KEYCLOAK_DEV_PASSWORD=$P" >> "$GITHUB_ENV"; echo "KEYCLOAK_DEV_OTP_SECRET=$S" >> "$GITHUB_ENV"
          A=$(openssl rand -hex 16); M=$(openssl rand -hex 16)
          echo "::add-mask::$A"; echo "::add-mask::$M"
          echo "ADMIN_TOKEN=$A" >> "$GITHUB_ENV"; echo "S3_SECRET_KEY=$M" >> "$GITHUB_ENV"
      - name: MinIO (görüşme kayıtları, nesne kilidi; T-050)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=yanimda -e "MINIO_ROOT_PASSWORD=$S3_SECRET_KEY" bitnamilegacy/minio:2024.10.13
          for i in $(seq 1 60); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
      - run: node infra/keycloak/dev-users.mjs
        env: { KEYCLOAK_URL: http://localhost:8080 }
      - name: API yığını (Redis + Postgres + API; kural süreleri 0,1 ölçek)
        run: |
          nohup pnpm --filter @yanimda/api stack:local > test-results-stack.log 2>&1 &
          for i in $(seq 1 90); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/v1/queue)" = 401 ] && break; sleep 2; done
        env:
          KEYCLOAK_URL: http://localhost:8080
          STACK_API_PORT: '3000'
          STACK_TIME_SCALE: '0.1'
          CPAAS_PROVIDER: fake
          CPAAS_AGENT_NUMBER: '+902120000000'
          CPAAS_WEBHOOK_BASE: http://127.0.0.1:3000
          FAKE_CPAAS_STEP_MS: '300'
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: recordings
          S3_ACCESS_KEY: yanimda
          S3_ENSURE_BUCKET: 'true'
          RECORDING_RETENTION_DAYS: '1'
      - run: pnpm --filter @yanimda/console exec playwright install --with-deps chromium
      - name: Playwright (giriş + OTP, S3–S6, eğitim modu, axe)
        run: pnpm --filter @yanimda/console test:e2e
        env:
          VITE_OIDC_AUTHORITY: http://localhost:8080/realms/operations
          CONSOLE_API_PROXY: http://127.0.0.1:3000
      - name: PII log denetimi (T-081; konsol akışları boyunca API log'u)
        run: pnpm --filter @yanimda/api exec tsx test/e2e/pii-audit-cli.ts ../../test-results-stack.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-e2e
          path: |
            test-results/console/
            apps/console/test-results/
            test-results-stack.log
          if-no-files-found: ignore

  sast:
    name: SAST (Semgrep) · sır taraması (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # gitleaks tüm geçmişi tarar
      - name: Semgrep (proje kuralları + TypeScript/Node/React/JWT/sır kural setleri; ERROR'da fail)
        # Sabit sürümlü resmi imaj. Proje kuralları: .semgrep/yanimda.yml (log'da PII, gövde log'u, Math.random, sır varsayılanı)
        run: |
          docker run --rm -v "$PWD":/src -w /src semgrep/semgrep:1.95.0 semgrep scan --metrics=off --error \
            --config .semgrep --config p/typescript --config p/nodejs --config p/react --config p/jwt --config p/secrets \
            --exclude node_modules --exclude dist --sarif --output semgrep.sarif
      - name: gitleaks (git geçmişi; bilinen sahte test sırları .gitleaksignore'da)
        run: docker run --rm -v "$PWD":/repo -w /repo zricethezav/gitleaks:v8.21.2 git --no-banner --redact -v .
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: semgrep-sarif, path: semgrep.sarif, if-no-files-found: ignore }

  infra:
    name: altyapı (terraform, helm + kubeconform, prometheus, compose, shellcheck; T-083)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Terraform fmt + validate
        run: |
          docker run --rm -v "$PWD":/w -w /w/infra/terraform hashicorp/terraform:1.9.8 fmt -check -recursive
          docker run --rm -v "$PWD":/w -w /w/infra/terraform/envs/staging -e TF_DATA_DIR=/tmp/tf --entrypoint sh \
            hashicorp/terraform:1.9.8 -c 'terraform init -backend=false -input=false -lockfile=readonly && terraform validate'
      - name: Helm lint + template + kubeconform
        run: |
          H="docker run --rm -v $PWD/infra:/infra -w /infra/helm alpine/helm:3.16.2"
          $H lint yanimda --strict
          $H lint yanimda --strict -f yanimda/values-staging.yaml
          for v in values.yaml values-staging.yaml; do
            $H template yanimda yanimda -f yanimda/$v \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0 -
          done
      - name: Prometheus / Alertmanager / Loki / Promtail / Blackbox / Caddy
        run: |
          M="$PWD/infra/monitoring"
          docker run --rm -v "$M":/m:ro -v "$M/alerts.yml":/etc/prometheus/alerts.yml:ro --entrypoint promtool prom/prometheus:v2.55.1 check config /m/prometheus.yml
          docker run --rm -v "$M":/m:ro --entrypoint promtool prom/prometheus:v2.55.1 check rules /m/alerts.yml
          docker run --rm -v "$M":/m:ro --entrypoint amtool prom/alertmanager:v0.27.0 check-config /m/alertmanager.yml
          docker run --rm -v "$M":/m:ro grafana/loki:3.2.1 -config.file=/m/loki-config.yml -verify-config
          docker run --rm -v "$M":/m:ro grafana/promtail:3.2.1 -config.file=/m/promtail-config.yml -check-syntax
          docker run --rm -v "$M":/m:ro prom/blackbox-exporter:v0.25.0 --config.file=/m/blackbox.yml --config.check
          docker run --rm -e DOMAIN=ci.example.test -e ACME_EMAIL=ci@example.test -v "$PWD/infra/caddy/Caddyfile":/etc/caddy/Caddyfile:ro caddy:2.8.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -v "$PWD/infra/console/Caddyfile":/etc/caddy/Caddyfile:ro caddy:2.8.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Compose config (örnek ortam dosyasıyla; sır yok)
        run: |
          cp infra/.env.prod.example infra/.env.prod
          docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml config -q
          docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml --profile family-web config -q
          docker compose --env-file infra/.env.prod -f infra/monitoring/docker-compose.monitoring.yml config -q
          rm infra/.env.prod
      - name: Shellcheck, sentetik sonda, Dockerfile denetimleri
        run: |
          docker run --rm -v "$PWD/infra":/mnt:ro koalaman/shellcheck:v0.10.0 backup/pg-backup.sh backup/restore-drill.sh backup/schedule.sh
          docker run --rm -v "$PWD/scripts":/mnt:ro koalaman/shellcheck:v0.10.0 load-v1.sh security/spki-pin.sh
          docker run --rm -v "$PWD/infra/synthetic":/p:ro \
            -e SYNTHETIC_API_URL=https://api.example.test -e SYNTHETIC_OIDC_ISSUER=https://auth.example.test/realms/consumers \
            -e SYNTHETIC_CLIENT_ID=ci -e SYNTHETIC_CLIENT_SECRET=ci \
            -e SYNTHETIC_PERSON_IDS=00000000-0000-7000-8000-000000000001,00000000-0000-7000-8000-000000000002,00000000-0000-7000-8000-000000000003 \
            node:26-alpine sh -c 'node --check /p/probe.mjs && node /p/probe.mjs --dry'
          docker build --check -f infra/console/Dockerfile .
          docker build --check infra/backup

  image:
    name: API imajı · gerçek TimescaleDB duman · Trivy
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env: { POSTGRES_USER: yanimda, POSTGRES_PASSWORD: yanimda, POSTGRES_DB: yanimda }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yanimda" --health-interval 2s --health-timeout 2s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      IMAGE: yanimda-api:ci
      MAX_IMAGE_MB: 250
      API: http://localhost:3000/v1
    steps:
      - uses: actions/checkout@v4
      - name: İmajı kur
        run: docker build -f apps/api/Dockerfile -t "$IMAGE" .
      - name: İmaj boyutu < 250 MB
        run: |
          bytes=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          mb=$((bytes / 1024 / 1024))
          echo "İmaj boyutu: ${mb} MB"
          [ "$mb" -lt "$MAX_IMAGE_MB" ] || { echo "::error::İmaj ${mb} MB, sınır ${MAX_IMAGE_MB} MB"; exit 1; }
      - name: TimescaleDB uzantıları (infra/init.sql, docker-compose ile aynı)
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U yanimda -d yanimda < infra/init.sql
      - name: İmaj açılıyor (migration'lar gerçek TimescaleDB'ye)
        run: |
          # T-041: cihaz token imza anahtarı (≥ 32 karakter); her koşuya özel, kaydedilmez
          echo "::add-mask::$(openssl rand -hex 32 | tee /tmp/device-secret)"
          # T-040: alan şifreleme anahtarı (AES-256, üretimde zorunlu); her koşuya özel
          echo "::add-mask::$(openssl rand -base64 32 | tee /tmp/field-key)"
          # T-060: web kaydı doğrulama token'ı imza anahtarı (≥ 32 karakter, üretimde zorunlu); her koşuya özel
          echo "::add-mask::$(openssl rand -hex 32 | tee /tmp/signup-secret)"
          docker run -d --name api --network host \
            -e DATABASE_URL=postgres://yanimda:yanimda@localhost:5432/yanimda \
            -e REDIS_URL=redis://localhost:6379 -e PORT=3000 \
            -e FIELD_ENC_KEYS="ci:$(cat /tmp/field-key)" \
            -e SIGNUP_TOKEN_SECRET="$(cat /tmp/signup-secret)" \
            -e DEVICE_TOKEN_SECRET="$(cat /tmp/device-secret)" "$IMAGE"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/signals" -H 'content-type: application/json' -d '[]') || true
            # token'sız boş parti: cihaz koruması (T-041) gövdeden önce çalışır → 401; ikisi de "API ayakta" demek
            { [ "$code" = "400" ] || [ "$code" = "401" ]; } && echo "API ayakta ($code)" && exit 0
            sleep 1
          done
          docker logs api; exit 1
      - name: Uçtan uca (gerçek TimescaleDB + Redis, üretim imajı)
        run: |
          psql() { docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U yanimda -d yanimda -tA "$@"; }
          # signal.signal hypertable oldu mu
          [ "$(psql -c "SELECT count(*) FROM timescaledb_information.hypertables WHERE hypertable_schema='signal' AND hypertable_name='signal'")" = "1" ] \
            || { echo "::error::signal.signal hypertable değil"; exit 1; }
          # üretimde token'sız (kayıtsız) cihaz reddedilir (T-041: simülatör kapalı → 401)
          now=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          person=00000000-0000-0000-0000-000000000001
          dev=00000000-0000-0000-0000-0000000c1d01
          sig() { echo "[{\"schemaVersion\":1,\"idempotencyKey\":\"ci-$1-$(date +%s%N)\",\"deviceId\":\"$2\",\"protectedPersonId\":\"$person\",\"kind\":\"$1\",\"occurredAt\":\"$now\"}]"; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/signals" -H 'content-type: application/json' -d "$(sig SOS $dev)")
          [ "$code" = "401" ] || { echo "::error::token'sız cihaz $code döndü (401 beklenir)"; exit 1; }
          # demo kişi + 15 dk geçerli davet kodu → cihaz kaydı → cihaz token'ı (T-041)
          psql -c "INSERT INTO profile.protected_person (id, display_name) VALUES ('$person', 'CI') ON CONFLICT DO NOTHING"
          psql -c "INSERT INTO profile.invite (id, protected_person_id, code_hash, expires_at)
                   VALUES (gen_random_uuid(), '$person', encode(sha256(convert_to('yanimda-invite:428157', 'UTF8')), 'hex'), now() + interval '15 minutes')"
          token=$(curl -sf -X POST "$API/devices/enroll" -H 'content-type: application/json' \
            -d "{\"inviteCode\":\"428157\",\"deviceId\":\"$dev\",\"kind\":\"WEAROS_WATCH\"}" | jq -r .token)
          [ -n "$token" ] && [ "$token" != "null" ] || { echo "::error::cihaz kaydı token vermedi"; docker logs api; exit 1; }
          echo "::add-mask::$token"
          # kayıtlı cihazdan token'lı SOS → hypertable'a yazılır → outbox → olay → operatör kuyruğu
          curl -sf -X POST "$API/signals" -H 'content-type: application/json' -H "authorization: Bearer $token" -d "$(sig SOS $dev)"; echo
          [ "$(psql -c "SELECT count(*) FROM signal.signal WHERE kind='SOS'")" = "1" ] || { echo "::error::sinyal yazılmadı"; exit 1; }
          for i in $(seq 1 20); do
            # GET /v1/queue OIDC operatör rolü ister (T-020); burada Keycloak yok → durum veritabanından
            [ "$(psql -c "SELECT count(*) FROM event.event WHERE type='SOS' AND state='OPERATOR_QUEUE'")" = "1" ] \
              && echo "SOS operatör kuyruğunda" && exit 0
            sleep 0.5
          done
          echo "::error::SOS kuyruğa düşmedi"; docker logs api; exit 1
      - name: Trivy (yüksek/kritik açıkta fail)
        # Sabit sürümlü resmi imaj; hareketli etiket kullanma.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$IMAGE"
