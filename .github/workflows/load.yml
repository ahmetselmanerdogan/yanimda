name: load-smoke
# T-016 k6 duman testi (10 dk): her gece ve elle. PR'larda koşmaz (süre).
on:
  schedule: [{ cron: '0 2 * * *' }]
  workflow_dispatch:
    inputs:
      duration: { description: 'Süre (ör. 10m, 2m)', default: '10m' }

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 9.12.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y redis-server && sudo systemctl stop redis-server || true
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
        with: { k6-version: '0.54.0' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yanimda/contracts build
      - run: scripts/load-smoke.sh -e DURATION=${{ inputs.duration || '10m' }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: k6-summary, path: test-results/ }
