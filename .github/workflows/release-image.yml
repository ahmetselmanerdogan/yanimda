name: release-image
# T-081: API ve konsol imajları GHCR'ye itilir, Trivy'den geçer, cosign ile anahtarsız (OIDC) imzalanır, SBOM
# tasdiki eklenir (infra/k8s/kyverno-verify-images.yaml ikisini de doğrular). Konsol tek imaj: ortam yapılandırması
# çalışma zamanında /config.json (infra/console/Caddyfile). main'e her birleştirmede ve v* etiketlerinde. Doğrulama:
#   cosign verify ghcr.io/<owner>/yanimda-{api,console}@<digest> \
#     --certificate-identity-regexp 'https://github.com/<owner>/yanimda/.github/workflows/release-image.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yanimda-api
            dockerfile: apps/api/Dockerfile
          - image: yanimda-console
            dockerfile: infra/console/Dockerfile
    permissions:
      contents: read
      packages: write # GHCR
      id-token: write # cosign anahtarsız imza (Fulcio/Rekor)
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: İmajı kur (yerel, taramadan önce itilmez)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:scan
      - name: Trivy (yüksek/kritik açıkta itme yok)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "${{ matrix.image }}:scan"
      - id: push
        name: İt
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with: { cosign-release: v2.4.1 }
      - name: cosign imza (anahtarsız, digest üzerinden)
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: SBOM (SPDX) üret ve tasdik et
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
      - run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: İmzayı doğrula
        run: |
          cosign verify "${IMAGE}@${{ steps.push.outputs.digest }}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
