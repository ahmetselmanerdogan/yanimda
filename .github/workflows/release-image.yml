name: release-image
# T-081: API imajı GHCR'ye itilir, Trivy'den geçer, cosign ile anahtarsız (OIDC) imzalanır, SBOM tasdiki eklenir.
# main'e her birleştirmede ve v* etiketlerinde. Doğrulama:
#   cosign verify ghcr.io/<owner>/yanimda-api@<digest> \
#     --certificate-identity-regexp 'https://github.com/<owner>/yanimda/.github/workflows/release-image.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR
      id-token: write # cosign anahtarsız imza (Fulcio/Rekor)
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/yanimda-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: İmajı kur (yerel, taramadan önce itilmez)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: yanimda-api:scan
      - name: Trivy (yüksek/kritik açıkta itme yok)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress yanimda-api:scan
      - id: push
        name: İt
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
        with: { cosign-release: v2.4.1 }
      - name: cosign imza (anahtarsız, digest üzerinden)
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: SBOM (SPDX) üret ve tasdik et
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: İmzayı doğrula
        run: |
          cosign verify "${IMAGE}@${{ steps.push.outputs.digest }}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
